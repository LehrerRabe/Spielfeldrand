SPORTS.push({id:'rk', name:'Ringen und Kämpfen', bf:'BF 9 · Zweikampfsport', field:'mat',
L:{
u:{t:'Ringen und Kämpfen verstehen', s:[
['Fair kämpfen','Beim Ringen und Kämpfen in der Schule geht es darum, mit einem Partner seine Kräfte zu messen – nicht darum, ihm wehzutun. Deshalb gibt es feste [Rituale] und Regeln. Vor und nach jedem Kampf begrüßt man sich, zum Beispiel mit einer Verbeugung oder einem Handschlag. Ganz wichtig ist die [Stopp-Regel]: Wenn jemand „Stopp“ ruft oder auf die Matte oder den Partner klopft (das nennt man [Abklopfen]), wird sofort losgelassen. Verboten sind Schlagen, Treten, Beißen, Kratzen sowie Griffe an Kopf, Hals und Gelenken. Gekämpft wird nur auf [Matten], und alle Schmuckstücke werden vorher abgelegt.',
 [['Was bedeutet die Stopp-Regel?','Wenn jemand „Stopp“ ruft oder abklopft, wird sofort losgelassen.'],['Nenne drei Dinge, die beim Kämpfen in der Schule verboten sind.','Z. B. Schlagen, Treten, Beißen, Kratzen, Griffe an Kopf, Hals und Gelenken.']]],
['Kämpfen um Raum und Gegenstände','Bei vielen Kampfspielen geht es darum, den Partner aus einem Feld zu [schieben] oder ihm einen Gegenstand, etwa einen Ball oder ein Tuch, abzunehmen. Um stabil zu stehen, braucht man eine breite [Standfläche]: Die Füße stehen weit auseinander, ein Fuß etwas vor dem anderen. Die Knie sind gebeugt, damit der [Körperschwerpunkt] tief liegt. Wer aufrecht und mit eng zusammenstehenden Füßen kämpft, verliert leicht das Gleichgewicht. Beim Schieben drückt man aus den Beinen, nicht nur mit den Armen. Manchmal lohnt es sich auch, kurz [nachzugeben] und den Schwung des Partners zu nutzen.',
 [['Warum sollte man beim Kämpfen die Knie beugen?','Damit der Körperschwerpunkt tief liegt und man stabil steht.'],['Woher kommt die Kraft beim Schieben?','Aus den Beinen, nicht nur aus den Armen.']]],
['Fallen lernen','Wer kämpft, fällt auch einmal hin. Damit dabei nichts passiert, lernt man die [Fallschule]. Beim Fallen rückwärts nimmt man das [Kinn] auf die Brust, damit der Kopf nicht auf die Matte schlägt. Der Rücken wird rund gemacht, und man rollt ab. Kurz bevor der Rücken die Matte berührt, schlagen beide Arme mit den Handflächen kräftig auf die Matte. Dieses [Abschlagen] verteilt die Wucht des Aufpralls auf eine größere Fläche. Die Arme schlagen dabei etwa im Winkel von 45 Grad zum Körper auf. Man übt die Fallschule zuerst aus dem Sitzen, dann aus der Hocke und erst später aus dem [Stand].',
 [['Warum nimmt man beim Fallen das Kinn auf die Brust?','Damit der Kopf nicht auf die Matte schlägt.'],['Was bewirkt das Abschlagen mit den Armen?','Die Wucht des Aufpralls wird auf eine größere Fläche verteilt.']]],
['Judo – der sanfte Weg','Judo wurde 1882 von dem Japaner Kano [Jigoro] begründet. Das Wort bedeutet „sanfter Weg“. Kano wollte aus alten Kampfkünsten einen Sport machen, bei dem man sich nicht verletzt. Im Judo gibt es viele japanische Begriffe: Mit „[Rei]“ verbeugt man sich, mit „Hajime“ beginnt der Kampf, mit „[Matte]“ wird er unterbrochen. Die Person, die eine Technik ausführt, heißt [Tori], die Person, an der sie ausgeführt wird, heißt Uke. Judoka tragen einen Anzug, den Judogi, und einen Gürtel, dessen Farbe den Ausbildungsstand zeigt. Judo ist seit 1964 [olympisch].',
 [['Was bedeutet „Judo“ und wer hat es begründet?','„Sanfter Weg“; begründet 1882 von Kano Jigoro.'],['Was bedeuten „Rei“, „Hajime“ und „Matte“?','Rei: Verbeugung. Hajime: Beginn des Kampfes. Matte: Unterbrechung.']]]
]},
m:{t:'Ringen und Kämpfen: Technik und Regeln', s:[
['Gleichgewicht und Kraftübertragung','Ein Körper steht stabil, solange sein Schwerpunkt über der [Unterstützungsfläche] liegt, also der Fläche zwischen den Füßen. Im Zweikampf versucht man, den Partner aus diesem Gleichgewicht zu bringen. Im Judo nennt man das [Kuzushi]: Durch Ziehen oder Schieben wird der Schwerpunkt des Partners über den Rand seiner Unterstützungsfläche bewegt. Dann genügt wenig Kraft, um ihn zu werfen. Gleichzeitig schützt man das eigene Gleichgewicht mit einer breiten, flexiblen Stellung. Ein Prinzip des Judo lautet „Siegen durch [Nachgeben]“: Drückt der Partner, zieht man ihn in seine Bewegungsrichtung, statt dagegen zu drücken. So nutzt man seine Kraft für die eigene [Technik].',
 [['Wann steht ein Körper stabil?','Wenn sein Schwerpunkt über der Unterstützungsfläche liegt.'],['Erkläre das Prinzip „Siegen durch Nachgeben“.','Man drückt nicht gegen, sondern nutzt die Kraft des Partners, indem man ihn in seine Bewegungsrichtung zieht.']]],
['Haltegriffe und Befreiungen','Beim Bodenkampf versucht man, den Partner mit einem [Haltegriff] auf dem Rücken zu kontrollieren. Ein bekannter Haltegriff ist der [Kesa-Gatame], der Schärpenhaltegriff: Tori sitzt seitlich neben Uke, umfasst mit einem Arm den Nacken und hält mit dem anderen den Arm von Uke fest. Die Beine von Tori sind weit gespreizt, damit er stabil bleibt. Uke kann sich befreien, indem er eine [Brücke] macht, also die Hüfte kräftig hochdrückt, und sich dabei zur Seite dreht. Im Wettkampfjudo wird ein Haltegriff von [20] Sekunden mit Ippon, dem vollen Punkt, bewertet. Im Schulsport sind Würge- und Hebeltechniken grundsätzlich [verboten].',
 [['Beschreibe den Kesa-Gatame.','Tori sitzt seitlich neben Uke, umfasst den Nacken und hält Ukes Arm fest; Beine weit gespreizt.'],['Wie kann man sich aus einem Haltegriff befreien?','Mit einer Brücke (Hüfte hochdrücken) und gleichzeitiger Drehung zur Seite.']]],
['Würfe kontrolliert ausführen','Ein Wurf besteht aus drei Phasen: Gleichgewicht brechen (Kuzushi), [Eindrehen] in die Wurfposition (Tsukuri) und Ausführen des Wurfs (Kake). Ein Grundwurf ist der [O-Goshi], der große Hüftwurf: Tori dreht sich vor Uke ein, legt einen Arm um Ukes Rücken und hebt ihn über die eigene Hüfte. Damit Uke sicher fallen kann, hält Tori bis zur Landung Ukes [Ärmel] fest. So wird Uke kontrolliert abgelegt und kann abschlagen. Würfe werden nur auf einer ausreichend großen Mattenfläche und nur mit Partnern geübt, die die [Fallschule] beherrschen. Der Abstand zu anderen Paaren muss groß genug sein, damit niemand auf andere geworfen wird.',
 [['Nenne die drei Phasen eines Wurfs.','Kuzushi (Gleichgewicht brechen), Tsukuri (Eindrehen), Kake (Ausführen).'],['Warum hält Tori Ukes Ärmel bis zur Landung fest?','Damit Uke kontrolliert abgelegt wird und sicher fallen kann.']]],
['Wettkampfregeln und Fairness','Im Judo gibt es verschiedene Wertungen. Ein [Ippon] beendet den Kampf sofort, zum Beispiel nach einem Wurf, bei dem Uke mit Kraft, Schnelligkeit und Kontrolle auf dem Rücken landet. Ein [Waza-ari] ist eine kleinere Wertung; zwei Waza-ari ergeben einen Ippon. Für Regelverstöße oder Passivität gibt es eine Strafe, das [Shido]. Nach drei Shido verliert man den Kampf. Doch auch ohne Schiedsrichter gilt: Respekt vor dem Partner ist das Wichtigste. Im Judo zeigt sich das an den Ritualen und daran, dass man den Partner nie absichtlich verletzt. Man unterscheidet [Randori], das freie Üben mit dem Partner, und Shiai, den Wettkampf.',
 [['Was ist ein Ippon und wie kann man ihn noch erreichen?','Die höchste Wertung, die den Kampf beendet; auch durch zwei Waza-ari oder einen Haltegriff von 20 Sekunden.'],['Was passiert nach drei Shido?','Man verliert den Kampf.']]]
]},
o:{t:'Ringen und Kämpfen aus Sicht der Sportwissenschaft', s:[
['Aggression und Kampfsport','Die Psychologie unterscheidet [feindselige] Aggression, die das Ziel hat, jemandem zu schaden, und [instrumentelle] Aggression, bei der eine Handlung, die schaden könnte, nur Mittel zum Zweck ist, etwa um einen Kampf zu gewinnen. Regelgeleitetes Kämpfen ist im engeren Sinn keine Aggression, weil die Schädigung des Partners gerade nicht beabsichtigt ist und durch Regeln ausgeschlossen werden soll. Kritiker befürchten, dass Kampfsport aggressives Verhalten fördert. Studien zeigen jedoch, dass traditionelle Kampfkunst mit Ritualen und [Werteerziehung] eher mit geringerer Aggressivität verbunden ist. Entscheidend ist demnach die pädagogische [Rahmung]: Rituale, klare Regeln und Reflexion. Die Rahmenvorgaben für den Schulsport schließen deshalb Inhalte aus, bei denen Schlagen, Stoßen oder Treten im Mittelpunkt stehen.',
 [['Unterscheide feindselige und instrumentelle Aggression.','Feindselig: Ziel ist die Schädigung. Instrumentell: schädigende Handlung als Mittel zu einem anderen Zweck.'],['Beurteile, ob Kampfsport aggressives Verhalten fördert.','Abhängig von der Rahmung: Mit Ritualen, Regeln und Werteerziehung eher geringere Aggressivität; ohne diese Rahmung Risiko. Eigenes begründetes Urteil.']]],
['Taktik im Zweikampf','Im Zweikampf entscheidet nicht nur Kraft, sondern auch Taktik. Ein Grundprinzip ist [Aktion und Reaktion]: Jede Bewegung des Gegners bietet eine Gelegenheit. Drückt er nach vorne, kann man ihn nach vorne werfen. Eine [Finte] täuscht einen Angriff an, um eine Reaktion hervorzurufen, die man dann ausnutzt. Bei einer [Kombination] wird ein erster Angriff bewusst so gesetzt, dass die Abwehrreaktion den zweiten Angriff erleichtert. Beim [Kontern] wartet man auf den Angriff des Gegners und nutzt dessen Schwung. Diese Prinzipien beruhen auf Antizipation und schneller Informationsverarbeitung. Erfahrene Kämpfer erkennen [Muster] im Verhalten des Gegners früh und können darauf reagieren.',
 [['Erkläre den Unterschied zwischen Finte und Kombination.','Finte: Angriff wird nur angetäuscht, um eine Reaktion hervorzurufen. Kombination: echter erster Angriff, dessen Abwehrreaktion den zweiten Angriff erleichtert.'],['Was versteht man unter Kontern?','Den Angriff des Gegners abwarten und dessen Schwung für eine eigene Technik nutzen.']]],
['Körperliche Anforderungen und Gewichtsklassen','Ein Judo- oder Ringkampf verlangt [Maximalkraft] für Würfe und Haltegriffe, Kraftausdauer für das ständige Ziehen und Drücken und eine hohe anaerobe Kapazität für intensive Phasen. Weil das Körpergewicht im Zweikampf ein großer Vorteil ist, wird in [Gewichtsklassen] gekämpft. Viele Athleten versuchen, kurz vor dem Wiegen Gewicht zu verlieren, um in einer leichteren Klasse anzutreten. Dieses „[Gewichtmachen]“ geschieht oft durch Flüssigkeitsentzug, etwa in der Sauna. Es kann die Leistung verringern und gefährlich werden, weil [Dehydration] Kreislauf und Nieren belastet. Einige Verbände haben deshalb Regeln eingeführt, etwa ein zusätzliches Wiegen am Wettkampftag.',
 [['Warum wird im Zweikampfsport in Gewichtsklassen gekämpft?','Das Körpergewicht ist ein großer Vorteil; Gewichtsklassen sichern Chancengleichheit.'],['Beurteile das „Gewichtmachen“ aus gesundheitlicher Sicht.','Dehydration belastet Kreislauf und Nieren, kann die Leistung mindern und gefährlich werden; aus gesundheitlicher Sicht kritisch. Eigenes Urteil.']]],
['Kampfsport und Gesellschaft','Ringen gehörte schon zu den antiken Olympischen Spielen. Judo ist seit 1964 olympisch, Karate war 2021 in Tokio olympisch, ist danach aber wieder aus dem Programm genommen worden. Kampfsport wird aus unterschiedlichen Motiven betrieben: als [Wettkampfsport], zur Selbstverteidigung, zur Persönlichkeitsentwicklung oder als Fitnesstraining. Zwischen Selbstverteidigung und Sport gibt es wichtige Unterschiede: Im Sport schützen Regeln den Partner, in der Selbstverteidigung geht es um das Beenden einer [Bedrohung]. Im Schulsport stehen deshalb Formen im Mittelpunkt, die ohne Verletzungsabsicht auskommen. Kämpfen kann dabei [Selbstvertrauen], Körperwahrnehmung und einen respektvollen Umgang mit Nähe und Grenzen fördern.',
 [['Unterscheide Kampfsport und Selbstverteidigung.','Kampfsport: Regeln schützen den Partner, Ziel ist der Wettkampf. Selbstverteidigung: Ziel ist das Beenden einer Bedrohung.'],['Erläutere, welchen Beitrag Kämpfen im Schulsport leisten kann.','Selbstvertrauen, Körperwahrnehmung, respektvoller Umgang mit Nähe und Grenzen, Regelbewusstsein.']]]
]}
},

L:{
u:{t:'Ultimate Frisbee verstehen', s:[
['Das Spiel','Ultimate Frisbee ist ein Mannschaftsspiel mit einer Wurfscheibe. Auf dem Feld spielen zwei Teams mit je [sieben] Spielerinnen und Spielern. An beiden Enden des Feldes liegt eine [Endzone]. Ein Punkt wird erzielt, wenn eine Spielerin die Scheibe in der gegnerischen Endzone fängt. Mit der Scheibe in der Hand darf man nicht [laufen]; man muss stehen bleiben und darf sich nur auf einem Standbein drehen. Gepasst werden darf in jede Richtung. Fällt die Scheibe auf den Boden, wird sie abgefangen oder fliegt sie ins Aus, wechselt der Scheibenbesitz. Das nennt man einen [Turnover].',
 [['Wie erzielt man beim Ultimate einen Punkt?','Indem man die Scheibe in der gegnerischen Endzone fängt.'],['Was ist ein Turnover?','Der Wechsel des Scheibenbesitzes, z. B. wenn die Scheibe auf den Boden fällt, abgefangen wird oder ins Aus fliegt.']]],
['Werfen der Scheibe','Der einfachste Wurf ist die [Rückhand]. Man steht seitlich zur Wurfrichtung, die Wurfhand greift die Scheibe am Rand: Der Daumen liegt oben, die Finger darunter. Der Arm wird vor dem Körper zurückgeführt und dann nach vorne geschwungen. Am Ende schnappt das [Handgelenk] nach vorne, dadurch bekommt die Scheibe viel Drehung. Die Drehung ist sehr wichtig: Sie hält die Scheibe stabil in der Luft, ähnlich wie bei einem [Kreisel]. Die Scheibe sollte beim Abwurf [flach] liegen. Zeigt der Rand nach oben, steigt sie und fällt dann ab. Gezielt wird auf den Brustbereich des Mitspielers oder in den Raum vor ihm.',
 [['Wie wird die Scheibe bei der Rückhand gehalten?','Am Rand: Daumen oben, Finger darunter.'],['Warum ist die Drehung der Scheibe wichtig?','Sie hält die Scheibe stabil in der Luft, wie bei einem Kreisel.']]],
['Fangen','Die sicherste Art zu fangen ist der [Pfannkuchen]-Fang, auch Sandwich-Fang genannt. Dabei klatscht man die Scheibe mit beiden Händen zusammen, eine Hand oben, eine unten. Kommt die Scheibe sehr hoch oder sehr tief, fängt man sie mit einer Hand am Rand, im sogenannten [Krebsfang]: Daumen auf der einen, Finger auf der anderen Seite. Wichtig ist, die Scheibe bis in die Hände mit den [Augen] zu verfolgen. Man läuft der Scheibe entgegen, statt auf sie zu warten, damit kein Gegner dazwischenkommt. Nach dem Fangen muss man [abbremsen] und stehen bleiben, denn mit der Scheibe darf man nicht laufen.',
 [['Beschreibe den Pfannkuchen-Fang.','Die Scheibe wird mit beiden Händen zusammengeklatscht, eine Hand oben, eine unten.'],['Warum soll man der Scheibe entgegenlaufen?','Damit kein Gegner dazwischenkommt.']]],
['Spirit of the Game','Ultimate wird normalerweise ohne [Schiedsrichter] gespielt, sogar bei Weltmeisterschaften. Die Spielerinnen und Spieler entscheiden selbst, ob ein Foul passiert ist oder ob die Scheibe im Aus war. Das funktioniert nur mit Fairness und Ehrlichkeit. Diese Haltung heißt „[Spirit of the Game]“. Wer ein Foul gesehen hat, ruft „Foul“, und die Beteiligten [besprechen] die Situation ruhig. Können sie sich nicht einigen, wird die Situation wiederholt. Nach dem Spiel bewerten sich die Teams gegenseitig: Wie gut kannten sie die Regeln? Wie fair und respektvoll waren sie? So wird [Fairness] ein Teil des Spiels.',
 [['Was bedeutet „Spirit of the Game“?','Die Haltung von Fairness und Ehrlichkeit, mit der die Spieler ohne Schiedsrichter selbst entscheiden.'],['Was passiert, wenn sich die Spieler bei einem Foul nicht einigen können?','Die Situation wird wiederholt.']]]
]},
m:{t:'Ultimate Frisbee: Technik und Taktik', s:[
['Regeln im Detail','Jeder Punkt beginnt mit einem [Anwurf], dem Pull: Das verteidigende Team wirft die Scheibe weit in Richtung des angreifenden Teams. Der Werfer mit der Scheibe darf sich nur auf seinem [Standbein] drehen. Ein Verteidiger, der Marker, darf ihn bewachen und zählt laut bis zehn; das ist der [Stall Count]. Hat der Werfer bis „zehn“ nicht abgespielt, wechselt der Scheibenbesitz. Körperkontakt ist verboten: Ultimate ist ein [kontaktloser] Sport. Wer einen Gegenspieler beim Fangen oder Werfen berührt, begeht ein Foul. Auch ein Pass kann nicht aus der Hand eines anderen geschlagen werden, solange der Werfer die Scheibe hält.',
 [['Was ist der Stall Count?','Der Marker zählt laut bis zehn; hat der Werfer bis dahin nicht abgespielt, wechselt der Scheibenbesitz.'],['Was ist der Pull?','Der Anwurf zu Beginn jedes Punktes: Das verteidigende Team wirft die Scheibe weit in Richtung des Angriffs.']]],
['Die Vorhand','Neben der Rückhand ist die [Vorhand], auch Flick genannt, der wichtigste Wurf. Man hält die Scheibe mit Daumen oben und Zeige- und [Mittelfinger] unter dem Rand, die Finger zeigen zur Mitte der Scheibe. Der Wurf erfolgt seitlich neben dem Körper auf der Wurfarmseite. Entscheidend ist ein schneller Schnapp aus dem [Handgelenk], ähnlich wie beim Steinchenhüpfen auf dem Wasser. Der Ellbogen bleibt nah am Körper. Die Vorhand ermöglicht es, auf beiden Seiten des Markers vorbeizuwerfen. Gute Spieler können außerdem den [Überkopfwurf], bei dem die Scheibe über den Marker hinweg geworfen wird.',
 [['Wie wird die Scheibe bei der Vorhand gehalten?','Daumen oben, Zeige- und Mittelfinger unter dem Rand, zur Mitte zeigend.'],['Warum ist es wichtig, Vor- und Rückhand zu beherrschen?','Man kann auf beiden Seiten des Markers vorbeiwerfen.']]],
['Angriff: Stack und Cuts','Im Angriff stellen sich viele Teams im [Stack] auf: Die Spieler, die die Scheibe fangen sollen, stehen in einer Reihe in der Mitte des Feldes. So bleiben links und rechts große freie Räume. Aus dieser Reihe starten sie [Cuts], also schnelle Läufe in den freien Raum, um sich anzubieten. Ein guter Cut beginnt mit einer Täuschung: Man läuft kurz in eine Richtung und [startet] dann plötzlich in die andere. Die Spieler, die meist die Scheibe werfen, heißen [Handler]. Sie halten den Angriff in Bewegung. Damit sich die Läufer nicht behindern, ist [Kommunikation] wichtig: Wer startet wann? Nach einem Cut läuft man aus dem Raum, um Platz für den nächsten zu machen.',
 [['Was ist ein Stack?','Eine Aufstellung, bei der die Fänger in einer Reihe in der Feldmitte stehen, damit seitlich freie Räume bleiben.'],['Wie beginnt ein guter Cut?','Mit einer Täuschung: kurz in eine Richtung, dann plötzlich in die andere.']]],
['Verteidigung','In der [Manndeckung] hat jeder Verteidiger einen festen Gegenspieler. Der Marker beim Werfer versucht, Würfe in eine Richtung zu verhindern; er „zwingt“ den Werfer auf eine Seite. Das nennt man [Force]. Die übrigen Verteidiger wissen dadurch, auf welcher Seite Pässe wahrscheinlicher sind, und können ihre Gegner entsprechend decken. Eine andere Form ist die [Zonenverteidigung], bei der jeder einen Raum verteidigt; sie wird oft bei starkem Wind eingesetzt, weil lange Pässe dann schwieriger sind. Ein Verteidiger darf die Scheibe in der Luft abfangen oder herunterschlagen; dabei muss er aber Körperkontakt [vermeiden].',
 [['Was ist der Force in der Verteidigung?','Der Marker verhindert Würfe in eine Richtung und zwingt den Werfer auf eine Seite.'],['Wann wird oft Zonenverteidigung eingesetzt?','Bei starkem Wind, weil lange Pässe dann schwieriger sind.']]]
]},
o:{t:'Ultimate Frisbee aus Sicht der Sportwissenschaft', s:[
['Selbstregulierung und Fairness','Ultimate ist eine der wenigen Wettkampfsportarten, die auch auf höchstem Niveau [selbstreguliert] gespielt wird. Grundlage ist der „Spirit of the Game“. Nach dem Spiel bewerten sich die Teams in fünf Kategorien: [Regelkenntnis], Fouls und Körperkontakt, Fairness, positive Einstellung sowie Kommunikation. Aus sportwissenschaftlicher Sicht ist Ultimate ein Beispiel dafür, wie [informelle] Fairness – also Fairness, die über das Einhalten von Regeln hinausgeht – institutionell abgesichert werden kann. Kritisch wird diskutiert, ob Selbstregulierung bei hohem [Wettkampfdruck] funktioniert. Einige Profiligen setzen deshalb Beobachter oder Schiedsrichter ein, während internationale Turniere am Prinzip der Selbstverantwortung festhalten.',
 [['Erläutere, wie Ultimate informelle Fairness absichert.','Spieler entscheiden selbst und bewerten sich nach dem Spiel in fünf Spirit-Kategorien; Fairness wird so Teil der Wertung.'],['Beurteile, ob Selbstregulierung auch bei hohem Wettkampfdruck funktioniert.','Pro: fördert Verantwortung und Respekt. Contra: Druck und Interessen können zu strittigen Calls führen. Eigenes begründetes Urteil.']]],
['Physik der Wurfscheibe','Eine Wurfscheibe fliegt wie eine Mischung aus Tragfläche und Kreisel. Ihr gewölbtes Profil erzeugt beim Vorwärtsflug einen [Auftrieb]: Die Luft strömt über die Oberseite schneller als unter der Unterseite, wodurch ein Druckunterschied entsteht. Der [Anstellwinkel], also die Neigung der Scheibe zur Flugrichtung, beeinflusst Auftrieb und Luftwiderstand. Ohne Drehung würde die Scheibe nach kurzer Zeit kippen, weil der Auftrieb nicht genau im Schwerpunkt angreift. Die Drehung erzeugt einen [Drehimpuls], der die Scheibe stabilisiert; man spricht von [Kreiselstabilität]. Je schneller die Scheibe rotiert, desto stabiler fliegt sie. Am Ende des Fluges, wenn die Geschwindigkeit sinkt, neigt sie sich trotzdem zur Seite.',
 [['Erkläre, warum eine Wurfscheibe Auftrieb erzeugt.','Durch ihr gewölbtes Profil strömt Luft über die Oberseite schneller; es entsteht ein Druckunterschied.'],['Warum ist die Rotation für den Flug wichtig?','Der Drehimpuls stabilisiert die Scheibe (Kreiselstabilität); ohne Rotation würde sie kippen.']]],
['Spielvermittlung','Ultimate eignet sich gut für den Schulsport, weil die Grundregeln einfach sind und Mädchen und Jungen gleichermaßen gute Voraussetzungen haben. Nach dem Ansatz [Teaching Games for Understanding] wird zunächst ein vereinfachtes Spiel gespielt, aus dem sich taktische Probleme ergeben, etwa: „Wie komme ich frei?“ Danach werden [Techniken] wie Vorhand oder Cut gezielt geübt. Eine mögliche Spielreihe beginnt mit Parteiball mit der Scheibe ohne Laufen, geht über Spiele mit Zielzonen in kleinen Teams bis zum [7:7] auf dem großen Feld. Zusätzlich kann der Spirit-Gedanke schrittweise eingeführt werden, indem Schülerinnen und Schüler Foulentscheidungen selbst treffen und nach dem Spiel [reflektieren].',
 [['Warum eignet sich Ultimate gut für den Schulsport?','Einfache Grundregeln, kontaktlos, ähnliche Voraussetzungen für alle, Fairnesserziehung durch Selbstregulierung.'],['Beschreibe eine mögliche Spielreihe für Ultimate.','Parteiball mit Scheibe ohne Laufen → Spiele mit Zielzonen in kleinen Teams → 7:7 auf großem Feld.']]],
['Leistungsstruktur','Ultimate ist ein [intermittierendes] Spiel: Kurze Sprints, abrupte Richtungswechsel und Sprünge wechseln mit Phasen geringer Intensität. Leistungsbestimmend sind daher Schnelligkeit, [Antrittsschnelligkeit] und Sprungkraft, aber auch eine gute Grundlagenausdauer, weil Turniere oft mehrere Spiele an einem Tag umfassen. Die Würfe verlangen eine hohe [Koordination] und Präzision, oft unter Zeitdruck durch den Stall Count. Ultimate ist seit 2001 Teil der [World Games], eines internationalen Multisportereignisses. Im Vergleich zu anderen Endzonenspielen ist die Verletzungsrate durch das Kontaktverbot eher niedrig; typische Verletzungen betreffen Sprung- und Kniegelenk bei Richtungswechseln.',
 [['Welche konditionellen Fähigkeiten sind im Ultimate leistungsbestimmend?','Schnelligkeit, Antrittsschnelligkeit, Sprungkraft und Grundlagenausdauer.'],['Warum ist die Verletzungsrate vergleichsweise niedrig?','Körperkontakt ist verboten.']]]
]}
},

function poseSvg(name, solution, lit){
  const P=POSES[name]; if(!P) return '';
  const C=lit?{ink:'#15212A',far:'#8A99A1',prop:'#E3A912',mark:'#B8402B',good:'#22804A',water:'#DCEAF8',mat:'#D3DDD9',sand:'#EFE2C2',bg:'#FFFFFF',acc:'#1D5BB8'}
    :{ink:'var(--ink)',far:'var(--muted)',prop:'var(--court-yellow)',mark:'var(--bad)',good:'var(--good)',water:'var(--accent-soft)',mat:'var(--line)',sand:'var(--sand)',bg:'var(--surface)',acc:'var(--accent)'};
  const j=P.j; let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400" role="img" aria-label="Schematische Darstellung">`;
  s+=`<rect width="300" height="200" fill="${C.bg}"/>`;
  const pr=P.pr||[];
  for(const q of pr){ if(q.t==='water') s+=`<rect x="0" y="${q.y}" width="300" height="${200-q.y}" fill="${C.water}"/><path d="M0 ${q.y} q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="${C.acc}" stroke-width="1.5"/>`;
    if(q.t==='mat') s+=`<rect x="40" y="${q.y}" width="220" height="${Math.max(6,196-q.y)}" rx="3" fill="${C.mat}"/>`;
    if(q.t==='sand') s+=`<rect x="40" y="${q.y}" width="240" height="${196-q.y}" fill="${C.sand}"/>`; }
  if(!pr.some(q=>['water','mat','sand'].includes(q.t))) s+=`<line x1="20" y1="186" x2="280" y2="186" stroke="${C.far}" stroke-width="1.5"/>`;
  const L=(a,b,c,w=5)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const sh1=j.s2||j.n, sh2=j.s1||j.n;
  // hintere Gliedmaßen
  s+=L(sh1,j.e2,C.far)+L(j.e2,j.w2,C.far)+L(j.p,j.k2,C.far)+L(j.k2,j.f2,C.far);
  // Rumpf
  if(P.curve) s+=`<path d="M${j.p[0]} ${j.p[1]} Q${P.curve[0]} ${P.curve[1]} ${j.n[0]} ${j.n[1]}" fill="none" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
  else s+=L(j.p,j.n,C.ink,6);
  if(j.s1) s+=L(j.s1,j.s2,C.ink,5)+L(j.n,j.h,C.ink,4);
  s+=`<circle cx="${j.h[0]}" cy="${j.h[1]}" r="11" fill="${C.bg}" stroke="${C.ink}" stroke-width="4"/>`;
  // vordere Gliedmaßen
  s+=L(sh2,j.e1,C.ink)+L(j.e1,j.w1,C.ink)+L(j.p,j.k1,C.ink)+L(j.k1,j.f1,C.ink);
  for(const q of pr){
    if(q.t==='ball') s+=`<circle cx="${q.x}" cy="${q.y}" r="${q.r}" fill="${C.prop}" stroke="${C.ink}" stroke-width="1.5"/>`;
    if(q.t==='line') s+=`<line x1="${q.x1}" y1="${q.y1}" x2="${q.x2}" y2="${q.y2}" stroke="${q.dash?C.far:C.ink}" stroke-width="${q.w||3}" ${q.dash?'stroke-dasharray="4 4"':''} stroke-linecap="round"/>`;
    if(q.t==='net') s+=`<path d="M${q.x1} ${q.y1} l4 14 l16 0 l4 -14" fill="none" stroke="${C.far}" stroke-width="1.5"/>`;
    if(q.t==='racket'){ const a=Math.atan2(q.y2-q.y1,q.x2-q.x1)*180/Math.PI; s+=`<line x1="${q.x1}" y1="${q.y1}" x2="${q.x2}" y2="${q.y2}" stroke="${C.ink}" stroke-width="3"/><ellipse cx="${q.x2+(q.x2-q.x1)*0.35}" cy="${q.y2+(q.y2-q.y1)*0.35}" rx="12" ry="8" transform="rotate(${a} ${q.x2+(q.x2-q.x1)*0.35} ${q.y2+(q.y2-q.y1)*0.35})" fill="none" stroke="${C.ink}" stroke-width="2.5"/>`; }
    if(q.t==='shuttle') s+=`<path d="M${q.x} ${q.y} l-6 -8 l12 0 z" fill="${C.bg}" stroke="${C.ink}" stroke-width="1.5"/><circle cx="${q.x}" cy="${q.y+1}" r="3" fill="${C.ink}"/>`;
    if(q.t==='disc') s+=`<ellipse cx="${q.x}" cy="${q.y}" rx="14" ry="5" transform="rotate(${q.rot} ${q.x} ${q.y})" fill="${C.prop}" stroke="${C.ink}" stroke-width="1.5"/>`;
  }
  for(const l of (P.lb||[])) s+=`<text x="${l[0]}" y="${l[1]}" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="${C.ink}">${l[2]}</text>`;
  if(solution){
    for(const a of (P.ax||[])){ if(a[2]===0&&a[3]===0) s+=`<circle cx="${a[0]}" cy="${a[1]}" r="9" fill="none" stroke="${C.good}" stroke-width="2.5" stroke-dasharray="4 3"/>`; else s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="${C.good}" stroke-width="2.5" stroke-dasharray="6 5"/>`; }
    for(const m of (P.mk||[])) s+=`<circle cx="${m[0]}" cy="${m[1]}" r="${m[2]}" fill="none" stroke="${C.mark}" stroke-width="3"/>`;
  }
  return s+'</svg>';
}

/* ---------- SHA-256 (für den Passwortschutz) ---------- */
function sha256(str){
  const bytes=Array.from(new TextEncoder().encode(str));
  const primes=[];for(let n=2;primes.length<64;n++){if(primes.every(p=>n%p))primes.push(n);}
  const frac=x=>((x-Math.floor(x))*4294967296)>>>0;
  const H=primes.slice(0,8).map(p=>frac(Math.sqrt(p))), K=primes.map(p=>frac(Math.cbrt(p)));
  const l=bytes.length*8; bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(Math.floor(l/Math.pow(2,8*i))&255);
  const rot=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bytes.length;o+=64){
    const W=new Array(64);
    for(let t=0;t<16;t++) W[t]=((bytes[o+4*t]<<24)|(bytes[o+4*t+1]<<16)|(bytes[o+4*t+2]<<8)|bytes[o+4*t+3])>>>0;
    for(let t=16;t<64;t++){const s0=rot(W[t-15],7)^rot(W[t-15],18)^(W[t-15]>>>3), s1=rot(W[t-2],17)^rot(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const S1=rot(e,6)^rot(e,11)^rot(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])>>>0, S0=rot(a,2)^rot(a,13)^rot(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0; h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
window.__sha256=sha256;

/* ---------- Download ---------- */
let dlPromise=Promise.resolve(null);
try{ if(window.claude&&typeof window.claude.use==='function'){ dlPromise=window.claude.use('downloads').catch(()=>null); } }catch(e){}
let LAST_SAVE=Promise.resolve(false);
function saveBlob(name,blob){ LAST_SAVE=doSave(name,blob); return LAST_SAVE; }
async function doSave(name,blob){
  let d=null; try{ d=await dlPromise; }catch(e){}
  let ok=false;
  if(d){ try{ await d.save({filename:name,data:blob}); toast('PDF gespeichert'); ok=true; }catch(e){ toast(e&&e.code==='declined'?'Speichern abgebrochen':'Speichern ist hier nicht möglich'); } }
  else { try{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('PDF wird heruntergeladen'); ok=true; }catch(e){ toast('Speichern ist hier nicht möglich'); } }
  if(ok&&CUR) CUR.saved=true;
  return ok;
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- Codes ---------- */
function parseCode(c){
  c=(c||'').trim().toLowerCase().replace(/^#/,'');
  const p=c.split('-');
  if(p[0]==='rad'&&p.length===4&&(p[1]==='zz'||sportById(p[1]))&&LV.includes(p[2])&&DURS.includes(p[3])) return {wheel:true,sport:p[1],lv:p[2],dur:p[3]};
  if(p[0]==='txt'&&p.length===4&&sportById(p[1])&&LV.includes(p[2])&&DURS.includes(p[3])) return {txt:true,sport:p[1],lv:p[2],dur:p[3]};
  if(p.length===4&&sportById(p[0])&&LV.includes(p[1])&&typeById(p[2])&&DURS.includes(p[3])) return {sport:p[0],lv:p[1],type:p[2],dur:p[3]};
  return null;
}
const baseUrl=()=>{ const s=store.get('base',''); return (s||location.href).split('#')[0]; };

/* ---------- Text-Hilfen ---------- */
const parts=x=>x.split(/\[([^\]]+)\]/).map((s,i)=>i%2?{g:s.split('|')}:{t:s});
const plain=x=>x.replace(/\[([^\]|]+)(\|[^\]]*)?\]/g,'$1');
const norm=s=>s.toLowerCase().replace(/[„“”"'.,;:!?()]/g,'').replace(/\s+/g,' ').trim();
const secs=(sp,lv,dur)=>sp.L[lv].s.slice(0,NSEC[dur]);
const allQ=(sp,lv,dur)=>secs(sp,lv,dur).flatMap(s=>s[2]);

/* ---------- PDF ---------- */
const pdfSafe=s=>String(s).replace(/[„“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/→/g,'->').replace(/₂/g,'2').replace(/[^\x00-\xFF]/g,'');
function makePdf(sportName,title){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const M=18,W=210-2*M; let y=20;
  const need=h=>{ if(y+h>282){ doc.addPage(); y=20; } };
  const api={
    head(){ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(90); doc.text(pdfSafe(sportName.toUpperCase()),M,y); y+=7;
      doc.setFontSize(18); doc.setTextColor(20); const l=doc.splitTextToSize(pdfSafe(title),W); doc.text(l,M,y); y+=l.length*7+2;
      doc.setDrawColor(29,91,184); doc.setLineWidth(.8); doc.line(M,y,M+W,y); y+=8; return api; },
    h(t){ need(14); doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(20); const l=doc.splitTextToSize(pdfSafe(t),W); doc.text(l,M,y); y+=l.length*5.6+1.5; return api; },
    p(t,opt={}){ doc.setFont('helvetica',opt.bold?'bold':(opt.italic?'italic':'normal')); const fs=opt.size||11; doc.setFontSize(fs); doc.setTextColor(...(opt.color||[30,30,30]));
      const lh=fs*0.47; const l=doc.splitTextToSize(pdfSafe(t||'-'),W-(opt.indent||0)); for(const line of l){ need(lh+0.4); doc.text(line,M+(opt.indent||0),y); y+=lh; } y+=opt.after??2.5; return api; },
    gap(n=3){ y+=n; return api; },
    page(){ doc.addPage(); y=20; return api; },
    img(data,ratio,w){ const ww=w||W, h=ww*ratio; need(h+4); doc.addImage(data,'PNG',M,y,ww,h); y+=h+5; return api; },
    save(name){ return saveBlob(name,doc.output('blob')); }
  };
  return api;
}
const fileName=(sp,t)=>(sp.name+' - '+t).replace(/[\/\\:*?"<>|]/g,'').replace(/\s+/g,' ')+'.pdf';
function svgToPng(svg,w=900,h=600){
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h); try{res(c.toDataURL('image/png'));}catch(e){res(null);} }; img.onerror=()=>res(null); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
}

/* ---------- Lehrkraft-Ansicht ---------- */
function renderTeacher(){
  const app=$('#app'); document.body.classList.add('bgimg');
  const sportTiles=SPORTS.map(s=>`<button class="tile" data-sport="${s.id}" aria-pressed="${T.sport===s.id}"><span class="tname">${sportIcon(s.id)}<b>${esc(s.name)}</b></span><small>${esc(s.bf)}</small></button>`).join('')

    +`<button class="tile rand" data-type="zz" aria-pressed="${T.type==='zz'}"><span class="tname">${sportIcon('zz')}<b>Zufall</b></span><small>Die Seite wählt einen Aufgabentyp</small></button>`;
  app.innerHTML=`
  <header class="top"><div class="brand"><span class="eyebrow">Aufgaben für die Bank</span><h1>Spielfeldrand</h1></div>
   <a class="note" href="#start">Code eingeben (Schüler)</a></header>
  ${linesHtml()}
  <p class="muted" style="max-width:62ch">Wer heute nicht mitmachen kann, bekommt eine Aufgabe, die die ganze Stunde trägt. Auswahl treffen, QR-Code zeigen, scannen lassen.</p>
  <div class="stack" style="margin-top:26px">
   <section class="step"><div class="step-head"><span class="step-no">1</span><h2>Modus</h2></div>
    <div class="seg" role="group" aria-label="Modus"><button data-mode="fix" aria-pressed="${T.mode==='fix'}">Aufgabe festlegen</button><button data-mode="rad" aria-pressed="${T.mode==='rad'}">Glücksrad</button></div></section>
   <section class="step"><div class="step-head"><span class="step-no">2</span><h2>Länge der Stunde</h2></div>
    <div class="seg" role="group" aria-label="Länge der Stunde">${DURS.map(d=>`<button data-dur="${d}" aria-pressed="${T.dur===d}">${d} Minuten</button>`).join('')}</div></section>
   <section class="step"><div class="step-head"><span class="step-no">3</span><h2>Jahrgangsstufe</h2></div>
    <div class="seg" role="group" aria-label="Jahrgangsstufe">${LV.map(l=>`<button data-lv="${l}" aria-pressed="${T.lv===l}">${LEVELS[l].name}</button>`).join('')}</div></section>
   <section class="step"><div class="step-head"><span class="step-no">4</span><h2>Sportart</h2></div><div class="grid">${sportTiles}</div></section>
   <section class="step"><div class="step-head"><span class="step-no">5</span><h2>Aufgabentyp</h2></div>
    ${T.mode==='rad'?`<div class="wheelnote">Im Glücksrad-Modus dreht die Schülerin bzw. der Schüler selbst und landet zufällig auf einer der ${TYPES.length} Kategorien. Unter dem Rad sieht sie bzw. er alle Kategorien.</div>`:`<div class="grid">${typeTiles}</div>`}</section>
   <button class="btn primary big" id="go">QR-Code anzeigen</button>
   <details class="card"><summary><b>Einstellungen</b></summary>
    <div class="field" style="margin-top:12px"><label for="base">Adresse dieser Seite für den QR-Code</label>
     <input type="url" id="base" placeholder="https://…" value="${esc(store.get('base',''))}">
     <p class="note">Trage den Link ein, über den die Schüler-iPads die Seite öffnen (z. B. den geteilten Link oder später die GitHub-Adresse). Leer lassen = aktuelle Adresse.</p></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="logout">Lehrkraft-Ansicht sperren</button></div>
   </details>
  </div>`;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{T.mode=b.dataset.mode;persist();renderTeacher();});
  app.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{T.dur=b.dataset.dur;persist();renderTeacher();});
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{T.lv=b.dataset.lv;persist();renderTeacher();});
  app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{T.sport=b.dataset.sport;persist();renderTeacher();});
  app.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{T.type=b.dataset.type;persist();renderTeacher();});
  $('#base').onchange=e=>store.set('base',e.target.value.trim());
  $('#logout').onclick=()=>{ sess.set('ok','0'); renderLock(); };
  $('#go').onclick=showQr;
}
function closeLayer(){ $('#layer').innerHTML=''; }
function showQr(){
  let code,label,sp=null,type=null;
  if(T.mode==='rad'){ code=`rad-${T.sport}-${T.lv}-${T.dur}`; label=`Glücksrad · ${T.sport==='zz'?'Sportart zufällig':sportById(T.sport).name} · ${LEVELS[T.lv].name} · ${T.dur} Min.`; }
  else { sp=T.sport==='zz'?pick(SPORTS):sportById(T.sport); type=T.type==='zz'?pick(TYPES):typeById(T.type); code=`${sp.id}-${T.lv}-${type.id}-${T.dur}`; label=`${sp.name} · ${type.name} · ${LEVELS[T.lv].name} · ${T.dur} Min.`; }
  const url=baseUrl()+'#'+code;
  $('#layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="QR-Code"><div class="panel">

      <button class="btn primary" id="close">Schließen</button></div>
    ${type&&type.id==='ld'?`<p class="note">Lauftext auf einem zweiten Gerät: Code <b>TXT-${sp.id.toUpperCase()}-${T.lv.toUpperCase()}-${T.dur}</b></p>`:''}

/* Laufdiktat */
function lcsMarks(orig,mine){
  const a=orig.map(norm), b=mine.map(norm), n=a.length, m=b.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=a[i]&&a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]&&a[i]===b[j]){hit[i]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return hit;
}

      <p class="note">Du darfst gehen statt laufen. Tippe nach jedem Weg auf „+1 Weg“. Heute: ${S.length} Abschnitte${Q.length?', danach Fragen zum Text':''}.</p></div>
    <div class="laps"><button class="btn" id="minus" aria-label="Einen Weg abziehen">−</button><span class="lapcount" id="lc">0</span><button class="btn primary" id="plus">+1 Weg</button><span class="muted">Wege zum Text</span></div>
    ${S.map((s,i)=>`<div class="q"><label class="qt" for="ld${i}">Abschnitt ${i+1}: ${esc(s[0])}</label><textarea id="ld${i}" style="min-height:200px" spellcheck="false" autocapitalize="sentences"></textarea><div class="card diff reading" id="cmp${i}" hidden></div></div>`).join('')}
    ${Q.length?`<div class="part"><h2>Teil 2: Fragen zum Text</h2><p class="muted">Beantworte die Fragen erst, wenn alle Abschnitte geschrieben sind.</p>${Q.map((q,i)=>ta('x'+i,`${i+1}. ${q[0]}`)).join('')}${dur==='90'?ta('xs','Fasse den gesamten Text in eigenen Worten zusammen (8–10 Sätze).'):''}</div>`:''}
    <button class="btn primary big" id="check">Fertig – mit dem Original vergleichen</button>${doneBlock('Rot markierte Wörter fehlen in deinem Text oder sind anders geschrieben.')}`);
  const upd=()=>$('#lc').textContent=laps;

  $('#check').onclick=()=>{

      $('#cmp'+i).hidden=false; $('#ld'+i).readOnly=true; });
    Q.forEach((q,i)=>{ const t=$('#x'+i); t.readOnly=true; t.insertAdjacentHTML('afterend',`<div class="sol"><b>Musterlösung:</b> ${esc(q[1])}</div>`); });
    $$('textarea').forEach(t=>t.readOnly=true);
    $('#check').hidden=true; $('#done').hidden=false; $('#res').textContent=`${ok} von ${tot} Wörtern richtig · ${laps} ${laps===1?'Weg':'Wege'}`;
    $('#pdf').onclick=()=>{
      const pdf=makePdf(sp.name,'Laufdiktat: '+sp.L[lv].t).head().p(`Ergebnis: ${ok} von ${tot} Wörtern richtig, ${laps} ${laps===1?'Weg':'Wege'} zum Text.`,{bold:true});
      R.forEach((r,i)=>pdf.h(`Abschnitt ${i+1}: ${r.h} (${r.o} von ${r.n})`).p('Mein Text: '+(r.mine||'(leer)')).p('Original: '+r.text,{color:[34,110,70]}).p('Fehlende oder abweichende Wörter: '+(r.miss.join(', ')||'keine'),{size:9.5,color:[120,60,40]}));
      Q.forEach((q,i)=>pdf.h(`${i+1}. ${q[0]}`).p('Meine Antwort: '+(val('x'+i)||'(keine Antwort)'),{after:1}).p('Musterlösung: '+q[1],{italic:true,color:[34,110,70]}));

/* Skizze */
const CW=900,CH=600;
function drawField(ctx,kind){
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='#9AA8AE'; ctx.lineWidth=3; ctx.fillStyle='#9AA8AE'; ctx.setLineDash([]);
  const m=40,x0=m,y0=m,w=CW-2*m,h=CH-2*m,cx=CW/2,cy=CH/2;
  const rect=(x,y,a,b)=>ctx.strokeRect(x,y,a,b);
  const circ=(x,y,r,s=0,e=Math.PI*2)=>{ctx.beginPath();ctx.arc(x,y,r,s,e);ctx.stroke();};
  const line=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();};
  const txt=(t,x,y)=>{ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y);};
  if(kind==='fussball'){ rect(x0,y0,w,h); line(cx,y0,cx,y0+h); circ(cx,cy,70); rect(x0,cy-150,120,300); rect(x0+w-120,cy-150,120,300); rect(x0,cy-70,45,140); rect(x0+w-45,cy-70,45,140); rect(x0-14,cy-36,14,72); rect(x0+w,cy-36,14,72); }
  else if(kind==='basket'){ rect(x0,y0,w,h); line(cx,y0,cx,y0+h); circ(cx,cy,55); rect(x0,cy-75,175,150); rect(x0+w-175,cy-75,175,150); circ(x0+175,cy,75,-Math.PI/2,Math.PI/2); circ(x0+w-175,cy,75,Math.PI/2,Math.PI*1.5);
    circ(x0+50,cy,230,-Math.PI/2+.35,Math.PI/2-.35); circ(x0+w-50,cy,230,Math.PI/2+.35,Math.PI*1.5-.35); circ(x0+50,cy,9); circ(x0+w-50,cy,9); }
  else if(kind==='hand'){ rect(x0,y0,w,h); line(cx,y0,cx,y0+h);
    const D=(gx,dir,r)=>{ ctx.beginPath(); if(dir>0){ ctx.arc(gx,cy-35,r,-Math.PI/2,0,false); ctx.lineTo(gx+r,cy+35); ctx.arc(gx,cy+35,r,0,Math.PI/2,false);} else { ctx.arc(gx,cy-35,r,-Math.PI/2,-Math.PI,true); ctx.lineTo(gx-r,cy+35); ctx.arc(gx,cy+35,r,Math.PI,Math.PI/2,true);} ctx.stroke(); };
    for(const [gx,dir] of [[x0,1],[x0+w,-1]]){ D(gx,dir,135); ctx.setLineDash([12,10]); D(gx,dir,200); ctx.setLineDash([]); line(gx+dir*155,cy-8,gx+dir*155,cy+8); rect(dir>0?gx-14:gx,cy-35,14,70); } }
  else if(kind==='volley'){ const vw=w, vh=vw/2>h?h:vw/2; const vy=cy-vh/2; rect(x0,vy,vw,vh); ctx.lineWidth=6; ctx.strokeStyle='#5F6E75'; line(cx,vy-20,cx,vy+vh+20); ctx.lineWidth=3; ctx.strokeStyle='#9AA8AE'; line(cx-vw/6,vy,cx-vw/6,vy+vh); line(cx+vw/6,vy,cx+vw/6,vy+vh); }
  else if(kind==='badminton'){ const bw=w,bh=Math.min(h,bw*6.1/13.4),by=cy-bh/2,s=bw/13.4; rect(x0,by,bw,bh); line(x0,by+.46*s,x0+bw,by+.46*s); line(x0,by+bh-.46*s,x0+bw,by+bh-.46*s); ctx.lineWidth=6; ctx.strokeStyle='#5F6E75'; line(cx,by-18,cx,by+bh+18); ctx.lineWidth=3; ctx.strokeStyle='#9AA8AE';
    line(cx-1.98*s,by,cx-1.98*s,by+bh); line(cx+1.98*s,by,cx+1.98*s,by+bh); line(x0+.76*s,by,x0+.76*s,by+bh); line(x0+bw-.76*s,by,x0+bw-.76*s,by+bh); line(x0,cy,cx-1.98*s,cy); line(cx+1.98*s,cy,x0+bw,cy); }
  else if(kind==='pool'){ rect(x0,y0,w,h); const n=6; ctx.setLineDash([16,12]); for(let i=1;i<n;i++) line(x0,y0+i*h/n,x0+w,y0+i*h/n); ctx.setLineDash([]); ctx.font='bold 20px sans-serif'; for(let i=0;i<n;i++) ctx.fillText(String(i+1),x0+8,y0+i*h/n+h/n/2+7); }
  else if(kind==='ultimate'){ rect(x0,y0,w,h); const ez=w*0.17; line(x0+ez,y0,x0+ez,y0+h); line(x0+w-ez,y0,x0+w-ez,y0+h); txt('Endzone',x0+ez/2,cy); txt('Endzone',x0+w-ez/2,cy); }
  else if(kind==='stage'){ rect(x0,y0,w,h-50); ctx.setLineDash([8,8]); line(cx,y0,cx,y0+h-50); line(x0,y0+(h-50)/2,x0+w,y0+(h-50)/2); ctx.setLineDash([]); txt('Publikum',cx,y0+h-10); }
  else if(kind==='mat'){ rect(x0+150,y0,w-300,h); ctx.setLineDash([10,8]); rect(x0+230,y0+80,w-460,h-160); ctx.setLineDash([]); txt('Mattenfläche',cx,y0+h+30>CH?CH-10:y0+h-10); }
  else { ctx.lineWidth=1; ctx.strokeStyle='#E1E7EA'; for(let x=0;x<=CW;x+=50) line(x,0,x,CH); for(let y=0;y<=CH;y+=50) line(0,y,CW,y); }
}
function makeCanvas(wrap,kind){
  let tool='blue'; const items=[]; let cur=null,nA=0,nB=0;
  const tools=[['blue','Laufweg','var(--accent)'],['red','Ball-/Passweg','var(--court-red)'],['A','Spieler','var(--accent)'],['B','Gegner','var(--court-red)'],['ball','Ball/Gerät','var(--court-yellow)']];
  wrap.innerHTML=`<div class="toolbar" role="group" aria-label="Zeichenwerkzeug">${tools.map(t=>`<button class="tool" data-tool="${t[0]}" aria-pressed="${t[0]===tool}"><span class="dot" style="background:${t[2]}"></span>${t[1]}</button>`).join('')}<button class="tool" data-act="undo">Rückgängig</button><button class="tool" data-act="clear">Alles löschen</button></div>
    <div class="canvas-wrap"><canvas width="${CW}" height="${CH}" aria-label="Zeichenfläche"></canvas></div>`;
  const cv=wrap.querySelector('canvas'), ctx=cv.getContext('2d'); const C={blue:'#1D5BB8',red:'#C2412D',ball:'#E3A912'};
  const arrow=p=>{ if(p.length<2) return; const [x1,y1]=p[p.length-1]; let k=p.length-2; while(k>0&&Math.hypot(p[k][0]-x1,p[k][1]-y1)<18) k--; const [x0,y0]=p[k]; const a=Math.atan2(y1-y0,x1-x0); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-18*Math.cos(a-.45),y1-18*Math.sin(a-.45)); ctx.lineTo(x1-18*Math.cos(a+.45),y1-18*Math.sin(a+.45)); ctx.closePath(); ctx.fill(); };
  function redraw(){ drawField(ctx,kind);
    for(const it of items){
      if(it.t==='line'){ ctx.strokeStyle=ctx.fillStyle=C[it.c]; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash(it.c==='red'?[14,10]:[]); ctx.beginPath(); it.p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke(); ctx.setLineDash([]); arrow(it.p); }
      else if(it.t==='A'){ ctx.fillStyle=C.blue; ctx.beginPath(); ctx.arc(it.x,it.y,18,0,7); ctx.fill(); ctx.fillStyle='#FFF'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(it.n,it.x,it.y+1); ctx.textBaseline='alphabetic'; }
      else if(it.t==='B'){ ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(it.x-14,it.y-14); ctx.lineTo(it.x+14,it.y+14); ctx.moveTo(it.x+14,it.y-14); ctx.lineTo(it.x-14,it.y+14); ctx.stroke(); ctx.fillStyle=C.red; ctx.font='bold 15px sans-serif'; ctx.textAlign='left'; ctx.fillText(it.n,it.x+16,it.y-10); }
      else if(it.t==='ball'){ ctx.fillStyle=C.ball; ctx.strokeStyle='#5F4A00'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(it.x,it.y,10,0,7); ctx.fill(); ctx.stroke(); }
    } }
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height]; };
  cv.addEventListener('pointerdown',e=>{ if(cv.dataset.lock) return; e.preventDefault(); const [x,y]=pos(e);
    if(tool==='blue'||tool==='red'){ cur={t:'line',c:tool,p:[[x,y]]}; items.push(cur); cv.setPointerCapture(e.pointerId); }
    else if(tool==='A') items.push({t:'A',x,y,n:++nA}); else if(tool==='B') items.push({t:'B',x,y,n:++nB}); else items.push({t:'ball',x,y}); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; const [x,y]=pos(e); const l=cur.p[cur.p.length-1]; if(Math.hypot(x-l[0],y-l[1])>3){ cur.p.push([x,y]); redraw(); } });
  const end=()=>{ cur=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  wrap.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{ tool=b.dataset.tool; wrap.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  wrap.querySelector('[data-act=undo]').onclick=()=>{ const it=items.pop(); if(it&&it.t==='A') nA--; if(it&&it.t==='B') nB--; redraw(); };
  wrap.querySelector('[data-act=clear]').onclick=()=>{ items.length=0; nA=nB=0; redraw(); };
  redraw(); return cv;
}

/* Stundenprotokoll */

  if(lv!=='u') extraQ.push(['p_hilf','Welche Hilfen, Anweisungen oder Rückmeldungen hat die Lehrkraft gegeben, und wie haben sie gewirkt?']);
  if(lv==='o') extraQ.push(['p_if','Ordne die Stunde einem Inhaltsfeld des Kernlehrplans zu (z. B. Leistung, Kooperation und Konkurrenz) und begründe.']);
  if(dur==='90') extraQ.push(['p_beob',`Beobachtungsauftrag: Beobachte eine Person (ohne Namen) bei der Bewegung „${sp.va.n}“. Notiere zwei Stärken und einen Tipp.`],['p_vor','Mach einen Vorschlag für die nächste Stunde: Was sollte man üben oder verändern?']);

  $('#app').innerHTML=frame(sp,lv,type,dur,`${plan(['Beobachte die laufende Sportstunde genau.',`Halte ${n} Phasen der Stunde fest: Uhrzeit, Inhalt, Organisation und deine Beobachtung.`,'Beantworte danach die Fragen.','Speichere dein Protokoll als PDF (ohne Namen von Mitschülerinnen und Mitschülern).'],)}
    <div class="card"><span class="eyebrow">Diese Begriffe helfen dir</span><div class="bank" style="margin-top:8px">${terms.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>
    <div class="proto">${Array.from({length:n},(_,i)=>`<div class="card"><h3>Phase ${i+1}</h3>
      <div class="field"><label for="t${i}">Uhrzeit und Phase (z. B. Aufwärmen, Übungsphase, Spiel)</label><input type="text" id="t${i}"></div>
      ${ta('i'+i,'Was wurde gemacht?')}${ta('o'+i,'Organisation (Gruppen, Material, Aufbau)')}${ta('b'+i,'Meine Beobachtung')}</div>`).join('')}</div>
    <div class="part"><h2>Auswertung</h2>${extraQ.map(q=>ta(q[0],q[1])).join('')}</div>
    <button class="btn primary big" id="check">Protokoll abschließen</button>${doneBlock()}`);
  $('#check').onclick=()=>{
    $$('textarea,input[type=text]').forEach(t=>t.readOnly=true);
    $('#check').hidden=true; $('#done').hidden=false; $('#res').textContent='Protokoll fertig';
    $('#pdf').onclick=()=>{
      const pdf=makePdf(sp.name,'Stundenprotokoll').head();
      for(let i=0;i<n;i++) pdf.h(`Phase ${i+1}: ${val('t'+i)||'-'}`).p('Inhalt: '+(val('i'+i)||'-'),{after:1}).p('Organisation: '+(val('o'+i)||'-'),{after:1}).p('Beobachtung: '+(val('b'+i)||'-'));
      pdf.gap().h('Auswertung'); extraQ.forEach(q=>pdf.p(q[1],{bold:true,after:1}).p(val(q[0])||'(leer)'));
      pdf.save(fileName(sp,'Stundenprotokoll'));
    };
  };
}

/* Video-Analyse */
function taskVideo(sp,lv,type,dur){
  const V=sp.va; const rounds=dur==='90'?2:1; const opts=['–','erfüllt','teilweise','nicht erfüllt'];
  const crit=V.ph.flatMap(ph=>ph[1].map(k=>({ph:ph[0],k})));
  const table=r=>`<div class="tablewrap"><table class="crit"><thead><tr><th>Phase</th><th>Kriterium</th><th>Versuch ${r+1}</th></tr></thead><tbody>
    ${crit.map((c,i)=>`<tr><td>${esc(c.ph)}</td><td>${esc(c.k)}</td><td><select id="v${r}_${i}" aria-label="${esc(c.k)}, Versuch ${r+1}">${opts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
  const extra=[];
  if(dur!=='45') extra.push(['f1','Rückmeldung an die gefilmte Person: zwei Stärken und ein Tipp (so formuliert, wie du es ihr sagen würdest).']);
  if(lv==='o') extra.push(['f2','Erkläre einen beobachteten Fehler mit einem biomechanischen oder lerntheoretischen Prinzip.']);
  if(dur==='90') extra.push(['f3','Vergleiche Versuch 1 und Versuch 2: Was hat sich nach der Rückmeldung verändert?'],['f4','Beurteile: Wie hilfreich war das Video im Vergleich zur Beobachtung mit bloßem Auge?']);
  $('#app').innerHTML=frame(sp,lv,type,dur,`
    <div class="card" style="display:grid;gap:6px"><span class="eyebrow">Wichtig: Datenschutz</span>
      <p>Filme nur mit Erlaubnis deiner Lehrkraft <b>und</b> der Person, die du filmst. Nutze die Kamera-App des iPads – diese Seite speichert keine Videos. Lösche das Video nach der Stunde. Schreibe keine Namen in deine Analyse.</p></div>
    ${plan([`Filme die Bewegung „${V.n}“ ${rounds===2?'zweimal: vor und nach deiner Rückmeldung':'einmal'} (am besten in Zeitlupe, von der Seite).`,'Schau das Video mehrmals an und bewerte jedes Kriterium.',...(extra.length?['Beantworte die Fragen unter der Tabelle.']:[]),'Speichere deine Analyse als PDF.'])}
    <h2>Zielbewegung: ${esc(V.n)}</h2>
    ${Array.from({length:rounds},(_,r)=>table(r)).join('')}
    ${extra.map(q=>ta(q[0],q[1])).join('')}
    <button class="btn primary big" id="check">Analyse abschließen</button>${doneBlock()}`);
  $('#check').onclick=()=>{
    $$('select').forEach(s=>s.disabled=true); $$('textarea').forEach(t=>t.readOnly=true);
    const score=r=>crit.filter((_,i)=>$(`#v${r}_${i}`).value==='erfüllt').length;
    $('#check').hidden=true; $('#done').hidden=false; $('#res').textContent=Array.from({length:rounds},(_,r)=>`Versuch ${r+1}: ${score(r)} von ${crit.length} Kriterien erfüllt`).join(' · ');
    $('#pdf').onclick=()=>{
      const pdf=makePdf(sp.name,'Video-Analyse: '+V.n).head().p('Hinweis: Die Analyse enthält keine Namen. Das Video wurde nicht über diese Seite gespeichert.',{size:9,color:[90,90,90]});
      for(let r=0;r<rounds;r++){ pdf.h(`Versuch ${r+1} (${score(r)} von ${crit.length} erfüllt)`); crit.forEach((c,i)=>pdf.p(`${c.ph} - ${c.k}: ${$(`#v${r}_${i}`).value}`,{after:0.6})); pdf.gap(); }
      extra.forEach(q=>pdf.h(q[1]).p(val(q[0])||'(leer)'));
      pdf.save(fileName(sp,'Video-Analyse'));
    };
  };
}

function taskFault(sp,lv,type,dur){

        .p('Mein Fehler: '+(val(`fe${i}_0`)||'-'),{after:1}).p('Meine Ursache: '+(val(`fe${i}_1`)||'-'),{after:1}).p('Meine Korrektur: '+(val(`fe${i}_2`)||'-'));
        if(lv==='o') pdf.p('Mein Theoriebezug: '+(val(`fe${i}_3`)||'-'));
        pdf.p('Lösung - Fehler: '+f.sol[0],{italic:true,color:[34,110,70],after:1}).p('Lösung - Ursache: '+f.sol[1],{italic:true,color:[34,110,70],after:1}).p('Lösung - Korrektur: '+f.sol[2],{italic:true,color:[34,110,70]}); });

const isFinished=()=>{ const d=$('#done'); return !!(d&&!d.hidden); };
const needsPrompt=()=>!!CUR&&(CUR.dirty||isFinished())&&!CUR.saved;
const app=$('#app');
const markDirty=()=>{ if(CUR&&!isFinished()){ CUR.dirty=true; CUR.saved=false; } };
app.addEventListener('input',markDirty); app.addEventListener('change',markDirty);
app.addEventListener('pointerdown',e=>{ if(e.target.closest('canvas')) markDirty(); });
app.addEventListener('click',e=>{
  if(e.target.closest('.mitem,#plus,#minus,[data-act]')) markDirty();
  const m=e.target.closest('[data-menu]'); if(m){ e.preventDefault(); goMenu(); }
});
function leaveTo(target){ CUR=null; closeLayer(); if(location.hash===target||(!location.hash&&target==='#')) route(); else location.hash=target; window.scrollTo(0,0); }
function goMenu(){ if(needsPrompt()) leaveDialog('#start'); else leaveTo('#start'); }
function leaveDialog(target){
  const fin=isFinished();
  $('#layer').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="lvh"><div class="panel">
    <h2 id="lvh">Aufgabe verlassen?</h2>
    <p class="muted">${fin?'Du hast deine Lösung noch nicht gespeichert.':'Du hast schon etwas bearbeitet.'} Möchtest du ${fin?'deine Lösung':'deinen Entwurf'} als PDF speichern, bevor du zum Hauptmenü gehst?</p>
    ${fin?'':'<p class="note">Der Entwurf enthält deine Eingaben, aber noch keine Auswertung und keine Lösungen.</p>'}
    <div style="display:grid;gap:8px;width:100%">
      <button class="btn primary" id="lv-save">${fin?'Lösung':'Entwurf'} speichern und zum Hauptmenü</button>
      <button class="btn danger" id="lv-drop">Verwerfen und zum Hauptmenü</button>
      <button class="btn" id="lv-stay">Weiter bearbeiten</button></div>
    <p class="note" id="lv-msg" hidden>Das PDF wurde nicht gespeichert. Versuche es noch einmal oder bearbeite weiter.</p>
  </div></div>`;
  $('#lv-stay').onclick=closeLayer;
  $('#lv-drop').onclick=()=>leaveTo(target);
  $('#lv-save').onclick=async()=>{
    const btn=$('#lv-save'); btn.disabled=true; btn.textContent='Wird gespeichert …';
    let ok=false;
    try{ if(fin){ const r=$('#pdf').onclick(); if(r&&r.then) await r; ok=await LAST_SAVE; } else ok=await draftPdf(); }catch(e){ ok=false; }
    if(ok) leaveTo(target);
    else { btn.disabled=false; btn.textContent=(fin?'Lösung':'Entwurf')+' speichern und zum Hauptmenü'; $('#lv-msg').hidden=false; }
  };
}
async function draftPdf(){
  const {sp,type}=CUR;
  const pdf=makePdf(sp.name,'Entwurf: '+type.name).head().p('Entwurf - noch nicht ausgewertet. Lösungen sind nicht enthalten.',{size:9.5,color:[120,60,40]});
  const labelOf=el=>{ const l=el.id&&document.querySelector(`label[for="${el.id}"]`); return l?l.textContent.trim():''; };
  const els=$$('#app .stack h2, #app .stack .reading, #app .stack fieldset.q, #app .stack textarea, #app .stack .proto input[type=text], #app .stack select, #app .stack canvas, #app .stack .match, #app .stack .lapcount, #app .stack input[type=checkbox], #app .stack .fig');
  for(const el of els){
    if(el.matches('h2')) pdf.h(el.textContent.trim());
    else if(el.matches('.reading')){ const gs=el.querySelectorAll('.gap'); if(!gs.length) continue; const c=el.cloneNode(true); const h=c.querySelector('.sec-h'); const ht=h?h.textContent:''; if(h) h.remove(); c.querySelectorAll('.gap').forEach((g,i)=>g.replaceWith('['+(gs[i].value.trim()||'____')+']')); if(ht) pdf.p(ht,{bold:true,after:1}); pdf.p(c.textContent.replace(/\s+/g,' ').trim()); }
    else if(el.matches('fieldset')){ const ch=el.querySelector('input:checked'); pdf.p(el.querySelector('legend').textContent.trim(),{bold:true,after:1}).p('Meine Antwort: '+(ch?ch.closest('label').textContent.trim():'(keine Antwort)')); }
    else if(el.matches('textarea,input[type=text]')) pdf.p(labelOf(el),{bold:true,after:1}).p(el.value.trim()||'(leer)');
    else if(el.matches('select')) pdf.p(`${el.getAttribute('aria-label')}: ${el.value}`,{after:0.6});
    else if(el.matches('canvas')) pdf.img(el.toDataURL('image/png'),el.height/el.width);
    else if(el.matches('.match')){ el.querySelectorAll('[data-l]').forEach(b=>{ const r=b.dataset.pair; const rb=r!==''&&r!==undefined?el.querySelector(`[data-r="${r}"]`):null; pdf.p(`${b.lastChild.textContent.trim()}: ${rb?rb.lastChild.textContent.trim():'(nicht zugeordnet)'}`,{after:1}); }); pdf.gap(); }
    else if(el.matches('.lapcount')) pdf.p('Wege zum Text: '+el.textContent.trim(),{bold:true});
    else if(el.matches('input[type=checkbox]')) pdf.p((el.checked?'[x] ':'[ ] ')+el.closest('label').textContent.trim(),{after:1});
    else if(el.matches('.fig')){ const png=await svgToPng(poseSvg(el.dataset.pose,false,true)); if(png) pdf.img(png,2/3,110); }
  }
  return await pdf.save(fileName(sp,type.name+' - Entwurf'));
}

/* ---------- Glücksrad ---------- */
function renderWheel(c){
  const lv=c.lv, dur=c.dur, segs=TYPES;
  const WC=[['#1D5BB8','#FFFFFF'],['#C2412D','#FFFFFF'],['#E3A912','#15212A'],['#2D8A57','#FFFFFF'],['#7B4FC4','#FFFFFF'],['#E8822F','#15212A'],['#1C8C99','#FFFFFF'],['#C9467F','#FFFFFF'],['#9BBF3B','#15212A'],['#3A4A5C','#FFFFFF']];
  $('#app').innerHTML=`<header class="top"><div class="brand"><span class="eyebrow">${c.sport==='zz'?'Sportart: Überraschung':esc(sportById(c.sport).name)} · ${LEVELS[lv].name}</span><h1>Dreh am Rad</h1></div><span class="badge-time">${dur} Min.</span></header>${linesHtml()}
    <div class="stack" style="align-items:center;text-align:center">
      <div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wh" width="800" height="800" aria-label="Glücksrad mit ${segs.length} Kategorien"></canvas></div>
      <button class="btn primary big" id="spin" style="max-width:440px">Drehen</button>
      <div id="out" aria-live="polite"></div>
      <h2 style="align-self:flex-start">Alle Kategorien</h2>
      <div class="catlist">${segs.map((t,i)=>`<div data-cat="${i}" style="border-left:8px solid ${WC[i][0]}"><b>${esc(t.name)}</b><small>${esc(t.d)}</small></div>`).join('')}</div></div>
    <p style="margin-top:32px"><a class="menubtn" href="#start">← Zurück zum Hauptmenü</a></p>`;
  const cv=$('#wh'), ctx=cv.getContext('2d'); const cs=getComputedStyle(document.documentElement);
    const N=segs.length, R=380, cx=400, cy=400; let ang=0;
  function draw(){ ctx.clearRect(0,0,800,800);
    for(let i=0;i<N;i++){ const a0=ang+i*2*Math.PI/N-Math.PI/2, a1=a0+2*Math.PI/N;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath(); ctx.fillStyle=WC[i][0]; ctx.fill();
      ctx.strokeStyle=cs.getPropertyValue('--surface').trim()||'#fff'; ctx.lineWidth=4; ctx.stroke();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate((a0+a1)/2); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle=WC[i][1]; ctx.font='700 34px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.fillText(segs[i].name,R-22,0); ctx.restore(); }
    ctx.beginPath(); ctx.arc(cx,cy,46,0,7); ctx.fillStyle=cs.getPropertyValue('--surface').trim()||'#fff'; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle=cs.getPropertyValue('--ink').trim()||'#000'; ctx.stroke(); }
  draw(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
  $('#spin').onclick=()=>{
    $('#spin').disabled=true; $('#out').innerHTML=''; $$('[data-cat]').forEach(d=>d.classList.remove('hit'));
    const target=Math.floor(Math.random()*N), seg=2*Math.PI/N, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const final=-(target*seg+seg/2)-2*Math.PI*(reduce?1:6)-(Math.random()-.5)*seg*0.6;
    const start=ang%(2*Math.PI), D=reduce?400:4200, t0=performance.now();
    const step=now=>{ const t=Math.min(1,(now-t0)/D), e=1-Math.pow(1-t,4); ang=start+(final-start)*e; draw(); if(t<1) requestAnimationFrame(step); else finish(target); };
    requestAnimationFrame(step);
  };
  function finish(i){
    const sp=c.sport==='zz'?pick(SPORTS):sportById(c.sport); const t=segs[i]; const code=`${sp.id}-${lv}-${t.id}-${dur}`;
    $(`[data-cat="${i}"]`).classList.add('hit');
    $('#out').innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:10px;align-items:center"><span class="eyebrow">${esc(sp.name)}</span><h2>${esc(t.name)}</h2><p class="muted">${esc(t.d)}</p><a class="btn primary" href="#${code}">Los geht’s</a></div>`;
  }
}

route();
})();
</script>
