SPORTS.push({id:'la', name:'Leichtathletik', bf:'BF 3 · Laufen, Springen, Werfen', field:'grid',
L:{
u:{t:'Leichtathletik verstehen', s:[
['Laufen, Springen, Werfen','Die Leichtathletik besteht aus Laufen, Springen und Werfen. Beim Sprint startet man aus dem [Tiefstart]. Die Kommandos lauten „Auf die Plätze“, „Fertig“ und dann der Startschuss. Wer zu früh losläuft, macht einen [Fehlstart]. Beim Weitsprung läuft man schnell an und springt mit einem Bein vom [Absprungbalken] ab. Gemessen wird bis zu dem [Abdruck] im Sand, der dem Balken am nächsten ist. Darum sollte man nach der Landung nicht nach hinten fallen. In vielen Schulen finden die Bundesjugendspiele statt, bei denen man Punkte in verschiedenen Disziplinen sammelt.',
 [['Nenne die Startkommandos beim Sprint in der richtigen Reihenfolge.','„Auf die Plätze“ – „Fertig“ – Startschuss.'],['Warum sollte man beim Weitsprung nach der Landung nicht nach hinten fallen?','Gemessen wird bis zum Abdruck, der dem Balken am nächsten ist; fällt man nach hinten, wird der Sprung kürzer.']]],
['Schnell laufen','Wer schnell laufen will, läuft auf dem [Fußballen] und nicht auf der Ferse. Die Knie werden kräftig nach vorne oben gezogen, das nennt man [Kniehub]. Die Arme schwingen locker und gegengleich zu den Beinen: Ist das linke Bein vorne, ist der rechte Arm vorne. Die Ellbogen sind dabei etwa im [rechten] Winkel gebeugt. Der Oberkörper ist aufrecht oder leicht nach vorne geneigt, der Blick geht geradeaus. Um diese Technik zu üben, gibt es das [Lauf-ABC] mit Übungen wie Skippings (schnelle kleine Schritte mit Kniehub), Anfersen (die Fersen berühren fast den Po) und Hopserlauf. Diese Übungen eignen sich auch gut zum Aufwärmen.',
 [['Wie arbeiten Arme und Beine beim Sprint zusammen?','Gegengleich: Ist das linke Bein vorne, ist der rechte Arm vorne.'],['Nenne drei Übungen aus dem Lauf-ABC.','Skippings, Anfersen, Hopserlauf.']]],
['Weit springen','Der Weitsprung besteht aus vier Teilen: Anlauf, Absprung, Flug und Landung. Im [Anlauf] wird man immer schneller, damit man mit hoher Geschwindigkeit abspringen kann. Abgesprungen wird mit einem Bein, dem Sprungbein. Das andere Bein, das [Schwungbein], wird kräftig nach vorne oben gezogen, zusammen mit den Armen. Für Anfänger eignet sich in der Luft der [Schrittsprung]: Man bleibt kurz in einer weiten Schrittstellung, bevor man beide Beine nach vorne bringt. Zur Landung werden die Beine weit nach vorne gestreckt. Nach dem Aufsetzen beugt man die Knie und bringt den Oberkörper nach [vorne], damit man nicht nach hinten fällt.',
 [['Nenne die vier Teile des Weitsprungs.','Anlauf, Absprung, Flug, Landung.'],['Was macht das Schwungbein beim Absprung?','Es wird kräftig nach vorne oben gezogen und unterstützt so den Absprung.']]],
['Werfen','Beim Ballwurf wird ein kleiner Ball aus dem Anlauf möglichst weit geworfen. Rechtshänder halten den Ball in der rechten Hand. Kurz vor dem Abwurf setzen sie das [linke] Bein nach vorne. Dieser letzte Schritt heißt [Stemmschritt], weil er den Körper abbremst. Dadurch wird der Schwung vom Anlauf auf den Oberkörper und den Wurfarm übertragen – ähnlich wie bei einer Peitsche. Der Wurfarm ist beim Ausholen weit nach hinten gestreckt, der [Ellbogen] kommt beim Wurf vor der Hand nach vorne. Der Ball wird über der Schulter abgeworfen, nicht seitlich. Der günstigste Abwurfwinkel liegt in der Praxis etwas [flacher] als 45 Grad, weil der Ball oberhalb des Bodens abgeworfen wird.',
 [['Welches Bein setzt ein Rechtshänder beim Stemmschritt nach vorne?','Das linke Bein.'],['Was passiert beim Stemmschritt?','Der Körper wird abgebremst, und der Schwung wird auf Oberkörper und Wurfarm übertragen.']]]
]},
m:{t:'Leichtathletik: Disziplinen und Technik', s:[
['Hochsprung: der Flop','Die heute fast überall genutzte Hochsprungtechnik ist der [Flop], benannt nach dem US-Amerikaner Dick Fosbury, der damit 1968 Olympiasieger wurde. Der Anlauf verläuft zuerst gerade und dann in einem [Bogen] auf die Latte zu. Durch die Kurve neigt sich der Körper nach innen, was beim Absprung hilft. Abgesprungen wird mit dem [lattenfernen] Bein, das andere Knie wird kräftig nach oben gezogen. Über der Latte liegt der Körper rücklings und bildet ein [Hohlkreuz], die sogenannte Brücke. Danach werden Kinn und Beine angezogen, und die Landung erfolgt auf dem Rücken auf der weichen Matte. Nach drei Fehlversuchen in Folge scheidet man aus dem Wettkampf aus.',
 [['Beschreibe den Anlauf beim Flop.','Erst gerade, dann im Bogen auf die Latte zu; durch die Kurve entsteht eine Innenneigung.'],['Mit welchem Bein wird abgesprungen?','Mit dem lattenfernen Bein; das lattennahe Knie wird nach oben gezogen.']]],
['Kugelstoßen','Beim Kugelstoßen wird die Kugel nicht geworfen, sondern [gestoßen]. Sie liegt auf den Fingeransätzen und wird seitlich am [Hals] gehalten; der Ellbogen zeigt zur Seite. Erst beim Ausstoß verlässt die Kugel den Hals. Gestoßen wird aus einem Kreis mit 2,135 Metern Durchmesser; vorne begrenzt ihn ein Stoßbalken. Eine verbreitete Technik ist die [Angleittechnik]: Man startet mit dem Rücken zur Stoßrichtung und gleitet rückwärts durch den Kreis. Danach dreht man den Körper auf und stößt die Kugel mit gestrecktem Arm ab. Die Wettkampfkugel wiegt bei Männern 7,26 kg und bei Frauen [4] kg. Der Kreis muss nach dem Stoß in der [hinteren] Hälfte verlassen werden.',
 [['Wie wird die Kugel gehalten?','Auf den Fingeransätzen, seitlich am Hals, Ellbogen zur Seite.'],['Wie verlässt man nach dem Stoß den Kreis?','In der hinteren Hälfte.']]],
['Staffellauf','Bei der 4-mal-100-Meter-Staffel laufen vier Läufer je etwa 100 Meter und übergeben dabei einen [Staffelstab]. Die Übergabe muss innerhalb des [Wechselraums] erfolgen, der seit 2018 30 Meter lang ist. Damit beide Läufer bei der Übergabe hohe Geschwindigkeit haben, startet der Übernehmende schon, bevor der Ankommende ihn erreicht hat. Dafür legt er eine [Ablaufmarke] auf die Bahn: Erreicht der Ankommende diese Marke, läuft der Übernehmende los, ohne zurückzuschauen. Auf ein Kommando („Hopp!“) streckt er den Arm nach hinten und erhält den Stab. Man unterscheidet die Übergabe [von unten] und von oben. Ein verlorener Stab muss vom Läufer selbst aufgehoben werden, der ihn fallen ließ.',
 [['Wozu dient die Ablaufmarke?','Erreicht der Ankommende sie, startet der Übernehmende, damit beide bei der Übergabe hohe Geschwindigkeit haben.'],['Wo muss der Stab übergeben werden?','Innerhalb des Wechselraums (30 m).']]],
['Hürdenlauf','Im Hürdenlauf müssen auf der Strecke zehn Hürden überlaufen werden – bei den Männern über 110 Meter, bei den Frauen über 100 Meter. Ziel ist es, die Hürden möglichst [flach] zu überlaufen, denn jede Höhe, die der Körperschwerpunkt zusätzlich gewinnt, kostet Zeit. Das vordere Bein heißt [Schwungbein]; es wird gestreckt über die Hürde geführt. Das hintere Bein, das [Nachziehbein], wird seitlich abgespreizt über die Hürde gezogen. Der Oberkörper neigt sich beim Überqueren nach vorne. Zwischen den Hürden laufen Spitzenathleten meist im [Dreierrhythmus], also mit drei Schritten. Im Schulsport werden die Abstände und Höhen verkürzt, damit alle einen gleichmäßigen Rhythmus finden.',
 [['Warum sollen Hürden möglichst flach überlaufen werden?','Jede zusätzliche Höhe des Körperschwerpunkts kostet Zeit.'],['Beschreibe die Aufgabe von Schwungbein und Nachziehbein.','Schwungbein: gestreckt vorn über die Hürde. Nachziehbein: seitlich abgespreizt nachgezogen.']]]
]},
o:{t:'Leichtathletik aus Sicht der Sportwissenschaft', s:[
['Sprint: Schnelligkeit und Energiebereitstellung','Ein 100-m-Lauf dauert bei Schülerinnen und Schülern oft zwischen 12 und 16 Sekunden. In den ersten Sekunden wird das in der Muskulatur gespeicherte ATP genutzt und schnell aus [Kreatinphosphat] wieder aufgebaut (anaerob-alaktazide Energiebereitstellung). Mit zunehmender Dauer gewinnt die anaerobe [Glykolyse] an Bedeutung, bei der Laktat entsteht. Leistungsbestimmend sind verschiedene Formen der Schnelligkeit: die [Reaktionsschnelligkeit] beim Start, die Beschleunigungsfähigkeit, die maximale Laufgeschwindigkeit und die [Schnelligkeitsausdauer]. Nach den Wettkampfregeln wird eine Reaktion von weniger als 0,1 Sekunden nach dem Startschuss als Fehlstart gewertet. Für schnelle Bewegungen sind vor allem die schnell zuckenden FT-Fasern der Muskulatur wichtig, deren Anteil weitgehend genetisch bestimmt ist.',
 [['Erläutere die Energiebereitstellung bei einem 100-m-Lauf.','Zu Beginn ATP und Kreatinphosphat (anaerob-alaktazid), mit zunehmender Dauer anaerobe Glykolyse mit Laktatbildung; aerober Anteil gering.'],['Warum gilt eine Reaktion unter 0,1 s als Fehlstart?','Schnellere Reaktionen auf ein akustisches Signal gelten als physiologisch kaum möglich; der Läufer hat vermutlich vor dem Signal gestartet.']]],
['Biomechanik des Weitsprungs','Die Sprungweite lässt sich in drei Teilweiten zerlegen: die [Absprungweite] (Abstand zwischen Balken und Körperschwerpunkt beim Verlassen des Bodens), die [Flugweite] und die Landeweite. Die Flugweite hängt vor allem von der Abfluggeschwindigkeit, dem Abflugwinkel und der Abflughöhe ab. Nach den Gesetzen des schiefen Wurfs wäre ein Winkel von 45 Grad optimal, wenn Abflug- und Landehöhe gleich wären und die Geschwindigkeit nicht vom Winkel abhinge. Tatsächlich springen Weitspringer mit Winkeln um etwa [20] Grad ab, weil ein steilerer Absprung die horizontale Anlaufgeschwindigkeit zu stark abbauen würde. Entscheidend ist also die [Anlaufgeschwindigkeit]. In der Flugphase kann die Flugkurve des Körperschwerpunkts nicht mehr verändert werden; Lauf- oder Hangtechnik dienen dazu, Drehbewegungen auszugleichen und eine günstige [Landeposition] vorzubereiten.',
 [['Erkläre, warum Weitspringer mit Winkeln um 20 Grad abspringen.','Ein steilerer Absprung würde zu viel horizontale Geschwindigkeit kosten; die Anlaufgeschwindigkeit ist entscheidender als der Winkel.'],['Welche Funktion hat die Technik in der Flugphase?','Sie kann die Flugkurve des Körperschwerpunkts nicht ändern, gleicht aber Drehbewegungen aus und bereitet eine günstige Landung vor.']]],
['Schnelligkeitstraining','Schnelligkeit wird mit [maximaler] Intensität trainiert, denn nur bei höchster Geschwindigkeit werden die entsprechenden neuronalen Muster angesprochen. Die Belastungsdauer ist kurz, meist Strecken bis etwa 30 Meter. Damit jede Wiederholung mit voller Qualität gelingt, werden [vollständige] Pausen eingehalten; als Faustregel gilt etwa eine Minute Pause pro zehn Meter Sprint. Trainiert man Sprints im ermüdeten Zustand, wird nicht Schnelligkeit, sondern [Schnelligkeitsausdauer] verbessert. Ein bekanntes Problem ist die [Geschwindigkeitsbarriere]: Durch immer gleiche Trainingsreize stabilisiert sich ein bestimmtes Tempo. Sie kann durch Variation durchbrochen werden, etwa durch Läufe mit leichtem Gefälle oder Zugwiderstand.',
 [['Begründe die Belastungsgestaltung im Schnelligkeitstraining.','Maximale Intensität, kurze Strecken, vollständige Pausen, damit jede Wiederholung mit voller Qualität und höchster Geschwindigkeit erfolgt.'],['Was ist die Geschwindigkeitsbarriere und wie kann man sie überwinden?','Stabilisierung eines Tempos durch gleichförmige Reize; Überwindung durch Variation (z. B. Bergabläufe, Zugwiderstand).']]],
['Doping und Gesundheit','Unter [Doping] versteht man die Anwendung verbotener Substanzen oder Methoden zur Leistungssteigerung. Die Welt-Anti-Doping-Agentur [WADA] wurde 1999 gegründet und veröffentlicht jährlich eine Verbotsliste. Bekannte Substanzgruppen sind [anabole Steroide], die den Muskelaufbau fördern, und Erythropoetin (EPO), das die Bildung roter Blutkörperchen anregt und so die Ausdauerleistung erhöht. Ein bekannter Fall ist der 100-m-Olympiasieger von 1988, dem der Titel wegen eines positiven Tests aberkannt wurde. Doping gefährdet die Gesundheit: Steroide können Herz, Leber und Hormonhaushalt schädigen, EPO verdickt das Blut und erhöht das Risiko für Thrombosen. Es verletzt zudem das Prinzip der [Chancengleichheit] und damit den Kern des sportlichen Wettkampfs.',
 [['Erläutere zwei Dopingsubstanzen mit Wirkung und Risiken.','Anabole Steroide: Muskelaufbau; Risiken für Herz, Leber, Hormonhaushalt. EPO: mehr rote Blutkörperchen, höhere Ausdauer; dickeres Blut, Thromboserisiko.'],['Beurteile Doping aus ethischer Sicht.','Verletzt Chancengleichheit und Fairness, gefährdet Gesundheit, setzt Konkurrenten unter Druck. Eigenes begründetes Urteil.']]]
]}
},

SPORTS.push({id:'sw', name:'Schwimmen', bf:'BF 4 · Bewegen im Wasser', field:'pool',
L:{
u:{t:'Schwimmen verstehen', s:[
['Sicher schwimmen','Schwimmen ist wichtig, um sich im Wasser sicher zu bewegen. Es gibt vier Schwimmarten: Brustschwimmen, Kraulschwimmen, Rückenschwimmen und [Schmetterling|Delfin|Delphin]. Beim Schwimmen sollte man ins Wasser [ausatmen], damit man über Wasser schnell wieder einatmen kann. Nach dem Abstoß vom Beckenrand gleitet man in einer gestreckten Haltung, das spart Kraft. Für das Schwimmabzeichen in [Bronze] muss man unter anderem 15 Minuten schwimmen und dabei mindestens 200 Meter zurücklegen. Im Schwimmbad gelten [Baderegeln]: Man duscht vor dem Schwimmen, rennt nicht am Beckenrand und springt nur ins Wasser, wenn der Bereich frei ist. Wer einen anderen Menschen in Gefahr sieht, holt sofort Hilfe und ruft den Notruf [112].',
 [['Warum atmet man ins Wasser aus?','Damit über Wasser nur noch eingeatmet werden muss; das geht schneller.'],['Nenne drei Baderegeln.','Z. B. vor dem Schwimmen duschen, nicht am Beckenrand rennen, nur springen, wenn der Bereich frei ist.']]],
['Brustschwimmen','Beim Brustschwimmen bewegen sich Arme und Beine gleichzeitig und spiegelbildlich. Man spricht von einer [Gleichzugtechnik]. Die Arme ziehen von vorne nach außen und unten, aber nur bis etwa auf Höhe der [Schultern]. Dann werden die Hände vor der Brust zusammengeführt und wieder nach vorne gestreckt. Während des Armzugs hebt man den Kopf und atmet ein. Bei der Beinbewegung werden die Fersen zum Po gezogen, die Füße werden nach außen gedreht und die Beine kreisförmig nach hinten zusammengeschlossen. Diese Bewegung heißt [Schwunggrätsche]. Die Kraft kommt dabei von den Innenseiten der Füße und Unterschenkel. Danach folgt eine kurze [Gleitphase], in der der Körper ganz gestreckt ist.',
 [['Bis wohin ziehen die Arme beim Brustschwimmen?','Etwa bis auf Höhe der Schultern.'],['Beschreibe die Schwunggrätsche.','Fersen zum Po ziehen, Füße nach außen drehen, Beine kreisförmig nach hinten zusammenschließen.']]],
['Das Wasser trägt','Im Wasser fühlt man sich leichter als an Land. Das liegt am [Auftrieb]: Das Wasser drückt von unten gegen den Körper. Wer tief einatmet, hat mehr Luft in der [Lunge] und schwimmt deshalb besser oben. Das kann man mit Übungen testen: Beim „Toten Mann“ liegt man ruhig auf dem Rücken, Arme und Beine sind leicht gespreizt. Bei der „[Qualle]“ umfasst man die Knie und lässt sich mit dem Rücken nach oben treiben. Atmet man aus, sinkt man langsam nach unten. Kaltes Wasser kühlt den Körper sehr schnell aus, viel schneller als Luft mit derselben Temperatur. Deshalb sollte man nach dem Schwimmen nicht frierend am Beckenrand stehen, sondern sich [abtrocknen] und warm anziehen.',
 [['Warum schwimmt man mit tief eingeatmeter Luft besser oben?','Mehr Luft in der Lunge vergrößert das Volumen und damit den Auftrieb.'],['Beschreibe die Übung „Qualle“.','Knie umfassen und sich mit dem Rücken nach oben treiben lassen.']]],
['Rettung und Sicherheit','Die Deutsche Lebens-Rettungs-Gesellschaft, kurz [DLRG], wurde 1913 gegründet. Sie bildet Rettungsschwimmerinnen und Rettungsschwimmer aus und bewacht Badestellen. Schwimmabzeichen zeigen, wie sicher jemand schwimmt: Das [Seepferdchen] ist ein Frühschwimmerabzeichen, danach folgen Bronze, Silber und Gold. Wer jemanden in Not sieht, sollte sich nicht selbst in Gefahr bringen. Wichtiger ist es, laut um Hilfe zu rufen, die Aufsicht zu holen und den [Notruf] 112 wählen zu lassen. Kann man helfen, ohne ins Wasser zu gehen, reicht man einen Gegenstand, zum Beispiel eine Stange oder einen [Rettungsring]. So bleibt man selbst sicher am Ufer.',
 [['Wofür steht die Abkürzung DLRG und was macht sie?','Deutsche Lebens-Rettungs-Gesellschaft; sie bildet Rettungsschwimmer aus und bewacht Badestellen.'],['Wie kann man helfen, ohne selbst ins Wasser zu gehen?','Hilfe rufen, Aufsicht holen, Notruf wählen lassen, einen Gegenstand wie Stange oder Rettungsring reichen.']]]
]},
m:{t:'Schwimmen: Technik und Rettung', s:[
['Kraulschwimmen, Wende und Lagen','Kraul ist die schnellste Schwimmart. Die Arme ziehen im [Wechselzug]: Während ein Arm unter Wasser zieht, wird der andere über Wasser nach vorn geführt. Die Beine schlagen locker aus der [Hüfte] auf und ab. Geatmet wird zur Seite, häufig nach jedem dritten Armzug, dem sogenannten [Dreierzug]. Am Beckenende nutzen geübte Schwimmer die [Rollwende]: Sie machen eine halbe Rolle vorwärts und stoßen sich mit den Füßen von der Wand ab. Im Lagenschwimmen ist die Reihenfolge im Einzel Schmetterling, Rücken, Brust und [Freistil]. In der Lagenstaffel beginnt dagegen der Rückenschwimmer, weil der Rückenstart im Wasser erfolgt.',
 [['Was ist der Dreierzug und welchen Vorteil hat er?','Einatmen nach jedem dritten Armzug; man atmet abwechselnd links und rechts und schwimmt gleichmäßiger.'],['Warum unterscheidet sich die Reihenfolge in der Lagenstaffel vom Einzel?','In der Staffel beginnt Rücken, weil der Rückenstart im Wasser erfolgt.']]],
['Rückenschwimmen','Beim Rückenschwimmen liegt der Körper gestreckt auf dem Rücken. Der Kopf ist ruhig, die [Ohren] sind im Wasser, und der Blick geht schräg nach oben. Die Hüfte bleibt hoch an der Wasseroberfläche, sonst entsteht eine Sitzposition, die stark bremst. Die Arme arbeiten im Wechselzug: Ein Arm wird gestreckt über Wasser nach hinten geführt und taucht mit dem [kleinen Finger] zuerst ins Wasser ein. Unter Wasser zieht und drückt er seitlich am Körper vorbei bis zum Oberschenkel. Die Beine schlagen wie beim Kraul aus der Hüfte, die Zehen kommen knapp an die Oberfläche. Bei der [Rückenwende] darf sich der Schwimmer kurz vor der Wand auf den Bauch drehen und eine Rolle machen; nach dem Abstoß muss er aber wieder in [Rückenlage] sein.',
 [['Warum soll die Hüfte beim Rückenschwimmen hoch bleiben?','Sonst entsteht eine Sitzposition, die den Wasserwiderstand stark erhöht.'],['Mit welchem Teil der Hand taucht der Arm ein?','Mit dem kleinen Finger zuerst.']]],
['Retten und sich selbst retten','Bei der Rettung gilt: [Eigenschutz] geht vor. Ein Mensch in Panik kann den Helfer unter Wasser drücken. Deshalb wird möglichst ohne direkten Körperkontakt geholfen, zum Beispiel mit einem Rettungsgerät, das man der Person reicht. Muss ein Rettungsschwimmer doch ins Wasser, nähert er sich und nutzt einen [Schleppgriff], etwa den Kopf- oder Achselschleppgriff, um die Person in Rückenlage abzuschleppen. Auch die [Selbstrettung] ist wichtig: Wer mit Kleidung ins Wasser fällt, sollte ruhig bleiben, sich auf dem Rücken treiben lassen und schwere Kleidungsstücke wie Schuhe ausziehen. Das Deutsche [Rettungsschwimmabzeichen] in Bronze kann man ab zwölf Jahren erwerben.',
 [['Warum geht beim Retten der Eigenschutz vor?','Eine Person in Panik kann den Helfer unter Wasser drücken; ein verunglückter Helfer kann niemanden mehr retten.'],['Was sollte man tun, wenn man mit Kleidung ins Wasser fällt?','Ruhig bleiben, auf dem Rücken treiben lassen, schwere Kleidung wie Schuhe ausziehen, um Hilfe rufen.']]],
['Ausdauer im Wasser','Schwimmen ist ein ideales [Ausdauertraining], weil es viele Muskelgruppen gleichzeitig beansprucht und die Gelenke schont. Das Wasser trägt einen großen Teil des Körpergewichts. Interessant ist, dass die Herzfrequenz beim Schwimmen bei vergleichbarer Anstrengung meist etwas [niedriger] ist als beim Laufen. Gründe dafür sind die waagerechte Körperlage und die Kühlung durch das Wasser. Für das Ausdauertraining eignet sich die [Dauermethode]: Man schwimmt über eine längere Zeit, zum Beispiel 20 Minuten, ohne Pause in gleichmäßigem Tempo. Bei der [Intervallmethode] wechseln Strecken mit höherem Tempo und kurze Pausen am Beckenrand. Wichtig ist eine gleichmäßige Atmung, damit man nicht vorzeitig [ermüdet].',
 [['Warum gilt Schwimmen als gelenkschonend?','Das Wasser trägt einen großen Teil des Körpergewichts.'],['Unterscheide Dauer- und Intervallmethode im Schwimmen.','Dauermethode: lange ohne Pause in gleichmäßigem Tempo. Intervallmethode: Wechsel aus schnelleren Strecken und kurzen Pausen.']]]
]},
o:{t:'Schwimmen aus Sicht der Sportwissenschaft', s:[
['Physik im Wasser','Wasser ist rund 800-mal dichter als Luft. Nach dem Prinzip des Archimedes erfährt ein Körper im Wasser einen [Auftrieb], der der Gewichtskraft des verdrängten Wassers entspricht. Bewegt sich der Schwimmer vorwärts, wirkt ein [Widerstand] entgegen. Man unterscheidet Formwiderstand, der von der Querschnittsfläche abhängt, Reibungswiderstand an der Haut und [Wellenwiderstand] an der Wasseroberfläche. Da der Widerstand etwa mit dem Quadrat der Geschwindigkeit wächst, lohnt sich eine gestreckte, waagerechte [Wasserlage] besonders. Den Vortrieb erklärt das dritte newtonsche Gesetz (actio = reactio): Die Hand drückt Wasser nach hinten, dadurch wird der Körper nach [vorne|vorn] bewegt. Zusätzlich entsteht durch die Stellung der Hand, ähnlich wie bei einer Tragfläche, ein dynamischer Auftrieb.',
 [['Nenne die drei Widerstandsarten und beschreibe sie.','Formwiderstand (Querschnittsfläche), Reibungswiderstand (Haut/Wasser), Wellenwiderstand (Wellenbildung an der Oberfläche).'],['Begründe, warum eine gute Wasserlage bei höherem Tempo immer wichtiger wird.','Der Widerstand wächst etwa mit dem Quadrat der Geschwindigkeit; eine gestreckte Lage verkleinert den Formwiderstand.']]],
['Technikanalyse des Kraularmzugs','Der Kraularmzug wird in Phasen gegliedert: [Eintauchen] und Strecken, Greifen, Zug- und Druckphase sowie die Rückholphase über Wasser. Moderne Technikleitbilder betonen den [hohen Ellbogen] beim Greifen: Der Unterarm wird früh senkrecht gestellt, sodass Hand und Unterarm eine große Fläche bilden, die Wasser nach hinten drückt. Der früher gelehrte ausgeprägte S-förmige Zug gilt heute als weniger wichtig. Gleichzeitig rollt der Körper um seine [Längsachse]; das erleichtert die Atmung und ermöglicht den Einsatz der großen Rumpfmuskulatur. Ein gleichmäßiger Vortrieb entsteht, wenn sich die Antriebsphasen beider Arme überlappen, statt Pausen zwischen den Zügen entstehen zu lassen. Diese [Koordination] der Arme lässt sich bei der Videoanalyse gut beobachten.',
 [['Gliedere den Kraularmzug in Phasen.','Eintauchen und Strecken, Greifen, Zug- und Druckphase, Rückholphase.'],['Erläutere die Bedeutung des hohen Ellbogens.','Hand und Unterarm bilden früh eine große, senkrechte Abdruckfläche; mehr Wasser kann nach hinten gedrückt werden.']]],
['Physiologie im Wasser','Wasser leitet Wärme etwa [25]-mal besser als Luft. Deshalb kühlt der Körper im Wasser schnell aus, und der Energieverbrauch steigt. Der [hydrostatische Druck] presst Blut aus den Beinen in Richtung Brustraum; das Herz wird stärker gefüllt und kann mit niedrigerer Frequenz die gleiche Menge Blut pumpen. Gleichzeitig erschwert der Wasserdruck auf den Brustkorb das Einatmen, die Atemmuskulatur muss mehr arbeiten. Ein großes Risiko besteht beim Streckentauchen nach [Hyperventilation]: Durch schnelles, tiefes Atmen sinkt der Kohlendioxidgehalt im Blut, das Atemsignal kommt verspätet, und es kann unter Wasser zur Bewusstlosigkeit kommen. Hyperventilieren vor dem Tauchen ist daher [verboten].',
 [['Erläutere die Wirkung des hydrostatischen Drucks auf das Herz-Kreislauf-System.','Blut wird aus den Beinen in den Brustraum gedrückt, das Herz wird stärker gefüllt und kann mit niedrigerer Frequenz die gleiche Blutmenge pumpen.'],['Erkläre, warum Hyperventilation vor dem Tauchen gefährlich ist.','Der CO₂-Gehalt sinkt, das Atemsignal kommt verspätet, Sauerstoffmangel kann unbemerkt zur Bewusstlosigkeit unter Wasser führen.']]],
['Leistungsdiagnostik im Schwimmen','Im Leistungskurs Sport ist für das Schwimmen eine Ausdauerleistung von mindestens 800 Metern vorgesehen. Um die Leistung zu steuern, nutzt man [Testverfahren]. Ein einfaches Verfahren ist der Zeitvergleich über eine feste Strecke. Aus den Zeiten über 400 und 200 Meter lässt sich die [kritische Schwimmgeschwindigkeit] berechnen, die etwa dem Tempo entspricht, das man über längere Zeit halten kann. Ergänzend werden Herzfrequenz und subjektives Belastungsempfinden ([Borg-Skala]) erfasst. Die Gütekriterien gelten auch hier: Ein Test ist nur [reliabel], wenn Bedingungen wie Wassertemperatur, Start (vom Block oder aus dem Wasser) und Aufwärmen gleich sind.',
 [['Wozu dient die kritische Schwimmgeschwindigkeit?','Sie schätzt das Tempo, das über längere Zeit gehalten werden kann, und dient zur Steuerung des Ausdauertrainings.'],['Nenne Bedingungen, die für einen reliablen Schwimmtest gleich bleiben müssen.','Wassertemperatur, Startart, Aufwärmen, Tageszeit, Beckenlänge.']]]
]}

L:{
u:{t:'Turnen verstehen', s:[
['Mit Spannung und Sicherheit','Beim Turnen braucht man vor allem [Körperspannung]: Bauch, Po und Beine werden fest angespannt, damit der Körper wie ein Brett wird. Eine Grundübung am Boden ist die [Rolle] vorwärts. Man stellt die Hände schulterbreit auf, nimmt das Kinn auf die [Brust] und macht den Rücken rund. Damit sich niemand verletzt, gibt es [Hilfestellung]: Eine Mitschülerin oder ein Mitschüler sichert die Turnenden mit festen Griffen. Ein sicherer Griff ist der [Klammergriff], bei dem beide Hände den Arm oder das Bein von zwei Seiten umfassen. Unter und neben jedem Gerät liegen Matten, die ohne Lücken ausgelegt sein müssen.',
 [['Was bedeutet Körperspannung?','Bauch, Po und Beine fest anspannen, sodass der Körper stabil wie ein Brett ist.'],['Wie funktioniert der Klammergriff?','Beide Hände umfassen den Arm oder das Bein von zwei Seiten.']]],
['Balancieren und Gleichgewicht','Für das Gleichgewicht ist ein kleines Organ im [Innenohr] zuständig. Es meldet dem Gehirn, ob der Kopf gerade ist oder sich dreht. Zusätzlich helfen die Augen und die Muskeln. Wer auf einer Bank oder einem Balken balanciert, sollte einen festen Punkt vor sich [fixieren]. Die Arme werden seitlich ausgestreckt, so kann man kleine Wackler ausgleichen. Man bleibt im Gleichgewicht, solange der [Schwerpunkt] des Körpers über der Fläche liegt, auf der man steht. Auf einem schmalen Balken ist diese Fläche sehr klein, deshalb ist Balancieren dort schwerer. Mit Übung wird das Gleichgewicht besser – man spricht dann von einer guten [Gleichgewichtsfähigkeit].',
 [['Welches Organ ist für das Gleichgewicht zuständig?','Das Gleichgewichtsorgan im Innenohr.'],['Warum ist Balancieren auf einem schmalen Balken schwerer?','Die Fläche, über der der Schwerpunkt liegen muss, ist sehr klein.']]],
['Springen über Kasten und Bock','Beim Stützsprung über einen Kasten oder Bock läuft man zügig an und springt [beidbeinig] von einem Sprungbrett ab. Die Hände setzen auf dem Gerät auf, die Arme sind gestreckt und stützen den Körper. Bei der [Hocke] werden die Knie zur Brust gezogen, und man springt zwischen den Armen über das Gerät. Bei der [Grätsche] werden die Beine seitlich gespreizt. Nach dem Sprung landet man auf beiden Füßen und federt in den Knien ab. Eine Helferin steht hinter dem Gerät an der Landestelle und sichert am [Oberarm]. Man springt erst, wenn die Helferin bereit ist.',
 [['Wie springt man beim Stützsprung vom Sprungbrett ab?','Beidbeinig.'],['Unterscheide Hocke und Grätsche.','Hocke: Knie zur Brust, Sprung zwischen den Armen. Grätsche: Beine seitlich gespreizt.']]],
['Geschichte des Turnens','Das Turnen in Deutschland ist eng mit Friedrich Ludwig [Jahn] verbunden, der oft „Turnvater“ genannt wird. Er eröffnete 1811 in der Berliner Hasenheide den ersten öffentlichen [Turnplatz]. Viele Geräte, die wir heute kennen, wurden damals entwickelt oder bekannt gemacht, zum Beispiel das Reck und der [Barren]. Heute gibt es Gerätturnen als Wettkampfsport. Frauen turnen an vier Geräten, Männer an [sechs]. Daneben gibt es Formen wie Trampolinturnen, Rhönradturnen und Parkour. Im Schulsport geht es nicht nur um Wettkampf, sondern auch darum, mutig Neues auszuprobieren und [Verantwortung] füreinander zu übernehmen.',
 [['Wer gilt als „Turnvater“ und was geschah 1811?','Friedrich Ludwig Jahn; er eröffnete in der Berliner Hasenheide den ersten öffentlichen Turnplatz.'],['An wie vielen Geräten turnen Frauen und Männer im Wettkampf?','Frauen an vier, Männer an sechs Geräten.']]]
]},
m:{t:'Turnen: Technik und Sicherheit', s:[
['Handstand und Sicherheit','Der [Handstand] ist ein Grundelement für viele Turnübungen. Man setzt die Hände schulterbreit auf, die Finger zeigen nach vorn und sind leicht gespreizt. Der Blick geht auf den Boden zwischen den Händen. Aus dem Ausfallschritt wird ein Bein nach oben geschwungen, das andere folgt. Im Handstand ist der Körper gestreckt und angespannt; Schultern, Hüfte und Füße bilden eine [Linie]. Ein Hohlkreuz soll vermieden werden. Die Helferin steht [seitlich] neben der Stelle, an der die Hände aufgesetzt werden, und fängt das Schwungbein mit dem Klammergriff am [Oberschenkel] ab. Wer aus dem Handstand nach vorne kippt, kann sich mit einer [Abrollbewegung|Rolle] retten.',
 [['Woran erkennt man einen guten Handstand?','Körper gestreckt und angespannt, Schultern, Hüfte und Füße in einer Linie, kein Hohlkreuz.'],['Wo steht die Helferin und wie sichert sie?','Seitlich neben der Aufsetzstelle der Hände; sie fängt das Schwungbein mit dem Klammergriff am Oberschenkel ab.']]],
['Der Felgaufschwung am Reck','Beim Felgaufschwung, umgangssprachlich „Bauchaufschwung“, dreht sich der Körper rückwärts um die Reckstange in den Stütz. Die Stange ist etwa auf Brust- bis Kinnhöhe. Man greift im [Ristgriff], die Handrücken zeigen nach oben. Ein Bein schwingt kräftig nach vorne oben, das andere drückt sich vom Boden ab. Die Arme sind [gebeugt] und ziehen den Körper nah an die Stange. Je näher der Körperschwerpunkt an der [Drehachse], also der Stange, ist, desto leichter gelingt die Drehung. Am Ende liegt die Hüfte auf der Stange, und man drückt sich mit gestreckten Armen in den [Stütz]. Die Helferin steht seitlich und unterstützt mit einer Hand am Rücken und einer am Oberschenkel.',
 [['Warum sollen die Arme beim Felgaufschwung gebeugt sein?','Damit der Körperschwerpunkt nah an der Drehachse (Stange) bleibt; dann gelingt die Drehung leichter.'],['Beschreibe die Hilfestellung.','Seitlich stehen, eine Hand am Rücken, eine am Oberschenkel, Drehung unterstützen.']]],
['Akrobatik','In der Akrobatik bilden mehrere Personen gemeinsam [Pyramiden] oder Figuren. Die Person, die unten trägt, heißt [Untermann] oder Base. Die Person, die oben steht oder sitzt, heißt Obermann oder Flyer. Getragen werden darf nur an [belastbaren] Stellen: auf den Oberschenkeln nahe der Hüfte, auf dem Becken oder direkt über den Schultern. Auf die Mitte des Rückens oder auf den Bauch darf nie gestiegen werden, weil die Wirbelsäule dort nicht stabil ist. Untermänner halten den Rücken gerade und die Arme gestreckt. Wichtig ist eine klare [Kommunikation]: Auf- und Abbau werden angesagt, und eine Sicherungsperson steht bereit. Eine Pyramide wird in umgekehrter Reihenfolge abgebaut.',
 [['Auf welche Stellen darf man beim Pyramidenbau steigen?','Oberschenkel nahe der Hüfte, Becken, direkt über den Schultern; nie auf Rückenmitte oder Bauch.'],['Warum ist Kommunikation in der Akrobatik wichtig?','Auf- und Abbau müssen abgestimmt sein, damit niemand stürzt; die Sicherung muss bereitstehen.']]],
['Bewertung im Turnen','Im Wettkampfturnen setzt sich die Note aus zwei Teilen zusammen. Die [D-Note] bewertet den Schwierigkeitsgrad der Übung: Jedes Element hat einen Schwierigkeitswert, dazu kommen Verbindungen und Anforderungen. Die [E-Note] bewertet die Ausführung; sie startet bei zehn Punkten, von denen für Fehler Abzüge vorgenommen werden. Typische Abzüge gibt es für gebeugte Arme oder Beine, fehlende [Körperspannung], Unsicherheiten und Schritte bei der [Landung]. Seit 2006 gibt es keine Höchstnote 10,0 mehr, weil die D-Note nach oben offen ist. Im Schulsport kann man ein ähnliches System nutzen: Man bewertet Schwierigkeit und Ausführung getrennt und macht die [Kriterien] vorher für alle sichtbar.',
 [['Unterscheide D-Note und E-Note.','D-Note: Schwierigkeit (nach oben offen). E-Note: Ausführung, startet bei 10 Punkten mit Abzügen.'],['Nenne drei typische Ausführungsfehler.','Gebeugte Arme oder Beine, fehlende Körperspannung, Schritte oder Unsicherheit bei der Landung.']]]
]},
o:{t:'Turnen aus Sicht der Sportwissenschaft', s:[
['Angst, Wagnis und Verantwortung','Viele turnerische Bewegungen wie Überschläge oder Salti werden als Wagnis erlebt. Ob eine Situation [Angst] auslöst, hängt nach dem transaktionalen Stressmodell von Lazarus von zwei Bewertungen ab: In der [primären] Bewertung schätzt man ein, ob die Situation bedrohlich ist. In der [sekundären] Bewertung prüft man, ob die eigenen Fähigkeiten und Hilfen ausreichen. Ein wichtiger Einflussfaktor ist die [Selbstwirksamkeit] nach Bandura: die Überzeugung, eine Aufgabe aus eigener Kraft bewältigen zu können. Sie wächst vor allem durch eigene Erfolgserlebnisse. Methodisch lässt sich das nutzen, indem man nach dem Prinzip „vom Leichten zum Schweren“ eine [methodische] Übungsreihe aufbaut, Gerätehilfen einsetzt und zuverlässig Hilfe leistet.',
 [['Erläutere das Modell von Lazarus an einer Turnsituation.','Primär: Ist der Handstützüberschlag bedrohlich? Sekundär: Reichen Können, Hilfestellung und Gerätehilfen? Fällt die sekundäre Bewertung negativ aus, entsteht Angst.'],['Erläutere, wie eine methodische Übungsreihe Angst reduzieren kann.','Kleine, schaffbare Schritte erzeugen Erfolgserlebnisse und verbessern die sekundäre Bewertung; Gerätehilfen verringern das Risiko.']]],
['Biomechanik der Drehung','Bei Drehungen in der Luft, etwa beim Salto, gilt der Satz von der [Erhaltung des Drehimpulses]. Der Drehimpuls ist das Produkt aus Trägheitsmoment und Winkelgeschwindigkeit. Er wird beim Absprung erzeugt und kann in der Flugphase nicht mehr verändert werden. Das [Trägheitsmoment] hängt davon ab, wie weit die Körpermasse von der Drehachse entfernt ist. Zieht sich der Turner in eine [Hocke] zusammen, verringert sich das Trägheitsmoment, und die Winkelgeschwindigkeit steigt – er dreht schneller. Streckt er sich vor der Landung, wird die Drehung [langsamer]. Deshalb ist ein gehockter Salto leichter als ein gestreckter: Bei gleichem Drehimpuls wird die Drehung schneller abgeschlossen.',
 [['Erkläre, warum sich ein Turner in der Hocke schneller dreht.','Das Trägheitsmoment sinkt, weil die Masse näher an der Drehachse ist; bei konstantem Drehimpuls steigt die Winkelgeschwindigkeit.'],['Warum kann der Drehimpuls in der Flugphase nicht verändert werden?','In der Luft wirken keine äußeren Drehmomente (vom Luftwiderstand abgesehen); der Drehimpuls bleibt erhalten.']]],
['Phasen des motorischen Lernens','Nach Meinel und Schnabel verläuft motorisches Lernen in drei Phasen. In der Phase der [Grobkoordination] gelingt die Bewegung in ihren Grundzügen, ist aber noch unökonomisch, verkrampft und fehlerhaft. In der Phase der [Feinkoordination] wird die Bewegung flüssiger und genauer; unter Störungen oder Ermüdung treten jedoch wieder Fehler auf. In der Phase der [variablen Verfügbarkeit] kann die Bewegung auch unter wechselnden Bedingungen sicher ausgeführt werden. Für jede Phase eignen sich andere Hilfen: Am Anfang helfen eine klare [Bewegungsvorstellung], Gerätehilfen und Hilfestellung, später gezielte Rückmeldungen zu Details und schließlich Variationen der Bedingungen.',
 [['Beschreibe die drei Lernphasen nach Meinel und Schnabel.','Grobkoordination (Grundform, fehlerhaft), Feinkoordination (flüssig und genau, unter Störung fehleranfällig), variable Verfügbarkeit (sicher unter wechselnden Bedingungen).'],['Ordne den Lernphasen passende Hilfen zu.','Grobkoordination: Bewegungsvorstellung, Gerätehilfen, Hilfestellung. Feinkoordination: detaillierte Rückmeldung. Variable Verfügbarkeit: Variation der Bedingungen.']]],
['Körperideale und Gesundheit','Gerätturnen ist eine [ästhetische] Sportart: Die Bewertung berücksichtigt das Erscheinungsbild der Bewegung. Gleichzeitig ist ein geringes Körpergewicht bei vielen Elementen ein Vorteil. In solchen Sportarten besteht ein erhöhtes Risiko für gesundheitlich [fragwürdige] Verhaltensweisen, etwa übermäßige Gewichtskontrolle. Hinzu kommt die frühe Spezialisierung: Spitzenturnerinnen beginnen oft schon im Kindesalter mit hohen Trainingsumfängen. Das kann zu [Überlastungsschäden] an Handgelenken und Wirbelsäule führen. Viele Verbände setzen sich deshalb für ein Mindestalter bei internationalen Wettkämpfen, für [Gesundheitsuntersuchungen] und für einen Trainingsalltag ein, in dem Leistung und Wohlbefinden der Athletinnen und Athleten zusammen gedacht werden.',
 [['Erläutere, warum ästhetische Sportarten als Risikobereich für fragwürdige Körperideale gelten.','Erscheinungsbild und geringes Gewicht werden belohnt; das kann Druck zu übermäßiger Gewichtskontrolle erzeugen.'],['Beurteile frühe Spezialisierung im Turnen.','Pro: Lernen komplexer Elemente im günstigen Alter. Contra: Überlastungsschäden, psychischer Druck, Drop-out. Eigenes begründetes Urteil.']]]
]}

L:{
u:{t:'Tanzen verstehen', s:[
['Tanzen im Takt','Musik hat einen Grundschlag, den man [Beat] nennt. Man kann ihn mitklatschen oder mitstampfen. Die meisten Popsongs stehen im [Viervierteltakt]: Es gibt vier Schläge pro Takt, und der erste Schlag ist meist am stärksten betont. Tänzerinnen und Tänzer zählen oft bis acht, bevor sie wieder bei eins beginnen. Diese Zählweise heißt „ein [Achter]“. So können alle in einer Gruppe gleichzeitig beginnen und die Schritte einander zuordnen. Wie schnell ein Lied ist, nennt man das [Tempo]. Es wird in Schlägen pro Minute angegeben, auf Englisch „beats per minute“, kurz bpm. Ein langsames Lied hat zum Beispiel 70 bpm, ein schnelles Tanzlied oft über 120 bpm.',
 [['Was ist ein „Achter“ beim Tanzen?','Man zählt die Schläge bis acht und beginnt dann wieder bei eins; so starten alle gleichzeitig.'],['Was gibt die Angabe „bpm“ an?','Das Tempo: Schläge pro Minute (beats per minute).']]],
['Den Raum nutzen','Beim Tanzen kann man den Raum auf verschiedene Weise nutzen. Eine Gruppe kann in einer [Linie], einem Kreis, einem Block oder einem Keil stehen. Diese Anordnungen heißen [Aufstellungsformen]. Die Wege, die Tänzer im Raum zurücklegen, nennt man [Raumwege]: geradeaus, im Bogen, im Zickzack oder im Kreis. Außerdem gibt es drei [Raumebenen]: die tiefe Ebene am Boden, die mittlere Ebene im Stehen und die hohe Ebene, zum Beispiel bei Sprüngen. Eine Choreografie wirkt spannender, wenn sie zwischen Ebenen und Aufstellungsformen wechselt. Für die Zuschauer ist es wichtig, dass die Tänzer nach vorne zum [Publikum] ausgerichtet sind.',
 [['Nenne vier Aufstellungsformen.','Linie, Kreis, Block, Keil.'],['Beschreibe die drei Raumebenen.','Tief (am Boden), mittel (im Stehen), hoch (z. B. bei Sprüngen).']]],
['Gemeinsam tanzen','In einer Gruppe gibt es verschiedene Möglichkeiten, wie die Bewegungen zueinander passen. Machen alle genau dasselbe zur gleichen Zeit, tanzen sie [synchron]. Beim [Kanon] beginnen die Tänzer nacheinander mit derselben Bewegung, wie bei einem Lied, das versetzt gesungen wird. Beim [Spiegelbild] stehen sich zwei Personen gegenüber, und eine macht die Bewegungen der anderen spiegelverkehrt nach. Bei „Frage und Antwort“ zeigt eine Gruppe eine Bewegung und die andere antwortet mit einer neuen. Damit die Gruppe gut zusammenarbeitet, braucht es [Absprachen]: Wer beginnt? Auf welchen Takt? Wo stehen wir am Ende?',
 [['Was ist der Unterschied zwischen synchron und Kanon?','Synchron: alle gleichzeitig dasselbe. Kanon: dieselbe Bewegung zeitversetzt nacheinander.'],['Warum sind Absprachen in der Gruppe wichtig?','Damit alle wissen, wer beginnt, auf welchen Takt und wo man am Ende steht.']]],
['Tanzstile','Es gibt sehr viele Tanzstile. [Volkstänze] werden in vielen Ländern seit Generationen getanzt und haben oft feste Schrittfolgen. Hip-Hop entstand in den 1970er-Jahren in der [Bronx], einem Stadtteil von New York. Zum Hip-Hop gehören Stile wie Breaking, bei dem man am Boden dreht und friert. Beim [Jumpstyle] springt man im schnellen Rhythmus von einem Bein aufs andere. Line Dance wird in Reihen getanzt, alle machen die gleichen Schritte. Viele Tänze entstehen heute auch durch soziale Netzwerke, wenn kurze Choreografien nachgetanzt werden. Egal welcher Stil: Tanzen fördert [Rhythmusgefühl], Koordination und Ausdauer.',
 [['Wo und wann entstand Hip-Hop?','In den 1970er-Jahren in der Bronx, einem Stadtteil von New York.'],['Was fördert Tanzen?','Rhythmusgefühl, Koordination und Ausdauer.']]]
]},
m:{t:'Tanz: Gestalten und Präsentieren', s:[
['Gestaltungskriterien','Um eine Tanzgestaltung zu planen und zu beurteilen, nutzt man vier Gestaltungskriterien. Das Kriterium [Raum] umfasst Aufstellungsformen, Raumwege, Raumebenen und Bewegungsrichtungen. Das Kriterium [Zeit] beschreibt den Umgang mit Tempo und Rhythmus, etwa schnelle und langsame Passagen, Pausen oder Zeitlupe. Die [Dynamik] beschreibt den Krafteinsatz: Bewegungen können kräftig oder sanft, fließend oder abgehackt sein. Der [formale Aufbau] beschreibt die Struktur der Choreografie, zum Beispiel einen Anfang, einen Hauptteil mit Wiederholungen und Variationen und einen deutlichen Schluss. Eine gelungene Gestaltung setzt alle Kriterien bewusst ein und passt sie zur Musik und zum [Thema] an.',
 [['Nenne die vier Gestaltungskriterien.','Raum, Zeit, Dynamik, formaler Aufbau.'],['Was beschreibt das Kriterium Dynamik?','Den Krafteinsatz: kräftig oder sanft, fließend oder abgehackt.']]],
['Ausführungskriterien','Neben der Gestaltung spielt die Ausführung eine wichtige Rolle. Die [Bewegungsqualität] beschreibt, wie sauber und deutlich Bewegungen ausgeführt werden: Sind Arme gestreckt, wenn sie gestreckt sein sollen? Werden Bewegungen beendet? Die [Synchronität] gibt an, ob eine Gruppe wirklich gleichzeitig tanzt. Der [Ausdruck] zeigt, ob Gefühle und das Thema für die Zuschauer erkennbar werden, etwa über Mimik, Blickrichtung und Körperhaltung. Die [Körperspannung] sorgt dafür, dass Bewegungen kontrolliert und präzise wirken. Für eine Bewertung müssen diese Kriterien durch beobachtbare [Indikatoren] konkretisiert werden, zum Beispiel: „Alle Arme erreichen auf Zählzeit 5 gleichzeitig die Hochhalte.“',
 [['Nenne die vier Ausführungskriterien.','Bewegungsqualität, Synchronität, Ausdruck, Körperspannung.'],['Was ist ein Indikator und warum braucht man ihn?','Ein beobachtbares Merkmal, das ein Kriterium konkret macht; so wird die Bewertung nachvollziehbar.']]],
['Eine Choreografie entwickeln','Es gibt drei methodische Zugänge zur Bewegungsgestaltung. Beim [Nachgestalten] lernt man eine vorgegebene Choreografie und tanzt sie möglichst genau nach. Beim [Umgestalten] wird eine bekannte Choreografie verändert, zum Beispiel durch neue Aufstellungsformen, ein anderes Tempo oder einen Kanon. Beim [Neugestalten] entsteht eine eigene Choreografie. Dafür sammelt die Gruppe zunächst Bewegungsideen, oft ausgehend von einem [Motiv], einer kurzen Bewegungsfolge, die später wiederholt und variiert wird. Danach werden die Teile angeordnet, mit der Musik abgestimmt und geübt. Hilfreich ist es, die Choreografie mit dem iPad zu filmen und mit Blick auf die Kriterien zu [überarbeiten].',
 [['Unterscheide Nachgestalten, Umgestalten und Neugestalten.','Nachgestalten: vorgegebene Choreografie nachtanzen. Umgestalten: bekannte Choreografie verändern. Neugestalten: eigene Choreografie entwickeln.'],['Was ist ein Motiv in der Choreografie?','Eine kurze Bewegungsfolge, die wiederholt und variiert wird.']]],
['Hip-Hop und seine Kultur','Hip-Hop ist mehr als ein Tanzstil, er ist eine [Jugendkultur]. Zu ihr zählen traditionell vier Elemente: DJing (Musik auflegen), MCing (Rap), Graffiti und [Breaking]. Breaking entstand in den 1970er-Jahren, als Jugendliche in den Pausen der Musik, den sogenannten Breaks, tanzten. Typisch sind Toprock (Tanz im Stehen), Footwork am Boden, Powermoves wie Drehungen und Freezes, bei denen der Körper in einer Position einfriert. Weitere Stile sind Popping, bei dem Muskeln ruckartig angespannt werden, und [Locking]. Bei den Olympischen Spielen 2024 in Paris war Breaking erstmals [olympisch]. In Battles treten Tänzer gegeneinander an; Respekt und Kreativität gelten dabei als zentrale Werte.',
 [['Nenne die vier traditionellen Elemente des Hip-Hop.','DJing, MCing (Rap), Graffiti, Breaking.'],['Was ist ein Freeze?','Eine Position, in der der Körper beim Breaking einfriert.']]]
]},
o:{t:'Tanz aus Sicht der Sportwissenschaft', s:[
['Ästhetik und kriteriengeleitete Bewertung','Die Bewertung von Tanz gilt als besonders [subjektiv], weil Geschmack und Sehgewohnheiten eine Rolle spielen. Um Präsentationen fair zu beurteilen, werden Kriterien und Indikatoren vorab festgelegt. Ausführungskriterien wie Synchronität oder Körperspannung lassen sich relativ [objektiv] beobachten. Gestaltungskriterien wie Originalität oder Ausdruck erfordern dagegen eine stärkere Interpretation. Ein [Beobachtungsbogen] mit Skalen und Beispielen für jede Stufe erhöht die Übereinstimmung zwischen verschiedenen Beobachtern, also die Objektivität. Trotzdem bleibt ein Rest an Subjektivität. In der Bewertung sollte deshalb transparent sein, welches Gewicht [Ausführung] und Gestaltung jeweils haben.',
 [['Warum gilt die Bewertung von Tanz als subjektiv?','Geschmack, Sehgewohnheiten und Interpretation beeinflussen das Urteil, besonders bei Gestaltung und Ausdruck.'],['Wie kann man die Objektivität einer Tanzbewertung erhöhen?','Durch vorab festgelegte Kriterien und Indikatoren, einen Beobachtungsbogen mit Skalen und Beispielen sowie transparente Gewichtung.']]],
['Improvisation und Bewegungsqualitäten','Bei der [Improvisation] entstehen Bewegungen spontan, ohne festgelegte Abfolge. Ausgangspunkte können ein Objekt, ein Musikstück, ein Bild oder ein Thema sein. Ein bekanntes Modell, um Bewegungsqualitäten zu beschreiben, stammt von Rudolf von [Laban]. Er unterscheidet vier Faktoren: [Gewicht] (kraftvoll oder leicht), Zeit (plötzlich oder verzögert), Raum (direkt oder indirekt) und Fluss (gebunden oder frei). Aus ihren Kombinationen ergeben sich typische Bewegungsqualitäten, etwa „stoßen“ (kraftvoll, plötzlich, direkt) oder „schweben“ (leicht, verzögert, indirekt). Dieses Vokabular hilft, Bewegungen genauer zu beschreiben und in der Improvisation gezielt zu [variieren].',
 [['Nenne die vier Faktoren nach Laban.','Gewicht, Zeit, Raum, Fluss.'],['Beschreibe die Qualität „stoßen“ mit den Laban-Faktoren.','Kraftvoll (Gewicht), plötzlich (Zeit), direkt (Raum).']]],
['Tanz in Kultur und Gesellschaft','Tanz ist in allen Kulturen verbreitet und erfüllt unterschiedliche Funktionen: religiös, gesellig, künstlerisch oder sportlich. Im 20. Jahrhundert entwickelte sich in Deutschland der [Ausdruckstanz], der sich vom strengen klassischen Ballett löste und Gefühle frei ausdrücken wollte; eine bekannte Vertreterin war Mary Wigman. Pina Bausch prägte mit ihrem Tanztheater in [Wuppertal] die moderne Tanzkunst weltweit. Heute verbreiten sich Tanzstile über soziale Medien sehr schnell. Das ermöglicht Teilhabe, kann aber auch zur bloßen [Nachahmung] kurzer Choreografien führen. Zudem stellt sich die Frage nach kultureller Aneignung, wenn Tänze ohne Kenntnis ihres [Ursprungs] übernommen werden.',
 [['Was zeichnete den Ausdruckstanz aus?','Er löste sich vom strengen Ballett und wollte Gefühle frei ausdrücken.'],['Beurteile die Verbreitung von Tänzen über soziale Medien.','Pro: Teilhabe, Motivation, schnelle Verbreitung. Contra: bloße Nachahmung, Körperbilder, kulturelle Aneignung. Eigenes begründetes Urteil.']]],
['Tanz als Training','Tanz stellt hohe Anforderungen an die [koordinativen] Fähigkeiten, besonders an Rhythmisierungs-, Gleichgewichts- und Orientierungsfähigkeit. Je nach Stil und Intensität ist Tanz außerdem ein wirksames [Ausdauertraining]: Eine durchgetanzte Choreografie über mehrere Minuten kann die Herzfrequenz deutlich erhöhen. Für Sprünge und Hebefiguren sind Schnellkraft und Rumpfstabilität nötig, für große Bewegungsamplituden eine gute [Beweglichkeit]. Studien deuten darauf hin, dass regelmäßiges Tanzen auch das psychische Wohlbefinden und das Gedächtnis positiv beeinflussen kann. Für den Schulsport bedeutet das: Tanz lässt sich unter der pädagogischen Perspektive „Gesundheit fördern“ ebenso begründen wie unter „sich körperlich [ausdrücken]“.',
 [['Welche koordinativen Fähigkeiten werden beim Tanzen besonders gefordert?','Rhythmisierungs-, Gleichgewichts- und Orientierungsfähigkeit.'],['Begründe Tanz im Schulsport aus zwei pädagogischen Perspektiven.','Gesundheit fördern (Ausdauer, Koordination, Wohlbefinden) und sich körperlich ausdrücken, Bewegungen gestalten.']]]
]}
},

SPORTS.push({id:'fi', name:'Fitness', bf:'BF 1 · Den Körper wahrnehmen', field:'grid',
L:{
u:{t:'Fitness verstehen', s:[
['Was ist Fitness?','Fit sein bedeutet, dass der Körper den Anforderungen im Alltag und im Sport gut gewachsen ist. Die Sportwissenschaft unterscheidet fünf [motorische Grundfähigkeiten]: Kraft, Ausdauer, Schnelligkeit, Beweglichkeit und Koordination. [Kraft] braucht man zum Heben, Springen und Klettern. Ausdauer hilft, lange durchzuhalten, ohne müde zu werden. Schnelligkeit ist wichtig, um schnell zu reagieren und loszusprinten. [Beweglichkeit] bedeutet, dass sich die Gelenke weit bewegen lassen, zum Beispiel beim Spagat. [Koordination] ist die Fähigkeit, Bewegungen geschickt und genau zu steuern, etwa beim Balancieren oder Jonglieren. Wer alle fünf Fähigkeiten trainiert, wird vielseitig fit.',
 [['Nenne die fünf motorischen Grundfähigkeiten.','Kraft, Ausdauer, Schnelligkeit, Beweglichkeit, Koordination.'],['Was versteht man unter Koordination?','Die Fähigkeit, Bewegungen geschickt und genau zu steuern.']]],
['Muskeln arbeiten im Team','Der Körper hat über 600 Muskeln. Muskeln können sich nur [zusammenziehen], also ziehen, aber nicht drücken. Deshalb arbeiten sie immer paarweise. Beugt man den Arm, zieht sich der [Bizeps] auf der Vorderseite des Oberarms zusammen. Streckt man den Arm wieder, arbeitet der [Trizeps] auf der Rückseite. Der Muskel, der eine Bewegung ausführt, heißt [Agonist], sein Gegenspieler heißt Antagonist. Damit der Körper gerade und gesund bleibt, sollten beide Seiten gleich gut trainiert werden. Wenn man zum Beispiel nur die Bauchmuskeln kräftigt und nie den Rücken, kann ein Ungleichgewicht entstehen. Muskeln sind mit [Sehnen] an den Knochen befestigt.',
 [['Warum arbeiten Muskeln immer paarweise?','Sie können nur ziehen, nicht drücken; ein Gegenspieler muss die Gegenbewegung ausführen.'],['Was passiert beim Beugen und Strecken des Arms?','Beugen: Bizeps zieht sich zusammen. Strecken: Trizeps zieht sich zusammen.']]],
['Richtig aufwärmen','Vor dem Sport sollte man sich [aufwärmen]. Dabei steigt die Körpertemperatur, das Herz schlägt schneller und die Muskeln werden besser durchblutet. Die Gelenke bilden mehr Gelenkflüssigkeit, die wie ein Schmiermittel wirkt. So ist man leistungsfähiger und verletzt sich seltener. Man unterscheidet das [allgemeine] Aufwärmen, zum Beispiel lockeres Laufen oder Hampelmänner, und das [spezielle] Aufwärmen, bei dem Bewegungen der Sportart vorbereitet werden, etwa Pässe im Fußball. Ein Aufwärmprogramm beginnt locker und wird langsam [intensiver]. Es dauert meist zehn bis fünfzehn Minuten. Ob man warm ist, merkt man daran, dass man leicht schwitzt und schneller atmet.',
 [['Was passiert im Körper beim Aufwärmen?','Körpertemperatur steigt, Herz schlägt schneller, Muskeln werden besser durchblutet, mehr Gelenkflüssigkeit.'],['Unterscheide allgemeines und spezielles Aufwärmen.','Allgemein: z. B. lockeres Laufen. Speziell: Bewegungen der Sportart vorbereiten.']]],
['Zirkeltraining','Beim [Zirkeltraining] sind mehrere Stationen im Kreis aufgebaut. An jeder Station wird eine Übung für eine bestimmte Muskelgruppe gemacht, zum Beispiel Kniebeugen, Liegestütze, Sit-ups oder Seilspringen. Man trainiert eine festgelegte Zeit, etwa 30 Sekunden, dann folgt eine [Pause], und man wechselt zur nächsten Station. Wichtig ist, dass sich die Stationen abwechseln: Auf eine Übung für die Beine folgt eine für den Oberkörper. So können sich die Muskeln erholen, während andere arbeiten. Saubere [Technik] ist wichtiger als möglichst viele Wiederholungen. Wer seine Wiederholungen aufschreibt, kann nach einigen Wochen sehen, ob er [besser] geworden ist.',
 [['Warum sollen sich die Stationen im Zirkeltraining abwechseln?','Damit sich eine Muskelgruppe erholen kann, während eine andere arbeitet.'],['Warum lohnt es sich, die Wiederholungen aufzuschreiben?','So kann man nach einigen Wochen den Trainingsfortschritt sehen.']]]
]},
m:{t:'Fitness: Kraft, Haltung, Beweglichkeit', s:[
['Kraftformen','Kraft ist nicht gleich Kraft. Die [Maximalkraft] ist die größte Kraft, die ein Muskel willkürlich aufbringen kann, etwa beim Heben eines sehr schweren Gegenstands. Die [Schnellkraft] ist die Fähigkeit, in kurzer Zeit möglichst viel Kraft zu entwickeln, wie beim Absprung oder beim Wurf. Die [Kraftausdauer] beschreibt, wie lange Muskeln Kraft aufbringen können, ohne zu ermüden, etwa bei vielen Liegestützen oder beim Rudern. Eine Sonderform ist die [Reaktivkraft], bei der ein Muskel nach einer schnellen Dehnung sofort kraftvoll arbeitet, zum Beispiel bei Sprungserien. Jede Sportart braucht eine andere Mischung dieser Kraftformen. Ein Kugelstoßer braucht vor allem Schnellkraft, ein Ruderer vor allem Kraftausdauer.',
 [['Unterscheide Maximalkraft, Schnellkraft und Kraftausdauer.','Maximalkraft: größte willkürliche Kraft. Schnellkraft: viel Kraft in kurzer Zeit. Kraftausdauer: Kraft lange ohne Ermüdung aufbringen.'],['Nenne für zwei Sportarten die wichtigste Kraftform.','Z. B. Kugelstoßen: Schnellkraft; Rudern: Kraftausdauer.']]],
['Haltung und muskuläre Balance','Viele Jugendliche sitzen täglich mehrere Stunden: in der Schule, bei den Hausaufgaben und am Handy. Dabei verkürzen sich häufig die Hüftbeuger und die Brustmuskulatur, während die Rücken- und Bauchmuskeln abschwächen. So entsteht eine [muskuläre Dysbalance], ein Ungleichgewicht zwischen Muskelgruppen. Mögliche Folgen sind eine Rundrückenhaltung, ein Hohlkreuz oder Rückenschmerzen. Gegen Dysbalancen hilft ein zweigleisiges Vorgehen: Verkürzte Muskeln werden [gedehnt], abgeschwächte Muskeln werden gekräftigt. Besonders wichtig ist die [Rumpfmuskulatur], die wie ein Korsett die Wirbelsäule stabilisiert. Auch im Alltag hilft es, häufig die [Sitzposition] zu wechseln und schwere Lasten mit geradem Rücken aus den Beinen zu heben.',
 [['Was ist eine muskuläre Dysbalance und wie entsteht sie?','Ein Ungleichgewicht zwischen Muskelgruppen; z. B. durch langes Sitzen verkürzen Hüftbeuger und Brustmuskeln, Rücken- und Bauchmuskeln schwächen ab.'],['Wie kann man Dysbalancen ausgleichen?','Verkürzte Muskeln dehnen, abgeschwächte Muskeln kräftigen, besonders die Rumpfmuskulatur; im Alltag Sitzposition wechseln.']]],
['Beweglichkeit und Dehnmethoden','Beweglichkeit hängt von der Gelenkform und von der Dehnfähigkeit der Muskeln, Sehnen und Bänder ab. Man unterscheidet verschiedene Dehnmethoden. Beim [statischen] Dehnen wird eine Dehnposition langsam eingenommen und 20 bis 30 Sekunden gehalten. Beim [dynamischen] Dehnen wird die Dehnposition mit kontrollierten, federnden oder schwingenden Bewegungen wiederholt erreicht. Beim [CR-Stretching] (Contract-Relax) wird der Muskel in Dehnposition einige Sekunden angespannt, dann entspannt und anschließend etwas weiter gedehnt. Für das Aufwärmen vor schnellkräftigen Belastungen wie Sprints wird eher [dynamisches] Dehnen empfohlen, weil langes statisches Dehnen direkt davor die Schnellkraft kurzfristig verringern kann.',
 [['Beschreibe drei Dehnmethoden.','Statisch: Position 20–30 s halten. Dynamisch: Position mit kontrollierten, federnden Bewegungen wiederholt erreichen. CR-Stretching: anspannen, entspannen, weiter dehnen.'],['Welche Dehnmethode eignet sich vor Sprints, und warum?','Dynamisches Dehnen; langes statisches Dehnen kann die Schnellkraft kurzfristig verringern.']]],
['Trainingsprinzipien','Damit Training wirkt, muss der [Trainingsreiz] stark genug sein. Ein zu schwacher Reiz bewirkt keine Anpassung, ein zu starker kann schaden. Nach einer Belastung braucht der Körper Erholung. In dieser Zeit baut er nicht nur Energiespeicher wieder auf, sondern über das Ausgangsniveau hinaus – das nennt man [Superkompensation]. Folgt der nächste Reiz zum richtigen Zeitpunkt, steigt die Leistung. Wird der Körper stärker, muss auch die Belastung steigen; das ist das Prinzip der [progressiven] Belastungssteigerung. Wichtig ist außerdem die [Regelmäßigkeit]: Wer nur selten trainiert, verliert die Anpassungen wieder. Gesteuert wird das Training über Belastungsgrößen wie Intensität, Umfang, Dauer, Dichte und Häufigkeit.',
 [['Erkläre das Prinzip der Superkompensation.','Nach Belastung und Erholung steigt die Leistungsfähigkeit kurzzeitig über das Ausgangsniveau; der nächste Reiz sollte in dieser Phase folgen.'],['Was bedeutet progressive Belastungssteigerung?','Wird der Körper leistungsfähiger, muss die Belastung schrittweise steigen, damit weiterhin Anpassungen entstehen.']]]
]},
o:{t:'Fitness aus Sicht der Sportwissenschaft', s:[
['Anpassungen durch Krafttraining','Krafttraining führt zu zwei Arten von Anpassungen. In den ersten Wochen steigt die Kraft vor allem durch [neuronale] Anpassungen: Das Nervensystem lernt, mehr motorische Einheiten gleichzeitig zu aktivieren ([intramuskuläre Koordination]) und das Zusammenspiel verschiedener Muskeln zu verbessern (intermuskuläre Koordination). Erst nach einigen Wochen gewinnt die [Hypertrophie] an Bedeutung, also die Zunahme des Muskelquerschnitts durch dickere Muskelfasern. Kraftzuwächse bei Anfängern sind deshalb zunächst kaum sichtbar, aber deutlich messbar. Im Kindes- und Jugendalter ist Krafttraining bei sachgerechter Anleitung und angemessener Belastung nach heutigem Kenntnisstand [sicher] und fördert auch die Knochendichte und die Verletzungsprophylaxe.',
 [['Unterscheide intra- und intermuskuläre Koordination.','Intramuskulär: mehr motorische Einheiten innerhalb eines Muskels gleichzeitig aktivieren. Intermuskulär: Zusammenspiel verschiedener Muskeln verbessern.'],['Erkläre, warum Kraftzuwächse bei Anfängern kaum sichtbar sind.','In den ersten Wochen beruhen sie vor allem auf neuronalen Anpassungen, nicht auf Muskelwachstum.']]],
['Krafttrainingsmethoden','Je nach Ziel werden die Belastungsgrößen unterschiedlich kombiniert. Die [Hypertrophiemethode] arbeitet mit mittleren bis hohen Lasten (etwa 70 bis 85 Prozent der Maximalkraft), etwa 6 bis 12 Wiederholungen pro Satz und Pausen von ein bis zwei Minuten. Das Ziel ist Muskelaufbau. Die Methode der [intramuskulären Koordination] nutzt sehr hohe Lasten über 90 Prozent bei nur 1 bis 3 Wiederholungen und langen Pausen; sie ist nur für Fortgeschrittene geeignet. Für die [Kraftausdauer] werden geringe Lasten mit vielen Wiederholungen, meist über 20, und kurzen Pausen kombiniert. Grundlage für alle Methoden ist die Kenntnis der eigenen Maximalkraft, die oft über das [Einer-Wiederholungs-Maximum] (1RM) geschätzt wird.',
 [['Vergleiche Hypertrophie- und Kraftausdauermethode.','Hypertrophie: ca. 70–85 % 1RM, 6–12 Wiederholungen, 1–2 min Pause, Ziel Muskelaufbau. Kraftausdauer: geringe Last, >20 Wiederholungen, kurze Pausen.'],['Warum ist die IK-Methode nur für Fortgeschrittene geeignet?','Sehr hohe Lasten erfordern sichere Technik und eine gute Grundkraft; das Verletzungsrisiko ist sonst hoch.']]],
['Fitnesstrends und Körperbilder','Fitness ist in sozialen Medien allgegenwärtig. Dort werden oft [idealisierte] Körper gezeigt, die durch Licht, Posen und Bildbearbeitung entstehen. Studien zeigen, dass häufiger Kontakt mit solchen Bildern die [Körperzufriedenheit] verringern kann. Gleichzeitig werden Nahrungsergänzungsmittel beworben, deren Nutzen für Jugendliche bei ausgewogener Ernährung meist gering ist. Besonders kritisch sind [anabole Steroide], die auch im Freizeitsport verbreitet sind. Sie können Herz, Leber und Hormonsystem schädigen und bei Jugendlichen das Wachstum vorzeitig beenden. Ein gesundheitsorientiertes Fitnessverständnis stellt [Wohlbefinden] und Leistungsfähigkeit in den Mittelpunkt, nicht ein bestimmtes Aussehen. Dabei spielen auch geschlechterbezogene Körperideale eine Rolle.',
 [['Erläutere, wie soziale Medien Körperbilder beeinflussen können.','Idealisierte, bearbeitete Körper werden als Norm wahrgenommen; häufiger Kontakt kann die Körperzufriedenheit senken.'],['Beurteile den Einsatz von Anabolika im Freizeitsport.','Gesundheitsrisiken (Herz, Leber, Hormone, Wachstum), Abhängigkeit von Körperidealen; aus gesundheitlicher Sicht abzulehnen. Eigenes begründetes Urteil.']]],
['Fitness messen','Um Fitness zu erfassen, werden [sportmotorische Tests] eingesetzt. Ein bekanntes Beispiel ist der Deutsche Motorik-Test, der für Kinder und Jugendliche von 6 bis 18 Jahren entwickelt wurde. Er umfasst Aufgaben wie [Standweitsprung] (Schnellkraft der Beine), Sit-ups (Kraftausdauer der Rumpfmuskulatur), Rumpfbeuge (Beweglichkeit) und einen Ausdauerlauf. Die Ergebnisse können mit [Normwerten] gleichaltriger Kinder verglichen werden. Dabei stellt sich die Frage nach der Bezugsnorm: Man kann Leistungen mit anderen vergleichen ([soziale] Bezugsnorm), mit der eigenen früheren Leistung (individuelle Bezugsnorm) oder mit einem festen Kriterium (kriteriale Bezugsnorm). Für die Motivation ist der Vergleich mit sich selbst besonders günstig.',
 [['Nenne drei Testaufgaben und die Fähigkeit, die sie messen.','Standweitsprung: Schnellkraft der Beine. Sit-ups: Kraftausdauer Rumpf. Rumpfbeuge: Beweglichkeit.'],['Unterscheide soziale, individuelle und kriteriale Bezugsnorm.','Sozial: Vergleich mit anderen. Individuell: Vergleich mit eigener früherer Leistung. Kriterial: Vergleich mit festem Kriterium.']]]
]}
},

SPORTS.push({id:'au', name:'Ausdauer', bf:'BF 1 · Ausdauer', field:'grid',
L:{
u:{t:'Ausdauer verstehen', s:[
['Was ist Ausdauer?','Ausdauer ist die Fähigkeit, eine Belastung möglichst lange durchzuhalten, ohne zu ermüden. Dazu gehört auch, sich nach einer Anstrengung [schnell] zu erholen. Bei Ausdauerbelastungen arbeiten Herz, Lunge und Blutkreislauf eng zusammen. Die [Lunge] nimmt Sauerstoff aus der Luft auf. Das [Herz] pumpt das sauerstoffreiche Blut durch die Adern zu den Muskeln. In den Muskeln wird der Sauerstoff genutzt, um Energie aus der Nahrung zu gewinnen. Je besser die Ausdauer, desto leichter fallen lange Spiele, Radtouren oder Wanderungen. Ausdauertraining ist außerdem gut für die [Gesundheit], weil es das Herz stärkt.',
 [['Was ist Ausdauer?','Die Fähigkeit, eine Belastung lange durchzuhalten und sich schnell zu erholen.'],['Welche Aufgabe haben Lunge und Herz bei Ausdauerbelastungen?','Die Lunge nimmt Sauerstoff auf, das Herz pumpt sauerstoffreiches Blut zu den Muskeln.']]],
['Herz und Puls','Bei jedem Herzschlag wird Blut in die Adern gedrückt. Diese Druckwelle kann man als [Puls] fühlen, zum Beispiel an der Innenseite des Handgelenks oder seitlich am Hals. Zum Messen legt man Zeige- und Mittelfinger auf die Stelle, zählt die Schläge [15] Sekunden lang und nimmt das Ergebnis mal vier. So erhält man die Schläge pro Minute. Der Puls in Ruhe heißt [Ruhepuls]; bei Kindern liegt er oft zwischen 70 und 100 Schlägen pro Minute. Beim Laufen steigt der Puls an. Für das Ausdauertraining ist ein Tempo gut, bei dem man sich noch unterhalten kann. Man nennt es auch [Plaudertempo]. Wer gut trainiert ist, hat meist einen niedrigeren Ruhepuls.',
 [['Wie misst man den Puls?','Zeige- und Mittelfinger an Handgelenk oder Hals, 15 Sekunden zählen, mal vier nehmen.'],['Was ist das Plaudertempo?','Ein Lauftempo, bei dem man sich noch unterhalten kann.']]],
['Richtig laufen','Beim Ausdauerlaufen ist eine ökonomische [Laufhaltung] wichtig, damit man Kraft spart. Der Oberkörper ist aufrecht, der Blick geht nach vorne. Die Arme schwingen locker neben dem Körper mit, die Ellbogen sind gebeugt, die Schultern bleiben [locker]. Der Fuß setzt möglichst unter dem Körper auf, nicht weit davor. Viele Läufer landen auf dem [Mittelfuß]. Die Schritte sind eher klein und leicht. Die Atmung sollte gleichmäßig sein; viele atmen zum Beispiel drei Schritte ein und drei Schritte aus. Wer zu schnell startet, muss oft bald [stehen] bleiben. Besser ist es, gleichmäßig zu laufen und das Tempo zu halten.',
 [['Beschreibe eine gute Laufhaltung.','Oberkörper aufrecht, Blick nach vorne, Arme locker mit gebeugten Ellbogen, Schultern locker, Fuß setzt unter dem Körper auf.'],['Warum sollte man nicht zu schnell starten?','Man ermüdet früh und muss oft stehen bleiben; gleichmäßiges Tempo ist ökonomischer.']]],
['Ausdauer mit Spaß','Ausdauer kann man nicht nur beim Laufen um den Sportplatz trainieren. Beim [Fahrtspiel] wechselt man das Tempo spielerisch, zum Beispiel schneller bis zum nächsten Baum und dann wieder locker. Beim [Orientierungslauf] sucht man mit einer Karte Posten im Gelände. Auch Schwimmen, Radfahren, Inlineskaten oder Tanzen trainieren die Ausdauer. Wichtig ist, dass man sich regelmäßig bewegt. Die Weltgesundheitsorganisation empfiehlt Kindern und Jugendlichen, sich täglich mindestens [60] Minuten mäßig bis anstrengend zu bewegen. Bei langen Belastungen sollte man ausreichend [trinken], am besten Wasser oder Saftschorle.',
 [['Was ist ein Fahrtspiel?','Ein Lauf mit spielerischen Tempowechseln, z. B. schneller bis zum nächsten Baum, dann wieder locker.'],['Wie viel Bewegung empfiehlt die WHO Kindern und Jugendlichen?','Täglich mindestens 60 Minuten mäßige bis anstrengende Bewegung.']]]
]},
m:{t:'Ausdauer: Grundlagen des Trainings', s:[
['Aerob und anaerob','Muskeln brauchen Energie. Diese entsteht, wenn Nährstoffe wie Kohlenhydrate und Fette abgebaut werden. Steht genug Sauerstoff zur Verfügung, spricht man von [aerober] Energiebereitstellung. Sie liefert viel Energie, aber nur langsam, und ist die Grundlage für lange Belastungen. Bei sehr intensiven Belastungen reicht der Sauerstoff nicht aus. Dann wird Energie [anaerob], also ohne ausreichend Sauerstoff, bereitgestellt. Dabei entsteht [Laktat], das Salz der Milchsäure. Steigt die Laktatkonzentration stark an, ermüden die Muskeln, und man muss das Tempo verringern. Wer seine aerobe Ausdauer trainiert, kann schneller laufen, bevor viel Laktat entsteht. Diese Fähigkeit nennt man [Grundlagenausdauer].',
 [['Unterscheide aerobe und anaerobe Energiebereitstellung.','Aerob: mit ausreichend Sauerstoff, viel Energie, langsam. Anaerob: ohne ausreichend Sauerstoff, schnell, mit Laktatbildung.'],['Was ist Laktat und welche Folge hat ein starker Anstieg?','Das Salz der Milchsäure; ein starker Anstieg führt zu Ermüdung.']]],
['Trainingsmethoden','Für das Ausdauertraining gibt es verschiedene Methoden. Bei der [Dauermethode] läuft man ohne Pause über längere Zeit, zum Beispiel 30 Minuten in gleichmäßigem Tempo. Eine Variante ist das [Fahrtspiel] mit wechselndem Tempo. Bei der [Intervallmethode] wechseln sich Belastung und Erholung planmäßig ab, wobei die Pausen nicht zur vollständigen Erholung führen. Man unterscheidet die extensive Intervallmethode mit vielen Wiederholungen bei mittlerer Intensität und die [intensive] Intervallmethode mit weniger, dafür schnelleren Wiederholungen. Bei der Wiederholungsmethode werden kurze Strecken sehr schnell gelaufen, mit vollständigen Pausen. Für Anfänger ist die Dauermethode am besten geeignet, weil sie die Grundlagenausdauer aufbaut.',
 [['Unterscheide Dauer- und Intervallmethode.','Dauermethode: lange ohne Pause in gleichmäßigem Tempo. Intervallmethode: planmäßiger Wechsel von Belastung und unvollständiger Erholung.'],['Welche Methode eignet sich für Anfänger und warum?','Die Dauermethode, weil sie die Grundlagenausdauer aufbaut.']]],
['Mit der Herzfrequenz steuern','Die [Herzfrequenz] zeigt, wie stark der Körper beansprucht wird. Um das Training zu steuern, braucht man einen Richtwert für die maximale Herzfrequenz. Eine grobe Faustformel lautet: [220] minus Lebensalter. Für eine 14-Jährige ergibt das etwa 206 Schläge pro Minute. Diese Formel ist allerdings nur eine Schätzung; die tatsächlichen Werte können um mehr als zehn Schläge abweichen. Für das Grundlagenausdauertraining wird häufig ein Bereich von etwa [60] bis 75 Prozent der maximalen Herzfrequenz empfohlen. Pulsuhren und Brustgurte zeigen die Herzfrequenz direkt an. Man kann die Belastung aber auch mit dem eigenen Empfinden steuern, etwa mit der Frage: Kann ich noch in ganzen [Sätzen] sprechen?',
 [['Berechne die geschätzte maximale Herzfrequenz einer 15-Jährigen.','220 − 15 = 205 Schläge pro Minute (grobe Schätzung).'],['Warum ist die Faustformel nur eingeschränkt brauchbar?','Sie ist nur eine Schätzung; die tatsächliche maximale Herzfrequenz kann um mehr als zehn Schläge abweichen.']]],
['Anpassungen durch Ausdauertraining','Regelmäßiges Ausdauertraining verändert den Körper. Das Herz wird kräftiger und kann mit jedem Schlag mehr Blut pumpen; man spricht vom [Schlagvolumen]. Deshalb sinkt der Ruhepuls. Bei Leistungssportlern kann sich das Herz sogar vergrößern; dieses sogenannte [Sportherz] ist eine gesunde Anpassung. In den Muskeln bilden sich mehr feine Blutgefäße, die [Kapillaren], sodass der Sauerstoff besser verteilt wird. Außerdem nehmen Zahl und Größe der [Mitochondrien] zu, der „Kraftwerke“ der Zellen, in denen die aerobe Energiegewinnung stattfindet. Insgesamt kann der Körper mehr Sauerstoff aufnehmen und verwerten. Diese Anpassungen bilden sich zurück, wenn man längere Zeit nicht trainiert.',
 [['Warum sinkt der Ruhepuls durch Ausdauertraining?','Das Herz wird kräftiger und pumpt pro Schlag mehr Blut (größeres Schlagvolumen); es braucht weniger Schläge.'],['Nenne zwei Anpassungen in der Muskulatur.','Mehr Kapillaren, mehr und größere Mitochondrien.']]]
]},
o:{t:'Ausdauer aus Sicht der Sportwissenschaft', s:[
['Energiestoffwechsel','Bei Ausdauerbelastungen wird ATP vor allem durch die [aerobe Glykolyse] (Abbau von Kohlenhydraten mit Sauerstoff) und die [Lipolyse] (Abbau von Fetten) bereitgestellt. Fette liefern pro Gramm mehr Energie, ihre Verbrennung benötigt aber mehr Sauerstoff und läuft langsamer ab. Bei steigender Intensität verschiebt sich der Anteil deshalb zu den Kohlenhydraten. Wird die Belastung so hoch, dass mehr Laktat gebildet als abgebaut wird, steigt die Laktatkonzentration im Blut stark an. Den Übergangsbereich bezeichnet man als [aerob-anaerobe Schwelle]; ein klassischer Richtwert liegt bei etwa [4] mmol Laktat pro Liter Blut, individuell kann der Wert aber deutlich abweichen. Ausdauertraining verschiebt die Schwelle zu höheren Geschwindigkeiten.',
 [['Vergleiche Fett- und Kohlenhydratverbrennung.','Fette: mehr Energie pro Gramm, aber mehr Sauerstoffbedarf und langsamer. Kohlenhydrate: schneller verfügbar, dominieren bei höherer Intensität.'],['Was versteht man unter der aerob-anaeroben Schwelle?','Den Bereich, ab dem mehr Laktat gebildet als abgebaut wird; klassischer Richtwert ca. 4 mmol/l, individuell verschieden.']]],
['Ausdauerformen','Ausdauer lässt sich nach verschiedenen Kriterien einteilen. Nach dem Anteil der beteiligten Muskulatur unterscheidet man [lokale] (weniger als etwa ein Siebtel der Muskulatur) und allgemeine Ausdauer. Nach der Belastungsdauer unterscheidet man nach Weineck die [Kurzzeitausdauer] (etwa 35 Sekunden bis 2 Minuten), die Mittelzeitausdauer (2 bis 10 Minuten) und die [Langzeitausdauer] (über 10 Minuten). Mit zunehmender Dauer steigt der Anteil der aeroben Energiebereitstellung. Außerdem wird zwischen [Grundlagenausdauer], die sportartunabhängig ist, und spezieller Ausdauer unterschieden, die auf die Anforderungen einer Sportart zugeschnitten ist. Ein Fußballspieler braucht zum Beispiel eine gute Grundlagenausdauer und eine spezielle Ausdauer für wiederholte Sprints.',
 [['Nenne die Ausdauerformen nach der Belastungsdauer.','Kurzzeitausdauer (ca. 35 s – 2 min), Mittelzeitausdauer (2–10 min), Langzeitausdauer (über 10 min).'],['Unterscheide Grundlagenausdauer und spezielle Ausdauer.','Grundlagenausdauer: sportartunabhängig. Spezielle Ausdauer: auf die Anforderungen einer Sportart zugeschnitten.']]],
['Leistungsdiagnostik','Die Ausdauerleistungsfähigkeit lässt sich auf verschiedene Weise messen. Ein einfacher Feldtest ist der [Cooper-Test], bei dem man zwölf Minuten so weit wie möglich läuft; er wurde 1968 von dem US-Arzt Kenneth Cooper veröffentlicht. Genauer ist ein [Laktatstufentest]: Die Geschwindigkeit wird stufenweise erhöht, nach jeder Stufe wird Blut aus dem Ohrläppchen entnommen und die Laktatkonzentration bestimmt. Als Goldstandard gilt die [Spiroergometrie], bei der die Atemgase gemessen werden; daraus wird die maximale Sauerstoffaufnahme (VO2max) bestimmt. Für den Schulsport ist der Cooper-Test praktikabel und [ökonomisch], seine Validität ist jedoch eingeschränkt, weil Motivation und Tempoeinteilung das Ergebnis stark beeinflussen.',
 [['Vergleiche Cooper-Test und Laktatstufentest.','Cooper-Test: einfacher Feldtest, 12 min laufen, ökonomisch, aber motivationsabhängig. Laktatstufentest: stufenweise Steigerung mit Laktatmessung, genauer, aufwendiger.'],['Beurteile die Validität des Cooper-Tests im Schulsport.','Eingeschränkt, da Motivation und Tempoeinteilung stark einfließen; dennoch praktikabel und ökonomisch.']]],
['Ausdauer und Gesundheit','Ausdauertraining gehört zu den wirksamsten Maßnahmen zur Vorbeugung von Herz-Kreislauf-Erkrankungen. Es senkt den Blutdruck, verbessert die Blutfettwerte und den Zuckerstoffwechsel und kann das Risiko für Übergewicht verringern. Auch das psychische [Wohlbefinden] profitiert; regelmäßige Bewegung kann Stress abbauen. Die WHO empfiehlt Erwachsenen 150 bis 300 Minuten mäßige oder 75 bis 150 Minuten intensive [Ausdaueraktivität] pro Woche, Kindern und Jugendlichen täglich mindestens 60 Minuten. Das [salutogenetische] Gesundheitsmodell nach Antonovsky fragt nicht nur, was krank macht, sondern was Menschen gesund hält. Danach stärkt Sport Ressourcen wie Selbstwirksamkeit und soziale [Unterstützung]. Übertraining, also zu viel Belastung bei zu wenig Erholung, kann die Gesundheit dagegen gefährden.',
 [['Nenne drei gesundheitliche Wirkungen von Ausdauertraining.','Senkt Blutdruck, verbessert Blutfettwerte und Zuckerstoffwechsel, fördert psychisches Wohlbefinden, verringert das Risiko für Übergewicht.'],['Erläutere den salutogenetischen Ansatz.','Fragt, was Menschen gesund hält; Sport stärkt Ressourcen wie Selbstwirksamkeit und soziale Unterstützung.']]]
]}
},
