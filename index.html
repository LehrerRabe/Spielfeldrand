  --accent:#1D5BB8; --accent-ink:#FFFFFF; --accent-soft:#E2EBF8; --sand:#EFE2C2;
  --court-red:#C2412D; --court-yellow:#E3A912; --court-green:#2D8A57;
  --good:#22804A; --good-soft:#E1F2E7; --bad:#B8402B; --bad-soft:#F8E4DF;
  --bg-op:.07;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

}

:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#17232B; --ink:#E4ECF0; --muted:#9AABB4; --line:#2A3A44;
  --accent:#6FA3EE; --accent-ink:#0B1520; --accent-soft:#1C3150; --sand:#4A4130;
  --court-red:#EA7A62; --court-yellow:#F0C24A; --court-green:#5CC28A;
  --good:#5CC28A; --good-soft:#173527; --bad:#EE7C66; --bad-soft:#3A1E19; --bg-op:.09; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.6rem} h2{font-size:1.65rem} h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lines{display:grid;gap:4px;margin-block:12px 22px}
.lines i{display:block;height:3px;border-radius:2px}
.lines i:nth-child(1){background:var(--accent);width:100%}
.lines i:nth-child(2){background:var(--court-red);width:72%}
.lines i:nth-child(3){background:var(--court-yellow);width:48%}
.lines i:nth-child(4){background:var(--court-green);width:28%}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.stack{display:flex;flex-direction:column;gap:26px}
section.step{display:flex;flex-direction:column;gap:12px}
.step-head{display:flex;align-items:baseline;gap:10px}
.step-no{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--accent);min-width:1.4em}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:10px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;min-width:0}
.tile b{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.1}
.tile small{color:var(--muted);font-size:.82rem;line-height:1.35}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.tname{display:flex;align-items:center;gap:9px;min-width:0}
.sicon{width:30px;height:30px;flex:none;color:var(--accent)}
.tile.rand .sicon{color:var(--court-red)}
.tile[aria-pressed="true"] .sicon{color:var(--accent)}

body.bgimg .wrap{position:relative;z-index:1}
body.bgimg .seg,body.bgimg .tile,body.bgimg .card{background:color-mix(in srgb,var(--surface) 92%,transparent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--court-yellow);outline-offset:2px}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border-radius:10px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-size:1.1rem;padding:15px 22px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:.9rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=url],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
label{font-weight:700}
.wheelnote{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:20}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.qrbox{background:#FFFFFF;padding:14px;border-radius:10px;line-height:0}
.qrbox img,.qrbox canvas{width:min(70vw,300px)!important;height:auto!important}
.code{font-family:var(--display);font-weight:700;font-size:2.2rem;letter-spacing:.06em;word-break:break-all}
.big-text{font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.55;text-align:left;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.reading{max-width:68ch;font-size:1.08rem;line-height:1.72}
.sec-h{font-family:var(--display);font-size:1.3rem;font-weight:700;margin-bottom:6px;display:block}
.gap{display:inline-block;width:10em;max-width:100%;padding:3px 8px;margin:2px 2px;border-radius:6px;border:1px solid var(--line);border-bottom:2px solid var(--accent);font:inherit;background:var(--bg);color:var(--ink)}
.gap.ok{border-color:var(--good);background:var(--good-soft)}
.gap.no{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.85rem;color:var(--good);font-weight:700;margin-left:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.92rem;background:var(--bg)}
.q{display:flex;flex-direction:column;gap:8px}
.q .qt{font-weight:700}
.sol{border-left:3px solid var(--good);background:var(--good-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg);font-weight:400}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mitem{position:relative;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 40px;cursor:pointer;min-height:52px}
.mitem .badge{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;border:1px dashed var(--line);color:var(--muted)}
.mitem.paired .badge{background:var(--accent);color:var(--accent-ink);border:0}
.mitem.sel{box-shadow:inset 0 0 0 2px var(--court-yellow)}
.mitem.ok{border-color:var(--good);background:var(--good-soft)}
.mitem.no{border-color:var(--bad);background:var(--bad-soft)}
.term{font-weight:700}
.result{font-family:var(--display);font-weight:700;font-size:1.6rem}
.laps{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lapcount{font-family:var(--display);font-weight:700;font-size:2.6rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;border-radius:4px;padding:0 2px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.tool{font:inherit;font-size:.92rem;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.canvas-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#FFFFFF;touch-action:none}
.canvas-wrap canvas{display:block;width:100%;height:auto}
.fig{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);max-width:560px}
.fig svg{display:block;width:100%;height:auto}
.wheel-wrap{position:relative;max-width:440px;margin:0 auto;width:100%}
.wheel-wrap canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--court-red)}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;text-align:left;width:100%}
.catlist div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.catlist b{font-family:var(--display);font-size:1.15rem;display:block}
.catlist small{color:var(--muted)}
.catlist .hit{box-shadow:0 0 0 3px var(--court-yellow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.done{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.part{display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--line);padding-top:18px}
.badge-time{display:inline-block;font-family:var(--display);font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.95rem;letter-spacing:.04em}
table.crit{width:100%;border-collapse:collapse;font-size:.95rem}
table.crit th,table.crit td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.crit th{font-family:var(--display);font-size:1.05rem}
table.crit select{padding:6px 8px;min-width:8.5em}
.tablewrap{overflow-x:auto}
.proto{display:grid;gap:10px}
.proto .card{display:grid;gap:8px}
.lock{max-width:420px;display:flex;flex-direction:column;gap:12px}
.menubtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:.95rem;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;margin-bottom:14px}
.menubtn:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
@media (max-width:560px){h1{font-size:2.1rem}.match{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const SPORTS=[];
SPORTS.push({id:'fb', name:'Fußball', bf:'BF 7 · Sportspiele', field:'fussball',
L:{
u:{t:'Fußball verstehen', s:[
['Das Spiel und seine Regeln','Beim Fußball spielen zwei Mannschaften mit je [elf|11] Spielerinnen und Spielern gegeneinander. Ziel ist es, den Ball ins gegnerische [Tor] zu schießen. Nur die Torhüter dürfen den Ball im eigenen [Strafraum] mit den Händen spielen. Ein Spiel dauert bei den Erwachsenen zweimal 45 Minuten. Geht der Ball über die Seitenlinie ins Aus, gibt es einen [Einwurf]. Dabei wird der Ball mit beiden Händen über den Kopf geworfen, und beide Füße bleiben auf dem Boden. Wer foult, kann vom Schiedsrichter eine gelbe oder rote [Karte] bekommen. Vor dem Spiel ist gutes Aufwärmen wichtig, damit man sich nicht verletzt.',
 [['Wer darf den Ball mit den Händen spielen – und wo?','Nur die Torhüterin bzw. der Torhüter, und zwar im eigenen Strafraum.'],['Beschreibe, wie ein Einwurf richtig ausgeführt wird.','Ball mit beiden Händen von hinten über den Kopf werfen; beide Füße bleiben auf dem Boden, auf oder hinter der Seitenlinie.']]],
['Passen und Schießen','Für kurze, genaue Pässe nutzt man den [Innenseitstoß]. Der Fuß wird dabei quer gestellt, sodass die breite Innenseite den Ball trifft. Für harte und weite Schüsse nimmt man den [Spannstoß]. Dabei ist die Fußspitze nach unten gestreckt, und der Ball wird mit dem Fußrücken getroffen. Wichtig ist das [Standbein]: Es steht neben dem Ball und zeigt in die Richtung, in die der Ball fliegen soll. Der Blick geht beim Schuss zum Ball. Beugt sich der Oberkörper leicht über den Ball, bleibt der Schuss flach. Lehnt man sich dagegen nach hinten, nennt man das [Rücklage] – der Ball steigt dann oft hoch über das Tor. Gute Spielerinnen und Spieler üben beide Füße, damit sie in jeder Situation passen können.',
 [['Wann nutzt man den Innenseitstoß, wann den Spannstoß?','Innenseitstoß für kurze, genaue Pässe; Spannstoß für harte und weite Schüsse.'],['Warum steigt der Ball bei Rücklage oft über das Tor?','Der Oberkörper ist nach hinten geneigt, der Ball wird unterhalb seiner Mitte getroffen und fliegt deshalb nach oben.']]],
['Der Körper beim Fußball','Beim Schießen arbeitet vor allem der große Muskel auf der Vorderseite des Oberschenkels. Er heißt [Quadrizeps] und streckt das Knie. Auf der Rückseite liegen die Muskeln, die das Knie beugen. Muskeln können nur ziehen, nicht drücken. Deshalb arbeiten immer zwei Muskeln als Gegenspieler zusammen. Profis laufen in einem Spiel rund 10 bis 12 Kilometer, oft im Wechsel zwischen Gehen, lockerem Laufen und schnellen [Sprints]. Dabei schlägt das Herz schneller, damit mehr Sauerstoff in die Muskeln kommt. Diesen Herzschlag kann man als [Puls] am Handgelenk oder am Hals fühlen. Weil der Körper beim Laufen schwitzt, ist [Trinken] vor, während und nach dem Spiel wichtig.',
 [['Welche Aufgabe hat der Quadrizeps beim Schuss?','Er streckt das Knie und bringt so Kraft in den Schuss.'],['Warum schlägt das Herz beim Fußballspielen schneller?','Die Muskeln brauchen mehr Sauerstoff; das Herz pumpt mehr Blut, um ihn zu transportieren.']]],
['Fair Play und Geschichte','Die ersten gemeinsamen Fußballregeln wurden 1863 in England aufgeschrieben, als sich dort der erste Fußballverband gründete. Heute wird Fußball auf der ganzen Welt gespielt. Frauenfußball war in Deutschland lange verboten: Erst [1970] hob der Deutsche Fußball-Bund das Verbot auf. Zum Fußball gehört [Fair Play]. Das bedeutet mehr, als nur Regeln einzuhalten. Fair ist zum Beispiel, wer einem gefoulten Gegner wieder aufhilft, wer ehrlich zugibt, dass er den Ball zuletzt berührt hat, oder wer den Ball ins Aus spielt, wenn jemand [verletzt] am Boden liegt. Nach dem Spiel gibt man sich die Hand. Auch der Umgang mit dem [Schiedsrichter] gehört dazu: Man respektiert seine Entscheidungen, selbst wenn man anderer Meinung ist.',
 [['Seit wann ist Frauenfußball in Deutschland offiziell erlaubt?','Seit 1970 – damals hob der Deutsche Fußball-Bund das Verbot auf.'],['Nenne zwei Beispiele für Fair Play, die über die Regeln hinausgehen.','Z. B. einem Gegner aufhelfen, den Ball bei einer Verletzung ins Aus spielen, ehrlich zugeben, wer den Ball zuletzt berührt hat.']]]
]},
m:{t:'Fußball: Technik, Taktik, Kondition', s:[
['Räume schaffen und nutzen','Im Fußball entscheidet nicht nur die Technik, sondern auch die [Taktik]. Die Mannschaft mit dem Ball macht das Spiel breit, damit die gegnerische Abwehr auseinandergezogen wird. Ein [Doppelpass] hilft, einen Gegenspieler zu überwinden: Man spielt ab, läuft sich frei und bekommt den Ball sofort zurück. Wichtig ist auch die Regel zum [Abseits]: Ein Angreifer steht im Abseits, wenn er sich im Moment der Ballabgabe in der gegnerischen Hälfte näher an der Torlinie befindet als der Ball und der vorletzte Gegenspieler. Strafbar ist das nur, wenn er aktiv ins Spiel eingreift. Wird der Ball erobert, beginnt sofort das [Umschaltspiel], bei dem schnell nach vorne gespielt wird, bevor sich der Gegner ordnen kann.',
 [['Warum macht eine Mannschaft im Ballbesitz das Spiel breit?','Die gegnerische Abwehr wird auseinandergezogen; dadurch entstehen Lücken für Pässe und Dribblings.'],['Wann ist eine Abseitsstellung strafbar?','Wenn der Spieler im Abseits aktiv ins Spiel eingreift, z. B. den Ball spielt oder einen Gegner behindert.']]],
['Der erste Kontakt: Ballannahme und -mitnahme','Ob ein Angriff gelingt, entscheidet sich oft schon beim ersten Kontakt. Bei der [Ballannahme] wird der Ball gestoppt; bei der Ballmitnahme wird er direkt in den freien Raum gelenkt. Damit das klappt, muss der Ball mit einer nachgebenden Bewegung empfangen werden. Physikalisch erklärt: Wird die Kontaktzeit verlängert, verringert sich die Kraft, die auf den Ball wirkt – er prallt weniger stark ab. Schon vor der Annahme schauen gute Spieler über die Schulter. Dieser [Schulterblick] liefert Informationen darüber, wo Gegner und freie Räume sind. So kann die Entscheidung für die nächste Aktion fallen, bevor der Ball ankommt. Die Sportwissenschaft spricht hier von [Informationsaufnahme]: Je früher und genauer man wahrnimmt, desto mehr Zeit bleibt für die Handlung.',
 [['Erkläre physikalisch, warum eine nachgebende Bewegung bei der Ballannahme hilft.','Die Kontaktzeit wird verlängert; dadurch wirkt eine geringere Kraft auf den Ball und er prallt weniger ab.'],['Welchen Vorteil bringt der Schulterblick?','Man nimmt Gegner und freie Räume schon vor der Ballannahme wahr und kann früher entscheiden.']]],
['Kondition und Verletzungsvorbeugung','Fußball ist eine [intermittierende] Belastung: Ruhige Phasen wechseln ständig mit kurzen, intensiven Aktionen wie Sprints, Sprüngen und Zweikämpfen. Eine gute Grundlagenausdauer sorgt dafür, dass man sich zwischen diesen Aktionen schnell erholt. Daneben braucht man [Schnelligkeit] und Schnellkraft für Antritte und Schüsse. Häufige Verletzungen im Fußball betreffen das Sprunggelenk, die Oberschenkelmuskulatur und das Kniegelenk, etwa das vordere Kreuzband. Studien zeigen, dass ein strukturiertes [Aufwärmprogramm] mit Lauf-, Kraft-, Sprung- und Gleichgewichtsübungen das Verletzungsrisiko deutlich senken kann. Ein bekanntes Beispiel ist das Programm „FIFA 11+“. Es trainiert unter anderem die Stabilität von Knie und Rumpf sowie das sichere [Landen] nach Sprüngen.',
 [['Was bedeutet intermittierende Belastung im Fußball?','Ruhige Phasen wechseln ständig mit kurzen, sehr intensiven Aktionen (Sprints, Sprünge, Zweikämpfe).'],['Wie kann man Verletzungen im Fußball vorbeugen?','Durch ein strukturiertes Aufwärmprogramm mit Lauf-, Kraft-, Sprung- und Gleichgewichtsübungen, z. B. „FIFA 11+“.']]],
['Spielsysteme und Deckungsarten','Die Grundordnung einer Mannschaft nennt man [Spielsystem]. Die Zahlen geben an, wie viele Feldspieler in Abwehr, Mittelfeld und Angriff stehen, zum Beispiel 4-4-2 oder 4-3-3. Früher spielten viele Mannschaften mit einem freien Mann hinter der Abwehr, dem Libero, und mit [Manndeckung]: Jeder Verteidiger hatte einen festen Gegenspieler. Heute verteidigen die meisten Teams in [Raumdeckung]: Jeder ist für einen Bereich des Feldes verantwortlich und übernimmt die Gegner, die dort hineinkommen. Beim [Pressing] greift die Mannschaft den ballführenden Gegner früh und gemeinsam an, um den Ball weit vorne zu erobern. Gegenpressing bedeutet, direkt nach einem Ballverlust sofort Druck zu machen. Kein System ist an sich besser – entscheidend ist, ob es zu den Fähigkeiten der Spieler passt.',
 [['Was gibt die Bezeichnung 4-3-3 an?','Vier Abwehrspieler, drei Mittelfeldspieler, drei Angreifer (Feldspieler ohne Torwart).'],['Unterscheide Mann- und Raumdeckung.','Manndeckung: jeder hat einen festen Gegenspieler. Raumdeckung: jeder ist für einen Bereich verantwortlich und übernimmt Gegner dort.']]]
]},
o:{t:'Fußball als Gegenstand der Sportwissenschaft', s:[
['Fairness und Aggression','Die Sportwissenschaft unterscheidet zwischen [formeller] Fairness, also dem Einhalten der geschriebenen Regeln, und [informeller] Fairness, die Respekt vor dem Gegner und Chancengleichheit über die Regeln hinaus meint – etwa, wenn eine Mannschaft den Ball ins Aus spielt, damit ein verletzter Gegner behandelt werden kann. Um aggressives Verhalten zu erklären, gibt es verschiedene Ansätze. Die [Frustrations-Aggressions-Hypothese] (Dollard u. a., 1939) geht davon aus, dass Aggression die Folge einer Frustration ist, zum Beispiel nach einer Fehlentscheidung. Die sozial-kognitive [Lerntheorie] nach Bandura erklärt Aggression als erlerntes Verhalten: Wer beobachtet, dass ein Vorbild mit einem Foul Erfolg hat und nicht bestraft wird, ahmt dieses Verhalten eher nach. Triebtheoretische Ansätze (z. B. Lorenz) gehen von einem angeborenen Aggressionstrieb aus; sie gelten heute als wissenschaftlich umstritten.',
 [['Unterscheide formelle und informelle Fairness an je einem Beispiel aus dem Fußball.','Formell: Regeln einhalten (z. B. kein Handspiel). Informell: Respekt und Chancengleichheit über die Regeln hinaus (z. B. Ball ins Aus spielen, wenn ein Gegner verletzt ist).'],['Erläutere, wie aggressives Verhalten nach Bandura gelernt werden kann.','Durch Modelllernen: Wer sieht, dass ein Vorbild mit einem taktischen Foul Erfolg hat und nicht bestraft wird, übernimmt das Verhalten eher.']]],
['Spielvermittlungsmodelle','Wie lernt man ein Sportspiel am besten? Die [Zergliederungsmethode] geht technikorientiert vor: Erst werden einzelne Techniken isoliert geübt, dann zu komplexeren Handlungen zusammengesetzt und schließlich im Spiel angewendet. Kritiker bemängeln, dass Lernende dabei lange nicht verstehen, wozu eine Technik im Spiel dient. Das Konzept [Teaching Games for Understanding] (Bunker und Thorpe, 1982) dreht die Reihenfolge um: Am Anfang stehen vereinfachte Spielformen, aus denen taktische Probleme entstehen; die Technik wird erst geübt, wenn ihr Nutzen erkannt ist. Die Heidelberger [Ballschule] setzt noch früher an und fördert sportspielübergreifende taktische, koordinative und technische Basiskompetenzen, bevor sich Kinder auf eine Sportart spezialisieren. In der Praxis werden häufig [Spielreihen] genutzt, in denen die Komplexität vom Kleinfeldspiel bis zum Zielspiel schrittweise steigt.',
 [['Vergleiche die Zergliederungsmethode mit Teaching Games for Understanding.','Zergliederung: erst isolierte Technik, dann Spiel (technikorientiert). TGfU: erst vereinfachtes Spiel und taktisches Verständnis, Technik nach Bedarf (spiel- und verständnisorientiert).'],['Welches Ziel verfolgt die Heidelberger Ballschule?','Sportspielübergreifende taktische, koordinative und technische Basiskompetenzen vor einer frühen Spezialisierung.']]],
['Leistungsstruktur und Belastung','Die Leistung im Fußball ist komplex: Sie setzt sich aus technischen, taktischen, konditionellen und psychischen Faktoren zusammen. Spielanalysen zeigen, dass Feldspieler im Profibereich in einem Spiel etwa 10 bis 13 Kilometer zurücklegen, davon jedoch nur einen kleinen Teil im Sprint. Die Energie wird überwiegend [aerob] bereitgestellt; die spielentscheidenden Aktionen – Antritte, Sprünge, Schüsse – sind dagegen anaerob. Eine hohe maximale Sauerstoffaufnahme ([VO2max]) beschleunigt die Erholung zwischen intensiven Phasen. Trainingswissenschaftlich lässt sich das über das Modell der [Superkompensation] erklären: Nach einer Belastung sinkt die Leistungsfähigkeit zunächst, steigt in der Erholung über das Ausgangsniveau und fällt ohne neuen Reiz wieder ab. Der nächste Reiz sollte deshalb in der Phase der erhöhten Leistungsfähigkeit gesetzt werden.',
 [['Erläutere, warum sowohl aerobe als auch anaerobe Energiebereitstellung im Fußball wichtig ist.','Der Großteil der Laufleistung ist aerob; die spielentscheidenden kurzen Aktionen sind anaerob. Gute aerobe Kapazität beschleunigt die Erholung zwischen diesen Aktionen.'],['Erläutere das Modell der Superkompensation.','Belastung → Ermüdung → Erholung über das Ausgangsniveau (Superkompensation) → Rückfall ohne neuen Reiz; neuer Reiz idealerweise in der Phase erhöhter Leistungsfähigkeit.']]],
['Steuerung und Manipulation','Profifußball ist ein Wirtschaftszweig. Fernsehgelder, Sponsoring und Transfers prägen den Sport und beeinflussen sogar Anstoßzeiten und Spielpläne. In Deutschland soll die [50+1-Regel] verhindern, dass Investoren die Mehrheit der Stimmrechte an einem Profiklub übernehmen; der Verein muss die Kontrolle behalten. Eine schwere Form der Manipulation ist der [Wettbetrug], bei dem Spielergebnisse gezielt beeinflusst werden. In Deutschland wurde 2005 ein Fall bekannt, in dem ein Schiedsrichter Spiele manipuliert hatte. Um Fehlentscheidungen zu verringern, wird seit der Saison 2017/18 in der Bundesliga der [Videoassistent] eingesetzt. Er erhöht die Gerechtigkeit einzelner Entscheidungen, wird aber auch kritisiert, weil er den Spielfluss unterbricht und Emotionen beim Torjubel dämpft.',
 [['Erläutere Ziel und Bedeutung der 50+1-Regel.','Der Verein behält die Stimmenmehrheit, Investoren können keine Kontrolle übernehmen; Schutz der Mitbestimmung der Mitglieder gegenüber Kommerzinteressen.'],['Beurteile den Einsatz des Videoassistenten.','Pro: weniger klare Fehlentscheidungen, mehr Gerechtigkeit. Contra: Unterbrechungen, gedämpfte Emotionen, weiterhin Ermessensspielraum. Eigenes begründetes Urteil.']]]
]}

L:{
u:{t:'Basketball verstehen', s:[
['Punkte im hohen Korb','Basketball wurde 1891 von dem Sportlehrer James Naismith in den USA erfunden. Er suchte ein Spiel, das seine Schüler im Winter in der Halle spielen konnten. Eine Mannschaft hat [fünf|5] Spielerinnen und Spieler auf dem Feld. Der Korb hängt in 3,05 Metern Höhe. Wer sich mit dem Ball fortbewegt, muss ihn auf den Boden prellen. Das nennt man [Dribbeln|Dribbling]. Wer mit dem Ball in den Händen zu viele Schritte macht, begeht einen [Schrittfehler]. Ein Korb aus dem Spiel zählt zwei Punkte, ein Wurf von hinter der Dreierlinie zählt [drei|3] Punkte. Ein [Freiwurf] nach einem Foul zählt einen Punkt.',
 [['Wer hat Basketball erfunden und warum?','James Naismith, 1891 in den USA; er suchte ein Spiel, das man im Winter in der Halle spielen konnte.'],['Wie viele Punkte gibt es für einen Korb aus dem Spiel, von hinter der Dreierlinie und für einen Freiwurf?','2 Punkte, 3 Punkte und 1 Punkt.']]],
['Dribbeln wie die Profis','Beim Dribbeln wird der Ball nicht mit der flachen Hand geschlagen, sondern mit den [Fingerkuppen] gedrückt. Der Ball sollte ungefähr auf [Hüfthöhe] zurückspringen, dann kann man ihn gut kontrollieren. Ganz wichtig: Der Blick geht nach vorne und nicht auf den Ball. So sieht man Mitspieler, Gegner und den Korb. Wer gegen einen Verteidiger dribbelt, schützt den Ball mit dem eigenen Körper und dem freien Arm. Die Hand, die nicht dribbelt, nennt man deshalb auch [Schutzarm]. Mit einem Handwechsel vor dem Körper, dem Crossover, kann man die Richtung blitzschnell ändern. Gute Spieler dribbeln mit [beiden] Händen gleich sicher, weil der Verteidiger sonst weiß, in welche Richtung sie laufen wollen.',
 [['Warum soll man beim Dribbeln nicht auf den Ball schauen?','Damit man Mitspieler, Gegner und Korb sieht und gute Entscheidungen treffen kann.'],['Wozu dient der Schutzarm?','Er schützt den Ball vor dem Verteidiger, ohne ihn wegzustoßen.']]],
['Werfen und Treffen','Für einen guten Wurf hilft ein Merkwort aus dem Englischen: BEEF. Das B steht für Balance: Die Füße stehen schulterbreit und der Körper ist stabil. Das erste E steht für Eyes: Die [Augen] schauen auf den Korb, nicht auf den Ball. Das zweite E steht für Elbow: Der [Ellbogen] des Wurfarms zeigt nach vorne zum Korb und nicht zur Seite. Das F steht für Follow-through: Nach dem Wurf klappt das Handgelenk ab, als würde man in eine Keksdose greifen. Der Ball verlässt die Hand über die Fingerspitzen und bekommt so eine [Rückwärtsdrehung]. Ein hoher [Bogen] ist besser als ein flacher Wurf, weil der Ball dann steiler von oben in den Korb fällt.',
 [['Wofür stehen die Buchstaben BEEF?','Balance, Eyes (Augen zum Korb), Elbow (Ellbogen zeigt zum Korb), Follow-through (Handgelenk klappt ab).'],['Warum ist ein hoher Wurfbogen günstig?','Der Ball fällt steiler von oben in den Korb und hat mehr Platz im Ring.']]],
['Fair im Team','Naismith wollte ein Spiel ohne harte Zweikämpfe erfinden. Deshalb ist Basketball eigentlich ein Spiel, in dem [Körperkontakt] möglichst vermieden werden soll. Wer einen Gegner stößt, hält oder ihm auf die Arme schlägt, begeht ein [Foul]. Nach fünf persönlichen Fouls muss man das Spiel verlassen. Weil der Korb so hoch hängt und die Verteidigung ihn eng schützt, gelingt im Basketball fast nichts allein: Gute Pässe sind wichtiger als lange Dribblings. Man unterscheidet den [Brustpass], den Bodenpass und den Überkopfpass. Beim Bodenpass tippt der Ball etwa zwei Drittel des Weges vor dem Mitspieler auf. Im Rollstuhlbasketball wird Basketball auch von Menschen mit [Behinderung] gespielt – sogar bei den Paralympics.',
 [['Warum soll Körperkontakt im Basketball vermieden werden?','Naismith wollte ein Spiel ohne harte Zweikämpfe; Stoßen, Halten oder Schlagen sind Fouls.'],['Nenne drei Passarten.','Brustpass, Bodenpass, Überkopfpass.']]]
]},
m:{t:'Basketball: Technik und Spielhandlungen', s:[
['Der Korbleger','Der Korbleger ist der sicherste Wurf im Basketball, weil er direkt am Korb ausgeführt wird. Rechtshänder dribbeln mit der rechten Hand auf den Korb zu und nehmen den Ball mit beiden Händen auf. Danach folgt der [Zweierrhythmus]: ein großer Schritt mit dem rechten Fuß, ein kürzerer Schritt mit dem [linken] Fuß. Vom linken Fuß springt man hoch ab, das rechte [Knie] wird dabei nach oben gezogen. Der Ball wird mit der rechten Hand nach oben geführt und gegen das [Brett] gelegt, am besten in die obere Ecke des kleinen Rechtecks. Linkshänder machen alles seitenverkehrt. Typische Fehler sind zu viele Schritte, ein Absprung vom falschen Fuß oder ein zu kräftiger Wurf.',
 [['Beschreibe den Zweierrhythmus beim Korbleger eines Rechtshänders.','Ballaufnahme, großer Schritt rechts, kürzerer Schritt links, Absprung vom linken Fuß, rechtes Knie hoch, Ball mit rechts ans Brett legen.'],['Nenne zwei typische Fehler beim Korbleger.','Zu viele Schritte, Absprung vom falschen Fuß, Ball zu kräftig ans Brett gespielt.']]],
['Zusammenspiel: Give and Go und Pick and Roll','Im Angriff entstehen freie Würfe vor allem durch Zusammenspiel. Beim [Give and Go] passt ein Spieler ab und schneidet sofort zum Korb, um den Ball zurückzubekommen. Beim [Pick and Roll] stellt ein Mitspieler einen Block: Er stellt sich regelgerecht und ruhig neben den Verteidiger des Ballführers. Der Ballführer dribbelt eng am Block vorbei, der Verteidiger bleibt hängen. Der Blocksteller dreht sich anschließend zum Korb ab („rollt“) und kann angespielt werden. Wichtig ist der Abstand der Angreifer zueinander, das sogenannte [Spacing]: Stehen alle zu eng, kann ein Verteidiger zwei Gegenspieler gleichzeitig stören. Ein Block ist nur erlaubt, wenn der Blocksteller steht und sich nicht in den Gegner hineinbewegt – sonst ist es ein [Offensivfoul].',
 [['Beschreibe den Ablauf eines Pick and Roll.','Mitspieler stellt Block am Verteidiger des Ballführers, Ballführer dribbelt eng daran vorbei, Blocksteller rollt zum Korb ab und wird ggf. angespielt.'],['Warum ist gutes Spacing wichtig?','Bei zu engem Stand kann ein Verteidiger zwei Angreifer gleichzeitig decken; Abstand schafft Platz für Pässe und Wege zum Korb.']]],
['Verteidigung und Rebound','In der Verteidigungsstellung stehen die Füße etwas weiter als schulterbreit, die Knie sind gebeugt und der [Körperschwerpunkt] ist tief. So kann man schnell in jede Richtung reagieren. Bewegt wird sich mit [Nachstellschritten], ohne die Füße zu überkreuzen. Der Verteidiger steht immer zwischen seinem Gegenspieler und dem eigenen Korb. Man unterscheidet die Mann-gegen-Mann-Verteidigung und die [Zonenverteidigung], bei der jeder einen Raum verteidigt. Nach einem Wurf versuchen beide Teams, den abprallenden Ball zu sichern. Dazu dreht sich der Verteidiger zu seinem Gegenspieler und schiebt ihn mit dem Rücken vom Korb weg. Dieses [Ausblocken] (Box-out) ist oft wichtiger als hohes Springen.',
 [['Beschreibe die Verteidigungsstellung.','Füße etwas weiter als schulterbreit, Knie gebeugt, Schwerpunkt tief, Arme aktiv; Bewegung mit Nachstellschritten.'],['Was versteht man unter Ausblocken?','Nach dem Wurf dreht man sich zum Gegenspieler und schiebt ihn mit dem Rücken vom Korb weg, um den Rebound zu sichern.']]],
['Zeitregeln im Detail','Basketball hat mehrere Zeitregeln, die das Spiel schnell machen. Nach FIBA-Regeln hat die angreifende Mannschaft [24] Sekunden Zeit für einen Wurf, der den Ring berührt. Innerhalb von [8] Sekunden muss der Ball aus der eigenen Hälfte, dem Rückfeld, ins Vorfeld gebracht werden. Danach darf er nicht mehr ins Rückfeld zurückgespielt werden; das wäre ein [Rückspiel]. Ein Angreifer darf sich höchstens drei Sekunden ununterbrochen in der gegnerischen Zone aufhalten. Ein eng gedeckter Spieler, der den Ball hält, muss ihn innerhalb von fünf Sekunden abspielen, werfen oder dribbeln. Für die Schrittregel gilt: Nach der Ballaufnahme dürfen zwei Schritte gemacht werden, dann muss der Ball abgespielt oder geworfen werden. Die Dreipunktelinie ist bei FIBA 6,75 Meter vom Korb entfernt.',
 [['Nenne vier Zeitregeln im Basketball.','24 Sekunden für einen Wurf, 8 Sekunden ins Vorfeld, 3 Sekunden in der Zone, 5 Sekunden bei enger Deckung.'],['Was ist ein Rückspiel?','Der Ball wird nach dem Erreichen des Vorfelds von der angreifenden Mannschaft wieder ins Rückfeld gespielt.']]]
]},
o:{t:'Basketball aus Sicht der Sportwissenschaft', s:[
['Phasenstruktur und Biomechanik des Sprungwurfs','Sportliche Bewegungen lassen sich nach Meinel und Schnabel in Phasen gliedern. Beim Sprungwurf schafft die [Vorbereitungsphase] günstige Bedingungen: Der Spieler beugt Sprung-, Knie- und Hüftgelenke und führt den Ball vor die Stirn. In der [Hauptphase] strecken sich die Beine explosiv, am höchsten Punkt des Sprungs streckt sich der Wurfarm und das Handgelenk klappt ab. Die [Endphase] umfasst die Landung und den Übergang in die nächste Aktion. Das Prinzip der [Anfangskraft] erklärt, warum die Ausholbewegung sinnvoll ist: Eine Gegenbewegung vor der eigentlichen Bewegung ermöglicht einen größeren Kraftstoß. Das Prinzip der Koordination der [Teilimpulse] besagt, dass die Teilbewegungen zeitlich optimal aufeinander abgestimmt sein müssen – von den großen Muskelgruppen der Beine bis zur Hand.',
 [['Gliedere den Sprungwurf in seine drei Phasen und beschreibe sie.','Vorbereitungsphase (Beugen, Ball vor die Stirn), Hauptphase (Streckung, Armstreckung, Abklappen des Handgelenks), Endphase (Landung, Übergang).'],['Erläutere das Prinzip der Koordination der Teilimpulse.','Die Teilbewegungen von Beinen, Rumpf, Arm und Hand müssen zeitlich optimal aufeinanderfolgen, damit sich die Teilimpulse addieren.']]],
['Informationsverarbeitung und Täuschung','Basketballspieler müssen unter Zeitdruck zwischen vielen Handlungsalternativen wählen: werfen, passen oder dribbeln. Nach dem [Hick-Hyman-Gesetz] steigt die Wahlreaktionszeit mit der Anzahl der möglichen Alternativen an, und zwar logarithmisch. Erfahrene Spieler verringern diese Unsicherheit durch [Antizipation]: Sie erkennen typische Muster früher und schränken die wahrscheinlichen Optionen ein. Täuschungen nutzen eine Grenze der Informationsverarbeitung aus, die [psychologische Refraktärperiode]: Reagiert der Verteidiger auf die Finte, verzögert sich seine Reaktion auf die unmittelbar folgende eigentliche Aktion. Eine Wurf- oder Passfinte ist deshalb besonders wirksam, wenn der zeitliche Abstand zur Hauptaktion kurz ist und die Finte [realistisch] aussieht.',
 [['Erläutere das Hick-Hyman-Gesetz am Beispiel Basketball.','Je mehr Handlungsalternativen ein Spieler hat, desto länger dauert die Entscheidung (logarithmischer Anstieg der Wahlreaktionszeit).'],['Erkläre, warum Finten mit der psychologischen Refraktärperiode funktionieren.','Die Reaktion auf die Finte belegt die Verarbeitung; die Reaktion auf die direkt folgende echte Aktion wird verzögert.']]],
['Sprungkraft trainieren','Sprungkraft ist eine Form der [Schnellkraft]: die Fähigkeit, in kurzer Zeit einen möglichst großen Kraftstoß zu erzeugen. Bei vielen Sprüngen tritt ein [Dehnungs-Verkürzungs-Zyklus] auf: Der Muskel wird zunächst unter Spannung gedehnt (exzentrisch) und verkürzt sich unmittelbar danach (konzentrisch). Dabei wird elastische Energie aus Sehnen und Muskeln genutzt und die neuronale Ansteuerung verstärkt. Dieses Zusammenspiel heißt Reaktivkraft und wird durch [plyometrisches] Training, etwa Niedersprünge oder Sprungserien, verbessert. Weil die Qualität jeder Wiederholung entscheidend ist, gelten geringe Umfänge, maximale Intensität und [vollständige] Pausen. Sprungtraining belastet Sehnen und Gelenke stark; es setzt daher eine ausreichende Grundkraft und saubere Landetechnik voraus.',
 [['Was versteht man unter dem Dehnungs-Verkürzungs-Zyklus?','Exzentrische Dehnung unter Spannung, unmittelbar gefolgt von konzentrischer Verkürzung; elastische Energie und verstärkte neuronale Ansteuerung erhöhen den Kraftstoß.'],['Begründe die Belastungsgestaltung beim Sprungkrafttraining.','Geringer Umfang, maximale Intensität und vollständige Pausen, weil Qualität und Schnelligkeit jeder Wiederholung entscheidend sind und Ermüdung den Reiz verfälscht.']]],
['Basketball und Gesellschaft','Basketball entstand als Schulsport und entwickelte sich zu einem globalen Wirtschaftsfaktor. Die nordamerikanische Profiliga NBA vermarktet Spieler als weltweite Marken; Sportartikelhersteller, Medienverträge und soziale Netzwerke verstärken diese Wirkung. Zugleich ist Basketball eine niedrigschwellige Straßensportart: Ein Korb und ein Ball genügen. Die Variante [3x3] ist seit den Spielen von Tokio (ausgetragen 2021) olympisch. [Rollstuhlbasketball] gehört seit 1960 zu den Paralympischen Spielen und gilt als Beispiel für [Inklusion] im Sport. Kritisch diskutiert wird, dass mediale Vorbilder Jugendliche zu einseitigen Karriereträumen verleiten können, während die Chance auf eine Profilaufbahn sehr gering ist.',
 [['Erläutere, warum Basketball als niedrigschwellige Sportart gilt.','Ein Korb und ein Ball reichen; die Straßenvariante (Streetball/3x3) kann überall und in kleinen Gruppen gespielt werden.'],['Beurteile den Einfluss medialer Vorbilder auf Jugendliche.','Pro: Motivation, Vorbildfunktion. Contra: einseitige Karriereträume, Kommerzialisierung, unrealistische Erwartungen. Eigenes begründetes Urteil.']]]
]}
},

fe:[{t:'Korbleger',pose:'layupWrongFoot',obs:'Ein Rechtshänder läuft zum Korbleger an. Kurz vor dem Korb springt er ab; der Wurf wirkt verkrampft und geht oft daneben. In der Grafik ist das Absprungbein dunkel, das angehobene Knie hell gezeichnet.',sol:['Absprung vom rechten statt vom linken Fuß; das rechte Knie kann nicht nach oben gezogen werden.','Der Zweierrhythmus ist nicht automatisiert; oft beginnt der Rhythmus mit dem falschen Fuß nach der Ballaufnahme.','Rhythmus ohne Ball laut mitsprechen („rechts – links – hoch“), mit Markierungen am Boden üben, dann mit einem Dribbling kombinieren.']},

SPORTS.push({id:'hb', name:'Handball', bf:'BF 7 · Sportspiele', field:'hand',
L:{
u:{t:'Handball verstehen', s:[
['Das Spiel und seine Regeln','Beim Handball spielen zwei Mannschaften mit je sechs Feldspielerinnen und Feldspielern und einer Person im [Tor] gegeneinander. Mit dem Ball in der Hand darf man höchstens [drei|3] Schritte machen. Außerdem darf man den Ball höchstens drei [Sekunden] festhalten. Den [Torraum], der durch die 6-Meter-Linie begrenzt wird, darf nur die Torhüterin oder der Torhüter betreten. Wird eine klare Torchance regelwidrig verhindert, gibt es einen [Siebenmeter|7-Meter|7m]. Für grobes oder wiederholtes Foulspiel gibt es eine Zeitstrafe von zwei Minuten. Ein Spiel dauert bei den Erwachsenen zweimal 30 Minuten.',
 [['Nenne die Schritt- und die Zeitregel.','Höchstens drei Schritte und höchstens drei Sekunden mit dem Ball in der Hand.'],['Wann gibt es einen Siebenmeter?','Wenn eine klare Torchance regelwidrig verhindert wird.']]],
['Fangen und Werfen','Beim Fangen bilden die Hände eine Art [Trichter]: Daumen und Zeigefinger beider Hände formen ein Dreieck, die Finger sind locker gespreizt. Die Arme strecken sich dem Ball entgegen und geben beim Fangen nach, so wird der Ball weich abgebremst. Der wichtigste Wurf ist der [Schlagwurf]. Ein Rechtshänder steht dabei mit dem linken Fuß vorne; dieser Schritt heißt [Stemmschritt], weil er den Anlauf abbremst und die Kraft auf den Oberkörper überträgt. Der Wurfarm ist weit zurückgeführt, der [Ellbogen] befindet sich mindestens auf Schulterhöhe. Der Ball wird über dem Kopf nach vorne geschlagen, und der Oberkörper dreht sich mit.',
 [['Wie sollen die Hände beim Fangen aussehen?','Trichter: Daumen und Zeigefinger bilden ein Dreieck, Finger locker gespreizt, Arme geben beim Fangen nach.'],['Welcher Fuß steht beim Schlagwurf eines Rechtshänders vorne, und warum?','Der linke; der Stemmschritt bremst den Anlauf und überträgt die Kraft auf den Oberkörper.']]],
['Die Torhüterin','Die Torhüterin hat eine besondere Rolle. In ihrer [Grundstellung] steht sie leicht gebeugt, die Arme sind seitlich nach oben gestreckt, der Blick ist auf den Ball gerichtet. Im eigenen Torraum darf sie den Ball mit dem ganzen Körper abwehren, auch mit den [Füßen]. Hat sie den Ball gefangen oder ist er über die Torauslinie gegangen, setzt sie das Spiel mit einem [Abwurf] fort. Gute Torhüterinnen beobachten den Werfer genau: Wohin zeigt der Wurfarm? Wohin schaut er? So können sie ahnen, wohin der Ball fliegt. Außerdem sind Torhüterinnen wichtig für schnelle Angriffe, denn sie können den Ball nach einer Parade mit einem langen [Pass] direkt nach vorne spielen.',
 [['Was darf die Torhüterin im eigenen Torraum, was Feldspieler nicht dürfen?','Den Ball mit dem ganzen Körper abwehren, auch mit den Füßen.'],['Wie kann eine Torhüterin erkennen, wohin geworfen wird?','Sie beobachtet den Werfer genau, z. B. Wurfarm und Blickrichtung.']]],
['Geschichte des Handballs','Handball wurde Anfang des 20. Jahrhunderts in Deutschland und Skandinavien entwickelt. Zuerst spielte man draußen auf großen Rasenplätzen mit elf Spielern. Diese Form hieß [Feldhandball]. Mit der Zeit setzte sich das schnellere Spiel in der [Halle] mit sieben Spielern durch. Deutschland gehört zu den erfolgreichsten Handballnationen: Die Männer wurden 1978 und 2007 [Weltmeister], 2007 sogar im eigenen Land. Die Handball-Bundesliga gilt als eine der stärksten Ligen der Welt. Auch im Rollstuhl und am Strand wird Handball gespielt. Beim [Beachhandball] spielt man barfuß im Sand, und besonders spektakuläre Tore zählen doppelt.',
 [['Was war Feldhandball?','Die frühere Form des Handballs, draußen auf großen Rasenplätzen mit elf Spielern.'],['Wann wurde die deutsche Männer-Nationalmannschaft Weltmeister?','1978 und 2007.']]]
]},
m:{t:'Handball: Technik und Taktik', s:[
['Positionen, Abwehr und Gegenstoß','Im Angriff gibt es feste Positionen: zwei Außenspieler, drei Spieler im [Rückraum] und einen [Kreisläufer], der sich zwischen den Abwehrspielern am Torraum bewegt und mit Sperren Lücken für die Mitspieler schafft. Die Abwehr stellt sich häufig in einer 6:0-Formation auf: Alle sechs Feldspieler stehen nebeneinander vor dem eigenen Torraum. Bei der 5:1-[Abwehr] rückt ein Spieler vor und stört den Spielaufbau. Erobert eine Mannschaft den Ball, startet sie möglichst schnell einen [Gegenstoß]. Dabei laufen die schnellsten Spieler sofort Richtung gegnerisches Tor, bevor die gegnerische Abwehr zurück ist.',
 [['Welche Aufgabe hat der Kreisläufer?','Er bewegt sich am gegnerischen Torraum zwischen den Abwehrspielern, stellt Sperren und schafft Lücken; er kann selbst angespielt werden.'],['Unterscheide die 6:0- und die 5:1-Abwehr.','6:0: alle sechs nebeneinander vor dem Torraum. 5:1: ein Spieler rückt vor und stört den Aufbau.']]],
['Der Sprungwurf','Der Sprungwurf ist die häufigste Wurfform im Rückraum. Er ermöglicht es, über die Abwehr hinweg zu werfen. Ein Rechtshänder läuft im [Dreierrhythmus] an und springt vom [linken] Bein ab. Das rechte Knie wird nach oben gezogen, der Wurfarm ist weit zurückgeführt. Der Ball wird möglichst im [höchsten] Punkt des Sprungs abgeworfen. Der Oberkörper dreht sich beim Wurf nach vorne, wodurch zusätzliche Geschwindigkeit entsteht. Gelandet wird auf dem Absprungbein oder beidbeinig, möglichst weich in den Knien. Wer im Sprung den Torraum betritt, darf noch werfen, solange der Absprung außerhalb des Torraums erfolgte. Die Landung im Torraum ist dann erlaubt, wenn sich der Werfer dadurch keinen [Vorteil] verschafft.',
 [['Warum ist der Sprungwurf im Rückraum wichtig?','Man kann über die Abwehr hinweg werfen.'],['Wann darf ein Spieler beim Sprungwurf im Torraum landen?','Wenn der Absprung außerhalb des Torraums erfolgte, der Ball vor der Landung abgeworfen ist und er sich keinen Vorteil verschafft.']]],
['Abwehrverhalten und Strafen','In der Abwehr ist Körperkontakt erlaubt, wenn er von [vorne] und mit dem Rumpf erfolgt. Der Abwehrspieler darf den Angreifer mit angewinkelten Armen blockieren, ihn aber nicht halten, stoßen, umklammern oder von hinten angreifen. Gute Abwehrspieler treten heraus, wenn der Angreifer mit Ball auf sie zukommt, und ziehen sich wieder zurück, wenn der Ball weitergespielt wird. Bei Regelverstößen steigen die Strafen schrittweise: zuerst die [Verwarnung] mit der Gelben Karte, dann die [Zeitstrafe] von zwei Minuten und bei der dritten Zeitstrafe die Disqualifikation. Besonders gefährliche Aktionen, etwa ein Schlag gegen den Kopf, können sofort zur [Disqualifikation] führen.',
 [['Welcher Körperkontakt ist in der Abwehr erlaubt?','Kontakt von vorne mit dem Rumpf und angewinkelten Armen; nicht halten, stoßen, umklammern oder von hinten angreifen.'],['Beschreibe die Abfolge der persönlichen Strafen.','Verwarnung (Gelbe Karte), Zeitstrafe (2 Minuten), bei der dritten Zeitstrafe Disqualifikation; grobe Aktionen sofort Disqualifikation.']]],
['Passives Spiel und besondere Spielzüge','Damit Handball attraktiv bleibt, darf eine Mannschaft den Ball nicht endlos halten, ohne ernsthaft auf das Tor zu spielen. Erkennen die Schiedsrichter dieses [passive Spiel], heben sie den Arm als Vorwarnzeichen. Danach bleibt der angreifenden Mannschaft nur noch eine begrenzte Zahl an Pässen bis zum Torwurf. Ein bekannter Spielzug ist der [Kempa-Trick]: Ein Spieler wirft den Ball in den Torraum, ein Mitspieler fängt ihn im Sprung und wirft noch in der Luft aufs Tor. Häufig nimmt eine Mannschaft auch die Torhüterin vom Feld und spielt mit einem siebten [Feldspieler]. So entsteht im Angriff Überzahl, allerdings bleibt das eigene Tor leer und ist bei einem Ballverlust leicht zu treffen.',
 [['Was passiert beim Vorwarnzeichen für passives Spiel?','Der Schiedsrichter hebt den Arm; danach bleibt nur noch eine begrenzte Zahl an Pässen bis zum Torwurf.'],['Nenne Vor- und Nachteil des siebten Feldspielers.','Vorteil: Überzahl im Angriff. Nachteil: leeres Tor bei Ballverlust.']]]
]},
o:{t:'Handball aus Sicht der Sportwissenschaft', s:[
['Leistung unter Druck: der Siebenmeter','Beim Siebenmeter steht der Werfer allein vor dem Torhüter. Technisch ist der Wurf nicht schwer, trotzdem werden viele Würfe vergeben. Ein Grund ist die [Aktivierung] des Werfers. Das Yerkes-Dodson-Gesetz (1908) beschreibt den Zusammenhang zwischen Aktivierung und Leistung als umgekehrtes U: Bei zu niedriger und zu hoher Aktivierung sinkt die Leistung, ein [mittleres] Aktivierungsniveau ist optimal. Bei komplexen, feinmotorischen Aufgaben liegt das Optimum eher niedriger. Ob eine Situation als Herausforderung oder Bedrohung erlebt wird, hängt von der persönlichen [Bewertung] ab. Erfolgreiche Werfer nutzen deshalb eine feste [Routine] vor dem Wurf, zum Beispiel immer gleiches Ballprellen, bewusstes Ausatmen und ein klares Zielbild.',
 [['Erläutere das Yerkes-Dodson-Gesetz am Beispiel des Siebenmeters.','Leistung und Aktivierung bilden ein umgekehrtes U; zu geringe und zu hohe Aktivierung senken die Trefferquote, ein mittleres Niveau ist optimal.'],['Erläutere die Funktion einer Pre-Performance-Routine.','Sie stabilisiert die Aktivierung, lenkt die Aufmerksamkeit auf die Aufgabe und schafft ein Gefühl von Kontrolle.']]],
['Biomechanik des Schlagwurfs','Im Spitzenbereich erreichen Würfe Geschwindigkeiten von über 100 Kilometern pro Stunde. Möglich wird das durch eine [proximal-distale] Abfolge: Die Bewegung beginnt mit dem Stemmschritt und der Hüfte, setzt sich über Rumpf und Schulter fort und endet mit Unterarm und Hand. Jedes Segment wird beschleunigt und abgebremst, wodurch der Impuls an das nächste, leichtere Segment weitergegeben wird – ähnlich einem [Peitschenschlag]. Nach dem Prinzip des optimalen [Beschleunigungsweges] sollte der Weg, auf dem der Ball beschleunigt wird, lang und geradlinig sein; deshalb wird der Wurfarm weit zurückgeführt. Der Stemmschritt wandelt die horizontale Anlaufgeschwindigkeit in eine Rotation des Oberkörpers um und ist damit Grundlage der [Rumpfrotation].',
 [['Erläutere die proximal-distale Abfolge beim Schlagwurf.','Die Bewegung beginnt rumpfnah (Hüfte, Rumpf) und setzt sich zu den rumpffernen Segmenten (Schulter, Unterarm, Hand) fort; der Impuls wird von Segment zu Segment weitergegeben.'],['Begründe mit einem biomechanischen Prinzip, warum der Wurfarm weit zurückgeführt wird.','Prinzip des optimalen Beschleunigungsweges: ein langer, geradliniger Beschleunigungsweg erhöht die Abwurfgeschwindigkeit.']]],
['Verletzungsprophylaxe','Handball zählt zu den verletzungsreichen Sportarten. Besonders betroffen sind das Sprunggelenk, das Kniegelenk mit dem [vorderen Kreuzband] und die Schulter. Kreuzbandverletzungen entstehen häufig ohne Gegnerkontakt, etwa bei Landungen oder abrupten Richtungswechseln, wenn das Knie nach innen knickt. Bei Würfen wird die [Rotatorenmanschette] der Schulter stark beansprucht, vor allem beim Abbremsen des Wurfarms. Präventionsprogramme setzen deshalb auf [neuromuskuläres] Training: Gleichgewichts- und Stabilisationsübungen, Sprung- und Landeschulung sowie Kräftigung der Rumpf- und Hüftmuskulatur. Für die Schulter ist zusätzlich ein [exzentrisches] Training der Außenrotatoren sinnvoll, weil diese Muskeln den Arm nach dem Abwurf abbremsen.',
 [['Erläutere, wie Kreuzbandverletzungen im Handball häufig entstehen.','Oft ohne Gegnerkontakt bei Landungen oder Richtungswechseln, wenn das Knie nach innen knickt.'],['Begründe, warum für die Schulter exzentrisches Training der Außenrotatoren sinnvoll ist.','Die Außenrotatoren bremsen den Wurfarm nach dem Abwurf ab – das ist eine exzentrische Belastung, die gezielt trainiert werden sollte.']]],
['Methoden der Spielvermittlung','Für die Vermittlung des Handballspiels gibt es verschiedene Wege. Die [Ganzheitsmethode] lässt von Anfang an spielen und vereinfacht nur die Rahmenbedingungen. Die [Teilmethode] zerlegt das Spiel in Elemente wie Fangen, Werfen und Abwehrverhalten, die zunächst einzeln geübt werden. Ein Mittelweg ist die [Spielreihe]: Eine Abfolge von Spielformen, deren Komplexität von Stufe zu Stufe zunimmt, etwa vom Parteiball über Spiele mit Zonen bis zum Zielspiel. Im Kinderhandball wird oft [Minihandball] auf kleinem Feld mit weichem Ball gespielt, damit alle viele Ballkontakte haben. Entscheidend für die Wahl der Methode sind die Lernvoraussetzungen der Gruppe und das Ziel der Stunde.',
 [['Vergleiche Ganzheits- und Teilmethode.','Ganzheitsmethode: von Beginn an spielen, vereinfachte Bedingungen. Teilmethode: Zerlegung in Elemente, die einzeln geübt werden.'],['Beurteile den Einsatz einer Spielreihe in einer heterogenen Klasse.','Pro: schrittweise Steigerung, alle spielen, Differenzierung möglich. Contra: Technikdefizite bleiben ggf. bestehen. Eigenes begründetes Urteil.']]]
]}

L:{
u:{t:'Volleyball verstehen', s:[
['Den Ball in der Luft halten','Beim Volleyball spielen zwei Mannschaften, die durch ein [Netz] getrennt sind. Ziel ist es, den Ball so über das Netz zu spielen, dass er im gegnerischen Feld den Boden berührt. Jede Mannschaft darf den Ball höchstens [dreimal|drei|3] berühren, bevor er wieder über das Netz muss. Beim [Pritschen] wird der Ball mit den Fingern über der Stirn gespielt. Beim [Baggern] spielt man den Ball mit den Unterarmen, die dabei eine gerade Fläche bilden. Jeder Ballwechsel beginnt mit einem Aufschlag hinter der Grundlinie. Ein Satz endet bei 25 Punkten, wenn eine Mannschaft mindestens zwei Punkte Vorsprung hat.',
 [['Wie oft darf eine Mannschaft den Ball berühren, bevor er über das Netz muss?','Höchstens dreimal.'],['Beschreibe den Unterschied zwischen Pritschen und Baggern.','Pritschen: oberes Zuspiel mit den Fingern über der Stirn. Baggern: unteres Zuspiel mit den gestreckten Unterarmen.']]],
['Pritschen und Baggern genau erklärt','Beim Pritschen bilden die Hände ein [Körbchen] über der Stirn. Daumen und Zeigefinger beider Hände formen dabei ein Dreieck, durch das man den Ball sehen kann. Die Knie sind leicht gebeugt. Beim Spielen strecken sich Arme und Beine gleichzeitig, und der Ball wird mit den [Fingern] weich nach oben gedrückt. Beim Baggern werden die Hände ineinandergelegt, die Daumen liegen nebeneinander. Die Arme sind [gestreckt] und bilden eine Fläche. Der Ball wird nicht mit den Armen geschlagen, sondern die Bewegung kommt aus den [Beinen]: Man geht in die Knie und streckt sie beim Spielen. So wird der Ball genauer und gleichmäßiger.',
 [['Wie sehen die Hände beim Pritschen aus?','Sie bilden ein Körbchen über der Stirn; Daumen und Zeigefinger formen ein Dreieck.'],['Woher kommt beim Baggern die Kraft?','Aus den Beinen: Man beugt die Knie und streckt sie beim Spielen; die Arme bleiben gestreckt.']]],
['Wichtige Regeln','Landet der Ball genau auf der [Linie], zählt er als „im Feld“. Berührt eine Spielerin beim Spielen des Balles das Netz zwischen den Antennen, ist das ein Fehler. Auch wenn derselbe Spieler den Ball zweimal hintereinander berührt, ist das ein Fehler, ein sogenannter [Doppelfehler] oder eine Doppelberührung. Der Ball darf nicht festgehalten oder geworfen werden, sondern muss gespielt werden. Eine Ausnahme gibt es beim [Block]: Die Berührung am Netz zählt nicht als eine der drei Ballberührungen. Jeder Fehler bringt der anderen Mannschaft einen Punkt. Diese Zählweise heißt [Rally-Point]-System: Bei jedem Ballwechsel gibt es einen Punkt, egal wer aufgeschlagen hat.',
 [['Zählt ein Ball auf der Linie als „aus“ oder „im Feld“?','Im Feld.'],['Was bedeutet Rally-Point-System?','Bei jedem Ballwechsel gibt es einen Punkt, unabhängig davon, wer aufgeschlagen hat.']]],
['Geschichte des Volleyballs','Volleyball wurde 1895 von William G. Morgan in Holyoke in den USA erfunden. Er suchte ein Spiel für Erwachsene, das weniger Körperkontakt hatte als Basketball. Zuerst hieß das Spiel „[Mintonette]“. Heute wird Volleyball in der Halle und am Strand gespielt. [Beachvolleyball] wird mit zwei Spielern pro Team im Sand gespielt und ist seit 1996 olympisch. Deutsche Spielerinnen gewannen 2016 olympisches [Gold] im Beachvolleyball. In der Schule spielt man häufig Kleinfeldvolleyball mit zwei oder drei Spielern pro Team. So bekommt jeder oft den Ball und kann die [Technik] besser lernen.',
 [['Wer erfand Volleyball und wann?','William G. Morgan, 1895 in Holyoke (USA).'],['Warum spielt man in der Schule oft Kleinfeldvolleyball?','Jeder bekommt oft den Ball und kann die Technik besser lernen.']]]
]},
m:{t:'Volleyball: Technik und Taktik', s:[
['Rotation, Positionen und Spielaufbau','Eine Volleyballmannschaft hat sechs Spielerinnen und Spieler auf dem Feld, drei vorne am Netz und drei hinten. Die Positionen sind von I bis VI nummeriert; auf Position I steht die Person, die aufschlägt. Gewinnt eine Mannschaft das Aufschlagrecht vom Gegner zurück, rückt sie eine Position im [Uhrzeigersinn] weiter. Das nennt man [Rotation]. Der typische Spielaufbau besteht aus drei Schritten: die [Annahme] des gegnerischen Aufschlags (meist im Bagger), das Zuspiel durch den [Zuspieler] und der Angriff, oft als Schmetterball. Spieler der hinteren Reihe dürfen im Vorderfeld keinen Ball angreifen, der sich vollständig oberhalb der Netzkante befindet.',
 [['Wann und in welche Richtung rotiert eine Mannschaft?','Wenn sie das Aufschlagrecht vom Gegner zurückgewinnt, eine Position im Uhrzeigersinn.'],['Beschreibe den Spielaufbau in drei Schritten.','Annahme (meist Bagger), Zuspiel durch den Zuspieler, Angriff (z. B. Schmetterball).']]],
['Der Angriffsschlag','Der Schmetterball beginnt mit einem [Anlauf] aus meist drei oder vier Schritten. Der vorletzte Schritt ist lang und schnell; danach werden beide Füße nebeneinander aufgesetzt. Gleichzeitig schwingen beide Arme nach hinten und dann kraftvoll nach oben, um den Absprung zu unterstützen. Abgesprungen wird [beidbeinig]. In der Luft ist der Körper gespannt wie ein Bogen, der Schlagarm wird mit hohem Ellbogen zurückgeführt. Der Ball wird im [höchsten] Punkt vor dem Körper getroffen. Durch das Abklappen des [Handgelenks] bekommt der Ball eine Vorwärtsdrehung, den Topspin. Dadurch fällt er steiler nach unten und ist schwerer anzunehmen. Gelandet wird beidbeinig und weich, ohne das Netz zu berühren.',
 [['Beschreibe den Anlauf und Absprung beim Schmetterball.','Drei bis vier Schritte, vorletzter Schritt lang und schnell, Füße nebeneinander aufsetzen, Arme schwingen nach hinten und oben, beidbeiniger Absprung.'],['Welche Wirkung hat das Abklappen des Handgelenks?','Der Ball erhält Topspin und fällt steiler nach unten.']]],
['Block und Feldabwehr','Der [Block] ist die erste Verteidigungslinie. Die Spieler am Netz springen mit nach oben gestreckten Armen ab und versuchen, den Angriffsschlag direkt zurückzuschlagen oder abzubremsen. Dabei springen sie etwas [später] ab als der Angreifer, weil dieser den Ball erst am höchsten Punkt trifft. Die Hände sollen über die Netzkante in das gegnerische Feld greifen. Hinter dem Block steht die [Feldabwehr]. Sie stellt sich so auf, dass sie Bälle abdeckt, die am Block vorbei oder über ihn hinweg kommen. Die Spieler stehen tief, mit gebeugten Knien und dem Gewicht auf den [Fußballen], damit sie schnell reagieren können.',
 [['Warum springt der Blockspieler etwas später ab als der Angreifer?','Weil der Angreifer den Ball erst am höchsten Punkt seines Sprungs trifft.'],['Welche Aufgabe hat die Feldabwehr?','Sie deckt Bälle ab, die am Block vorbei oder darüber kommen.']]],
['Aufschlagarten','Es gibt verschiedene Aufschlagarten. Der Aufschlag [von unten] ist leicht zu lernen und wird vor allem bei Anfängern genutzt. Beim [Tennisaufschlag] wird der Ball hochgeworfen und von oben getroffen, ähnlich wie beim Schmetterball. Eine besondere Form ist der [Flatteraufschlag]: Der Ball wird hart und ohne Drehung getroffen. Weil er nicht rotiert, wird er von Luftwirbeln unregelmäßig abgelenkt und flattert. Für die Annahme ist er dadurch schwer berechenbar. Im Leistungsbereich wird häufig der [Sprungaufschlag] genutzt: Der Spieler läuft an, springt ab und schlägt den Ball im Sprung mit viel Kraft und Topspin. Er ist sehr schnell, birgt aber ein höheres Fehlerrisiko.',
 [['Warum ist der Flatteraufschlag schwer anzunehmen?','Der Ball rotiert nicht und wird von Luftwirbeln unregelmäßig abgelenkt; seine Flugbahn ist schwer berechenbar.'],['Nenne Vor- und Nachteil des Sprungaufschlags.','Vorteil: sehr schnell und kraftvoll. Nachteil: höheres Fehlerrisiko.']]]
]},
o:{t:'Volleyball aus Sicht der Sportwissenschaft', s:[
['Wahrnehmung und Antizipation','Ein harter Aufschlag braucht bis zum Gegner oft weniger als eine Sekunde. Um rechtzeitig reagieren zu können, nutzen Spieler verschiedene Analysatoren: Der [optische] Analysator liefert Informationen über Flugbahn und Position des Balles, der [kinästhetische] Analysator meldet die Stellung und Bewegung der eigenen Gelenke und Muskeln, der vestibuläre Analysator sorgt für das Gleichgewicht. Erfahrene Spieler warten nicht, bis der Ball fliegt, sondern nutzen Hinweisreize aus der Bewegung des Gegners, etwa die Stellung des Schlagarms. Diese Vorwegnahme nennt man [Antizipation]. Die [Reaktionszeit] selbst lässt sich nur begrenzt trainieren, die Qualität der Antizipation dagegen deutlich, zum Beispiel durch Videotraining und viele Spielsituationen.',
 [['Erläutere, welche Analysatoren bei der Aufschlagannahme beteiligt sind.','Optisch (Flugbahn, Position), kinästhetisch (Gelenkstellung, Muskelspannung), vestibulär (Gleichgewicht), ggf. akustisch (Schlaggeräusch).'],['Warum ist Antizipation besser trainierbar als die Reaktionszeit?','Die Reaktionszeit ist weitgehend anlagebedingt; Antizipation beruht auf Erfahrung und Wissen über Hinweisreize.']]],
['Physik des Balles: Topspin und Flatterball','Ein rotierender Ball erfährt in der Luft eine Querkraft, den [Magnus-Effekt]. Bei Topspin dreht sich die Oberseite des Balles in Flugrichtung. Dadurch strömt die Luft an der Unterseite schneller vorbei, es entsteht eine nach [unten] gerichtete Kraft, und der Ball fällt steiler ab. Ein Angreifer kann dadurch härter schlagen, ohne dass der Ball über die Grundlinie fliegt. Der Flatteraufschlag nutzt das Gegenteil: Ohne Rotation löst sich die Luftströmung an wechselnden Stellen der Balloberfläche ab. Es entstehen unregelmäßige [Wirbel], die den Ball seitlich und in der Höhe versetzen. Ob ein Ball flattert, hängt unter anderem von seiner Geschwindigkeit und der [Oberflächenstruktur] ab.',
 [['Erkläre den Magnus-Effekt beim Topspin.','Durch die Rotation entsteht ein Druckunterschied zwischen Ober- und Unterseite; eine nach unten gerichtete Kraft lässt den Ball steiler fallen.'],['Erkläre, warum ein Flatterball unberechenbar fliegt.','Ohne Rotation löst sich die Strömung an wechselnden Stellen ab; unregelmäßige Wirbel versetzen den Ball.']]],
['Sprungbelastung und Prävention','In einem Volleyballspiel springen Angreifer und Blockspieler sehr häufig. Die [Sprungkraft] ist deshalb leistungsbestimmend. Sie beruht auf Maximalkraft, Schnellkraft und der Fähigkeit, den Dehnungs-Verkürzungs-Zyklus zu nutzen. Die hohe Zahl an Sprüngen und Landungen belastet die Patellasehne. Eine typische Überlastungsbeschwerde ist das [Patellaspitzensyndrom], auch „Jumper’s Knee“ genannt. Zur Vorbeugung gehören eine angemessene Steuerung der Sprungumfänge, Kräftigung der Oberschenkelmuskulatur – besonders [exzentrisch] – und eine saubere Landetechnik mit beidbeiniger, weicher Landung. Auch Sprunggelenksverletzungen sind häufig, oft wenn ein Spieler nach dem Block auf dem Fuß eines anderen Spielers landet. [Propriozeptives] Training kann hier das Risiko senken.',
 [['Was ist das Patellaspitzensyndrom und wie entsteht es?','Überlastungsbeschwerde der Patellasehne („Jumper’s Knee“), entsteht durch viele Sprünge und Landungen.'],['Nenne drei Maßnahmen zur Prävention.','Sprungumfänge steuern, exzentrische Kräftigung der Oberschenkelmuskulatur, saubere Landetechnik, propriozeptives Training.']]],
['Methodische Spielreihe','Volleyball gilt als technisch anspruchsvoll, weil der Ball nicht gefangen werden darf. Anfänger erleben deshalb oft kurze Ballwechsel und wenig Erfolg. Eine [methodische Spielreihe] löst dieses Problem, indem die Spielform schrittweise komplexer wird: vom 1:1 über 2:2 und 3:3 bis zum 6:6. Auf kleinen Feldern mit wenigen Spielern hat jeder viele [Ballkontakte]. Zusätzlich können Regeln vereinfacht werden, etwa durch erlaubtes Fangen und Werfen in der ersten Stufe oder einen [leichteren] Ball. Die Spielreihe folgt dem Prinzip, dass das Spielen von Anfang an im Mittelpunkt steht, während die Technik in passenden Übungsformen ergänzt wird. Kritisch zu prüfen ist, ab wann die vereinfachten Regeln den [Lernfortschritt] eher hemmen als fördern.',
 [['Erläutere den Aufbau einer methodischen Spielreihe im Volleyball.','Vom 1:1 über 2:2 und 3:3 bis 6:6; kleine Felder, vereinfachte Regeln (Fangen/Werfen, leichterer Ball), Technik ergänzend.'],['Beurteile vereinfachte Regeln wie Fangen und Werfen.','Pro: längere Ballwechsel, Erfolgserlebnisse, taktisches Lernen. Contra: Technik wird später gelernt, Umstellung kann schwerfallen. Eigenes Urteil.']]]
]}
},

SPORTS.push({id:'bm', name:'Badminton', bf:'BF 7 · Partnerspiele', field:'badminton',
L:{
u:{t:'Badminton verstehen', s:[
['Schnell wie ein Federball','Badminton spielt man mit einem Schläger und einem [Federball], der nur etwa fünf Gramm wiegt und 16 Federn hat. Gespielt wird im Einzel (eins gegen eins) oder im [Doppel] (zwei gegen zwei). Das Netz hängt an den Pfosten 1,55 Meter hoch. Der Aufschlag wird [diagonal] ins gegenüberliegende Feld gespielt und von unten geschlagen. Ein Satz geht bis 21 Punkte. Mit einem hohen, weiten Schlag, dem [Clear], treibt man den Gegner nach hinten. Ein kurzer Schlag knapp hinter das Netz heißt Drop. Der härteste Schlag ist der [Smash], ein steiler Schlag nach unten.',
 [['Wohin wird der Aufschlag gespielt?','Diagonal ins gegenüberliegende Aufschlagfeld.'],['Nenne drei Schlagarten und beschreibe sie kurz.','Clear: hoch und weit nach hinten. Drop: kurz hinter das Netz. Smash: hart und steil nach unten.']]],
['Griff und Bereitschaft','Der wichtigste Griff ist der [Universalgriff]. Man nimmt den Schläger so in die Hand, als würde man jemandem die Hand geben. Der Schläger wird locker gehalten und erst beim Schlag fest gedrückt. Zwischen den Schlägen steht man in der [Bereitschaftsstellung]: Die Füße stehen etwa schulterbreit, die Knie sind leicht gebeugt, und der Schläger wird vor dem Körper nach [oben] gehalten. Das Gewicht liegt auf den Fußballen. So kann man in jede Richtung schnell starten. Nach jedem eigenen Schlag geht man wieder in die [Mitte] des Feldes zurück, denn von dort aus erreicht man alle Ecken am schnellsten.',
 [['Wie hält man den Universalgriff?','So, als würde man jemandem die Hand geben; locker halten, erst beim Schlag fest drücken.'],['Warum geht man nach jedem Schlag in die Feldmitte zurück?','Von dort erreicht man alle Ecken am schnellsten.']]],
['Der schnellste Ballsport','Badminton gilt als die Sportart mit dem schnellsten Schlag. Bei Messungen erreichten Profis mit dem Smash Anfangsgeschwindigkeiten von über [500] Kilometern pro Stunde. Trotzdem kommt der Federball beim Gegner viel langsamer an. Der Grund sind die [Federn]: Sie bremsen den Ball in der Luft sehr stark ab, das nennt man [Luftwiderstand]. Außerdem sorgen die Federn dafür, dass sich der Ball immer mit dem runden Korken nach vorne dreht. Deshalb fliegt ein Federball ganz anders als ein Tennisball: Nach einem hohen Schlag fällt er fast [senkrecht] herunter. Für Anfänger ist das hilfreich, weil man genug Zeit hat, unter den Ball zu laufen.',
 [['Warum kommt der Federball beim Gegner viel langsamer an?','Die Federn erzeugen einen großen Luftwiderstand und bremsen den Ball stark ab.'],['Wie fällt ein Federball nach einem hohen Schlag?','Fast senkrecht nach unten.']]],
['Geschichte und Fairness','Der Name Badminton stammt von einem Landsitz in England, dem Badminton House. Dort soll das Spiel im 19. Jahrhundert beliebt gewesen sein. Seit [1992] ist Badminton olympisch. Besonders erfolgreich sind Spielerinnen und Spieler aus [Asien], zum Beispiel aus China, Indonesien und Dänemark als europäischer Ausnahme. Im Badminton gibt es oft keinen Schiedsrichter, deshalb ist [Ehrlichkeit] wichtig: Wer den Ball auf seiner Seite im Aus sieht, sagt laut „aus“ und zeigt mit dem Arm. Bei Unsicherheit wird der Ballwechsel [wiederholt]. Am Ende gibt man sich die Hand über dem Netz.',
 [['Seit wann ist Badminton olympisch?','Seit 1992.'],['Was macht man im Badminton ohne Schiedsrichter, wenn man unsicher ist, ob der Ball aus war?','Der Ballwechsel wird wiederholt.']]]
]},
m:{t:'Badminton: Technik und Taktik', s:[
['Spielidee und Taktik','Im Einzel versucht man, den Gegner möglichst viel laufen zu lassen. Dazu spielt man den Federball abwechselnd in die Ecken des Feldes. Nach jedem eigenen Schlag kehrt man in die [Basisposition] in der Mitte des Feldes zurück. Ein hoher [Clear] verschafft Zeit, um die eigene Position zu verbessern. Ein Drop zwingt den Gegner nach vorn, danach ist das hintere Feld offen. Im Doppel gibt es zwei Grundaufstellungen: In der Angriffsstellung stehen die Partner [hintereinander], damit vorne Bälle am Netz abgefangen und hinten Smashs geschlagen werden können. In der Abwehrstellung stehen sie [nebeneinander], damit jeder eine Feldhälfte verteidigt.',
 [['Wie kann man Clear und Drop taktisch kombinieren?','Mit Clear den Gegner nach hinten treiben, dann mit Drop nach vorne zwingen (oder umgekehrt).'],['Beschreibe Angriffs- und Abwehrstellung im Doppel.','Angriff: hintereinander (vorne Netz, hinten Smash). Abwehr: nebeneinander, jeder deckt eine Feldhälfte.']]],
['Die Überkopftechnik','Clear, Drop und Smash werden mit derselben Grundbewegung geschlagen. Das macht sie für den Gegner schwer zu unterscheiden. Ein Rechtshänder steht in [Seitstellung], die linke Schulter zeigt zum Netz. Der freie Arm zeigt zum Federball und hilft beim Zielen und Ausbalancieren. Der Schlagarm wird mit hohem [Ellbogen] zurückgeführt, der Schläger fällt hinter den Rücken. Der Treffpunkt liegt [vor] und über dem Körper, so hoch wie möglich. Die Kraft entsteht durch eine Kette: Beine, Hüftdrehung, Schulter, Ellbogen und schließlich die Einwärtsdrehung des Unterarms, die [Pronation]. Ob ein Clear, Drop oder Smash entsteht, entscheiden erst kurz vor dem Treffpunkt der Schlägerwinkel und das Tempo.',
 [['Warum werden Clear, Drop und Smash mit derselben Grundbewegung geschlagen?','Der Gegner kann sie schwer unterscheiden und erst spät erkennen, welcher Schlag kommt.'],['Wo liegt der Treffpunkt bei der Überkopftechnik?','Vor und über dem Körper, so hoch wie möglich.']]],
['Laufwege','Badminton wird zu einem großen Teil mit den Beinen entschieden. Für Wege nach vorne zum Netz nutzt man einen langen [Ausfallschritt]: Das Schlagarmbein wird nach vorne gesetzt, die Ferse setzt zuerst auf, das Knie bleibt über dem Fuß. Nach hinten bewegt man sich mit [Nachstellschritten] oder einem Umsprung, damit man in Seitstellung zum Schlag kommt. Wichtig ist der [Split-Step]: ein kleiner Sprung genau in dem Moment, in dem der Gegner schlägt. Er bringt die Muskeln unter Vorspannung und ermöglicht einen schnellen Start in jede Richtung. Gute Spieler bewegen sich effizient und kehren nach jedem Schlag zügig zur Basisposition zurück.',
 [['Beschreibe den Ausfallschritt zum Netz.','Schlagarmbein nach vorne, Ferse setzt zuerst auf, Knie bleibt über dem Fuß.'],['Welche Funktion hat der Split-Step?','Kleiner Sprung beim Schlag des Gegners; Vorspannung der Muskulatur ermöglicht schnellen Start in jede Richtung.']]],
['Regeln beim Aufschlag und Zählen','Wer einen Ballwechsel gewinnt, bekommt einen Punkt und hat den nächsten Aufschlag. Ist der eigene Punktestand [gerade] (0, 2, 4 …), schlägt man aus dem rechten Aufschlagfeld auf, bei ungeradem Punktestand aus dem linken. Das Aufschlagfeld ist im Einzel [lang und schmal], im Doppel [kurz und breit]. Beim Aufschlag muss der Federball unterhalb einer festgelegten Höhe getroffen werden, und beide Füße bleiben am Boden. Ein Satz endet bei 21 Punkten; steht es 20:20, wird so lange gespielt, bis eine Seite zwei Punkte Vorsprung hat, höchstens bis 30. Gewonnen hat, wer zuerst zwei Sätze gewinnt. Im Doppel wechselt nur der Aufschläger der punktenden Mannschaft die Seite.',
 [['Aus welchem Feld schlägt man bei 7 Punkten auf?','Aus dem linken Aufschlagfeld (ungerader Punktestand).'],['Wie unterscheiden sich die Aufschlagfelder im Einzel und Doppel?','Einzel: lang und schmal. Doppel: kurz und breit.']]]
]},
o:{t:'Badminton aus Sicht der Sportwissenschaft', s:[
['Belastungsgestaltung','Badminton ist ein Sport mit vielen kurzen, intensiven Belastungen. Ein Ballwechsel dauert meist nur wenige Sekunden, danach folgt eine kurze Pause. Die Energie für die explosiven Aktionen stammt vor allem aus der [anaerob-alaktaziden|anaerob alaktaziden] Energiebereitstellung (ATP und Kreatinphosphat). In den Pausen muss sich der Körper erholen; das gelingt besser mit einer gut entwickelten [aeroben] Ausdauer. Um diese Belastung zu trainieren, eignet sich die [Intervallmethode]: Belastungs- und Erholungsphasen wechseln sich planmäßig ab. Die Erholungsphase wird als [lohnende Pause] gestaltet – sie endet, bevor sich der Körper vollständig erholt hat. Ein Trainingsplan wird über die Belastungsgrößen gesteuert: Intensität, Dauer, Umfang, Dichte und Häufigkeit.',
 [['Erläutere, welche Energiebereitstellung im Badminton dominiert.','Bei den kurzen Ballwechseln vor allem anaerob-alaktazid; die aerobe Ausdauer unterstützt die Erholung in den Pausen.'],['Erläutere die Intervallmethode und die lohnende Pause.','Planmäßiger Wechsel von Belastung und Erholung; die Pause endet vor der vollständigen Erholung.']]],
['Biomechanik des Smashs','Die hohe Schlägerkopfgeschwindigkeit beim Smash entsteht nicht durch einen einzelnen Muskel, sondern durch eine [kinematische Kette]. Sie beginnt beim Abdruck der Beine, setzt sich über die Rotation von Hüfte und Rumpf fort und endet bei Ellbogenstreckung, [Pronation] des Unterarms und Handgelenksbewegung. Untersuchungen zeigen, dass gerade die Einwärtsdrehung des Unterarms und die Innenrotation der Schulter einen großen Anteil an der Endgeschwindigkeit haben. Biomechanisch entspricht das dem Prinzip der [Koordination der Teilimpulse]. Der lange, leichte Schläger wirkt als [Hebel]: Eine kleine Winkelgeschwindigkeit im Handgelenk erzeugt am Schlägerkopf eine hohe Bahngeschwindigkeit. Ein früher Treffpunkt vor dem Körper ermöglicht zusätzlich einen steilen Abflugwinkel.',
 [['Erläutere die kinematische Kette beim Smash.','Beinabdruck → Hüft- und Rumpfrotation → Schulter → Ellbogenstreckung → Pronation → Handgelenk; Impulse werden zeitlich abgestimmt weitergegeben.'],['Erkläre die Hebelwirkung des Schlägers.','Bei gleicher Winkelgeschwindigkeit ist die Bahngeschwindigkeit am Ende eines langen Hebels größer.']]],
['Wahrnehmung und Täuschung','Weil der Federball beim Smash zunächst extrem schnell ist, bleibt dem Verteidiger kaum Zeit. Spitzenspieler nutzen deshalb [Antizipation]: Sie lesen aus Körperhaltung, Armbewegung und Schlägerstellung des Gegners ab, welcher Schlag kommt. Gleichzeitig versuchen Angreifer, genau diese Informationen zu verschleiern. Bei einer [Täuschung] wird die Bewegung eines Schlages begonnen und kurz vor dem Treffpunkt verändert, etwa vom angedeuteten Smash zum Drop. Wer früh auf den angedeuteten Schlag reagiert, kann seine Bewegung nur verzögert korrigieren. Studien mit [Videosequenzen], die kurz vor dem Treffpunkt abgebrochen werden, zeigen, dass Experten die Schlagrichtung deutlich besser vorhersagen als Anfänger. Dieses Expertenwissen ist [trainierbar].',
 [['Wie funktioniert eine Täuschung im Badminton?','Der Schlag wird wie ein anderer begonnen und kurz vor dem Treffpunkt verändert; der Gegner reagiert auf den angedeuteten Schlag und muss verzögert korrigieren.'],['Was zeigen Studien mit abgebrochenen Videosequenzen?','Experten sagen die Schlagrichtung deutlich besser vorher als Anfänger; Antizipation ist erfahrungsabhängig und trainierbar.']]],
['Leistungsdiagnostik','Um Training zu steuern, muss Leistung gemessen werden. Dazu dienen [sportmotorische Tests], zum Beispiel ein Laufwegetest zu den sechs Ecken des Feldes. Die Herzfrequenz zeigt die körperliche Beanspruchung an; das subjektive Anstrengungsempfinden kann mit der [Borg-Skala] von 6 bis 20 erfasst werden. Gute Tests müssen die Gütekriterien erfüllen: [Objektivität] (das Ergebnis hängt nicht von der testenden Person ab), [Reliabilität] (das Ergebnis ist bei Wiederholung zuverlässig) und [Validität] (der Test misst tatsächlich das, was er messen soll). Ein Ausdauertest auf dem Laufband ist zum Beispiel objektiv und reliabel, aber für Badminton nur eingeschränkt valide, weil er die Richtungswechsel nicht abbildet.',
 [['Erläutere die drei Hauptgütekriterien.','Objektivität: unabhängig von der Testperson. Reliabilität: zuverlässig bei Wiederholung. Validität: misst das, was gemessen werden soll.'],['Beurteile die Validität eines Laufbandtests für Badminton.','Eingeschränkt valide, weil Richtungswechsel, Sprünge und intermittierende Belastung fehlen.']]]
]}
},

fe:[{t:'Überkopf-Clear',pose:'clearLow',obs:'Ein Schüler schlägt einen Clear. Der Federball fliegt flach und landet in der Mitte des gegnerischen Feldes.',sol:['Der Treffpunkt liegt zu tief und zu weit hinter bzw. neben dem Kopf; der Arm ist nicht gestreckt.','Der Spieler läuft zu spät unter den Ball oder steht frontal statt in Seitstellung.','Früh in Seitstellung hinter den Ball laufen, freier Arm zeigt zum Ball, Treffpunkt hoch vor dem Körper; Übung: Federball am Seil oder hochgeworfen treffen.']},
